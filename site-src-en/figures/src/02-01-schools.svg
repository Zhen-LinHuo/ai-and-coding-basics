<svg xmlns="http://www.w3.org/2000/svg" width="920" height="360" viewBox="0 0 920 360">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/></marker>
</defs>
<text x="20" y="30" font-size="16" font-weight="bold" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">The three schools =  = "where intelligence comes from" answered three ways</text>
<g font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#000000">
<rect x="40" y="60" width="260" height="240" rx="10" fill="#ffffff" stroke="#D55E00" stroke-width="2"/>
<text x="56" y="88" font-size="15" font-weight="bold" fill="#D55E00">Symbolism</text>
<text x="56" y="114">Answer: intelligence comes from reasoning,</text>
<text x="56" y="134">and reasoning is the manipulation of symbols.</text>
<text x="56" y="166">Knowledge representation: explicit</text>
<text x="56" y="186">rules and facts ("birds can fly").</text>
<text x="56" y="218">Examples: logic, expert systems,</text>
<text x="56" y="238">chess programs.</text>
<text x="56" y="274" fill="#999999">Slogan: intelligence = symbol manipulation.</text>
<rect x="330" y="60" width="260" height="240" rx="10" fill="#ffffff" stroke="#0072B2" stroke-width="2"/>
<text x="346" y="88" font-size="15" font-weight="bold" fill="#0072B2">Connectionism</text>
<text x="346" y="114">Answer: intelligence comes from how many simple</text>
<text x="346" y="134">units are connected, like a brain.</text>
<text x="346" y="166">Knowledge representation: spread across the</text>
<text x="346" y="186">connection weights, readable by nobody line by line.</text>
<text x="346" y="218">Examples: the perceptron, deep learning,</text>
<text x="346" y="238">large language models.</text>
<text x="346" y="274" fill="#999999">Slogan: intelligence = emerges from data.</text>
<rect x="620" y="60" width="260" height="240" rx="10" fill="#ffffff" stroke="#009E73" stroke-width="2"/>
<text x="636" y="88" font-size="15" font-weight="bold" fill="#009E73">Behaviourism</text>
<text x="636" y="114">Answer: intelligence comes from</text>
<text x="636" y="134" font-size="9.0">interaction——with the environment: act, take feedback, improve.</text>
<text x="636" y="166" font-size="11.9">Knowledge representation: no"stockpile"-style</text>
<text x="636" y="186">knowledge, only a policy for acting.</text>
<text x="636" y="218">Examples: cybernetics, robotics,</text>
<text x="636" y="238">reinforcement learning.</text>
<text x="636" y="274" fill="#999999" font-size="10.1">Slogan: intelligence = discovered by trial and error.</text>
</g>
<text x="40" y="336" font-size="14" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">Do the three answers conflict? No. Today's strong systems usually borrow a bit of each——see the end of this chapter.</text>

</svg>