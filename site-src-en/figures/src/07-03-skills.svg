<svg xmlns="http://www.w3.org/2000/svg" width="940" height="340" viewBox="0 0 940 340">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/></marker>
</defs>
<text x="20" y="30" font-size="16" font-weight="bold" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">Skills: not stuffed into context, fetched on demand</text>
<g font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#000000">
<rect x="60" y="80" width="340" height="180" rx="10" fill="#ffffff" stroke="#D55E00" stroke-width="2"/>
<text x="230" y="110" text-anchor="middle" font-weight="bold" fill="#D55E00">Prompts crammed in (fully preloaded)</text>
<text x="80" y="140">System prompt + + all instructions + + all history ………</text>
<text x="80" y="166" fill="#999999">the context fills up fast; </text>
<text x="80" y="192" fill="#999999">most of it is irrelevant to the current task; </text>
<text x="80" y="218" fill="#999999">irrelevant content also distracts the model.</text>
<rect x="560" y="80" width="340" height="180" rx="10" fill="#ffffff" stroke="#009E73" stroke-width="2"/>
<text x="730" y="110" text-anchor="middle" font-weight="bold" fill="#009E73">Skills (catalogue only, loaded on demand)</text>
<text x="580" y="140">One line in context: </text>
<text x="580" y="166" fill="#999999">""skills A/B/C exist,  A/B/Ceach covers what"; "</text>
<text x="580" y="192" font-size="10.8">when a job falls to  A , only then is  A 's full text fetched; </text>
<text x="580" y="218" fill="#999999">used and released, the context stays clean.</text>
</g>
<path d="M 402 170 L 558 170" stroke="#000000" stroke-width="2" marker-end="url(#arr)"/>
<text x="480" y="158" font-size="13" text-anchor="middle" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">Improved</text>
<text x="60" y="310" font-size="9.9" font-family="Noto Sans CJK SC, sans-serif" fill="#000000">Skills vs prompts: a prompt is ""the words you carry every time""; a skill is ""a book borrowed from the library as needed" "——catalogue always resident, body on demand.</text>
</svg>