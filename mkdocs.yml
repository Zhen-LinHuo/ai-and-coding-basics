site_name: 人工智能和计算机开发基础
site_description: 写给想真正理解它如何运转的读者
site_url: https://zhen-linhuo.github.io/ai-and-coding-basics/
repo_url: https://github.com/Zhen-LinHuo/ai-and-coding-basics
edit_uri: blob/main/content/
docs_dir: site-src

theme:
  name: material
  language: zh
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 切换暗色模式
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 切换亮色模式
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js


extra:
  alternate:
    - name: English
      link: /ai-and-coding-basics/en/
      lang: en
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Zhen-LinHuo/ai-and-coding-basics

copyright: >
  CC BY-SA 4.0 (正文) · Apache-2.0 (代码) &copy; 2026 Zhen-Lin Huo

