<svg xmlns="http://www.w3.org/2000/svg" width="850" height="420" viewBox="0 0 850 420">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/></marker>
<marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0072B2"/></marker>
</defs>
<text x="20" y="30" font-size="16" font-weight="bold" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">One forward pass: from prompt ...to one character of the answer</text>
<g font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#000000">
<rect x="40" y="90" width="150" height="120" rx="10" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
<text x="115" y="118" text-anchor="middle" font-weight="bold">your input</text>
<text x="115" y="146" text-anchor="middle">"write a poem about</text>
<text x="115" y="170" text-anchor="middle">spring"</text>
<text x="115" y="198" text-anchor="middle" fill="#999999">split into N tokens token</text>
<rect x="260" y="90" width="180" height="120" rx="10" fill="#56B4E9" fill-opacity="0.2" stroke="#0072B2" stroke-width="2"/>
<text x="350" y="118" text-anchor="middle" font-weight="bold">neural network</text>
<text x="350" y="146" text-anchor="middle">dozens to hundreds of layers, each:</text>
<text x="350" y="172" text-anchor="middle">attention + small network</text>
<text x="350" y="198" text-anchor="middle" fill="#999999">all parameters frozen (inference)</text>
<rect x="510" y="90" width="170" height="120" rx="10" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
<text x="595" y="118" text-anchor="middle" font-weight="bold">next token probability table</text>
<text x="595" y="150" text-anchor="middle">"spring" 62%·"breeze" 8%</text>
<text x="595" y="174" text-anchor="middle">"flowers" 5%·……</text>
<text x="595" y="198" text-anchor="middle" fill="#999999">draw one by strategy</text>
</g>
<path d="M 192 150 L 258 150" stroke="#000000" stroke-width="2" marker-end="url(#arr)"/>
<path d="M 442 150 L 508 150" stroke="#000000" stroke-width="2" marker-end="url(#arr)"/>
<path d="M 682 150 L 740 150" stroke="#000000" stroke-width="2" marker-end="url(#arr)"/>
<rect x="742" y="90" width="90" height="120" rx="10" fill="#E69F00"/>
<text x="787" y="146" text-anchor="middle" fill="#ffffff" font-size="15">"spring"</text>
<path d="M 787 214 C 787 260 500 260 120 226" stroke="#999999" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
<text x="440" y="266" font-size="9.0" fill="#999999" font-family="Noto Sans CJK SC, sans-serif">append to the end of the input, run again——that is how a poem grows one character at a time</text>
<text x="40" y="392" font-size="13.9" font-family="Noto Sans CJK SC, sans-serif" fill="#000000">what you see"a fluent long text"all of it is this loop running hundreds of times: each pass adds one character.</text>
</svg>