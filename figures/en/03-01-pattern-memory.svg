<text x="86" y="52" font-size="13" text-anchor="middle" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">Stored: "ten"</text>
<g font-size="14" font-family="Noto Sans CJK SC, sans-serif" fill="#000000">
<text x="250" y="86">Nine neurons, all pairs linked: 36 weights;</text>
<text x="250" y="110">one rule fixed at store time:</text>
<text x="250" y="140" fill="#009E73">same colour: weight +1 (green)</text>
<text x="250" y="164" fill="#D55E00">different colour: weight -1 (red dashed)</text>
<text x="250" y="194">No training; the weights are the memory.</text>
</g>
