<svg xmlns="http://www.w3.org/2000/svg" width="940" height="340" viewBox="0 0 940 340">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/></marker>
</defs>
<text x="20" y="30" font-size="16" font-weight="bold" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">Imperative: record steps. Declarative: record the destination.</text>
<g font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#000000">
<rect x="40" y="70" width="400" height="200" rx="10" fill="#ffffff" stroke="#D55E00" stroke-width="2"/>
<text x="240" y="100" text-anchor="middle" font-weight="bold" fill="#D55E00">Imperative (recipe)</text>
<text x="60" y="130">1. apt install A-1.2</text>
<text x="60" y="158">2. hand-edit line 3 of the config file</text>
<text x="60" y="186">3. download and unpack B into /opt</text>
<text x="60" y="214" fill="#999999">Each machine runs a different order and history; </text>
<text x="60" y="240" fill="#999999">drift happens quietly, nobody knows where.</text>
<rect x="500" y="70" width="400" height="200" rx="10" fill="#ffffff" stroke="#009E73" stroke-width="2"/>
<text x="700" y="100" text-anchor="middle" font-weight="bold" fill="#009E73">Declarative (destination)</text>
<text x="520" y="130">"The state I want: A, B, config C."</text>
<text x="520" y="158">The tool works out the path from here to there.</text>
<text x="520" y="186" fill="#999999">The same declaration, on any machine, </text>
<text x="520" y="214" fill="#999999">converges on the same destination.</text>
<text x="520" y="244" fill="#009E73">Reinstall = re-declare, not re-remember.</text>
</g>
<text x="40" y="310" font-size="12.1" font-family="Noto Sans CJK SC, sans-serif" fill="#000000">Imperative knowledge lives in heads and chat logs; declarative knowledge</text><text x="40" y="325.7" font-size="12.1" font-family="Noto Sans CJK SC, sans-serif" fill="#000000">lives in the repository — version-controlled, reviewable, revertible.</text>
</svg>