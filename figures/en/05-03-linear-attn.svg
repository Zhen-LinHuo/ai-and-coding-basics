<svg xmlns="http://www.w3.org/2000/svg" width="900" height="350" viewBox="0 0 900 350">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/></marker>
<marker id="arrv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D55E00"/></marker>
</defs>
<text x="20" y="30" font-size="16" font-weight="bold" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">One formula, two algorithms</text>
<rect x="40" y="70" width="380" height="100" rx="10" fill="#ffffff" stroke="#0072B2" stroke-width="2"/>
<text x="230" y="102" font-size="14" text-anchor="middle" font-weight="bold" fill="#0072B2" font-family="Noto Sans CJK SC, sans-serif">form A : compute all pairs first</text>
<text x="230" y="130" font-size="13" text-anchor="middle" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">(QKᵀ)V : then×n  attention matrix is built first</text>
<text x="230" y="154" font-size="13" text-anchor="middle" fill="#999999" font-family="Noto Sans CJK SC, sans-serif">compute and memory ~ n²</text>
<rect x="480" y="70" width="380" height="100" rx="10" fill="#ffffff" stroke="#009E73" stroke-width="2"/>
<text x="670" y="102" font-size="14" text-anchor="middle" font-weight="bold" fill="#009E73" font-family="Noto Sans CJK SC, sans-serif">form B : merge keys and values first</text>
<text x="670" y="130" font-size="13" text-anchor="middle" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">Q(KᵀV) : first use K andV  to accumulate a state matrix</text>
<text x="670" y="154" font-size="13" text-anchor="middle" fill="#999999" font-family="Noto Sans CJK SC, sans-serif">compute and memory ~ n</text>
<path d="M 425 120 L 475 120" stroke="#000000" stroke-width="2" marker-end="url(#arr)"/>
<text x="450" y="108" font-size="10" text-anchor="middle" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">associativity</text>
<text x="450" y="142" font-size="10" text-anchor="middle" fill="#999999" font-family="Noto Sans CJK SC, sans-serif">same result</text>
<g font-size="14" font-family="Noto Sans CJK SC, sans-serif" fill="#000000">
<text x="60" y="230">the only cost:softmax  is gone. Remove"normalisation", and the weighted average can be rewritten as</text>
<text x="60" y="256">"state accumulated with each input", a recurrence——that is, an RNN  form.</text>
<text x="60" y="292" fill="#0072B2" font-size="13.6">So one network can take two shapes: trains like attention (parallel), infers like RNN (step by step, cheap on memory).</text>
<text x="60" y="318" fill="#999999">This is"linear attention": replace n² with n, at a slight cost in expressiveness——, hence hybrids (next figure).</text>
</g>
</svg>