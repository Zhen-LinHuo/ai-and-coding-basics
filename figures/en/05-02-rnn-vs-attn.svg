<text x="20" y="30" font-size="16" font-weight="bold" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">Recurrent network vs attention: Chinese whispers vs a round table</text>
<text x="60" y="80" font-size="15" font-weight="bold" fill="#D55E00" font-family="Noto Sans CJK SC, sans-serif">recurrent network (RNN) word by word</text>
<circle cx="60" cy="120" r="18" fill="#ffffff" stroke="#D55E00" stroke-width="1.8"/>
<path d="M 79 120 L 130 120" stroke="#D55E00" stroke-width="2" marker-end="url(#arr)"/>
