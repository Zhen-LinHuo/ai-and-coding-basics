<circle cx="690" cy="120" r="18" fill="#ffffff" stroke="#D55E00" stroke-width="1.8"/>

<text x="60" y="170" font-size="11.9" fill="#999999" font-family="Noto Sans CJK SC, sans-serif">each word only gets a"summary" compressed from the previous one; the farther apart, the more early information wears away.</text>
<text x="60" y="240" font-size="15" font-weight="bold" fill="#0072B2" font-family="Noto Sans CJK SC, sans-serif">attention: any two words connect directly</text>
<circle cx="60" cy="280" r="18" fill="#ffffff" stroke="#0072B2" stroke-width="1.8"/>
<circle cx="150" cy="280" r="18" fill="#ffffff" stroke="#0072B2" stroke-width="1.8"/>
