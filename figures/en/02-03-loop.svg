<svg xmlns="http://www.w3.org/2000/svg" width="780" height="400" viewBox="0 0 780 400">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/></marker>
</defs>
<text x="20" y="30" font-size="16" font-weight="bold" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">The behaviourist loop: act, get feedback, improve</text>
<rect x="80" y="120" width="180" height="80" rx="12" fill="#56B4E9" stroke="#000000" stroke-width="1.5"/>
<text x="170" y="154" font-size="16" text-anchor="middle" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">Agent</text>
<text x="170" y="178" font-size="13" text-anchor="middle" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">(the one that acts)</text>
<rect x="520" y="120" width="180" height="80" rx="12" fill="#E69F00" stroke="#000000" stroke-width="1.5"/>
<text x="610" y="154" font-size="16" text-anchor="middle" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">Environment</text>
<text x="610" y="178" font-size="13" text-anchor="middle" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">(the one that won't accommodate it)</text>
<path d="M 262 145 L 518 145" stroke="#000000" stroke-width="2" marker-end="url(#arr)"/>
<text x="390" y="130" font-size="15" text-anchor="middle" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">action</text>
<path d="M 518 185 L 262 185" stroke="#000000" stroke-width="2" marker-end="url(#arr)"/>
<text x="390" y="212" font-size="15" text-anchor="middle" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">feedback (score/penalty/new situation)</text>
<g font-size="14" font-family="Noto Sans CJK SC, sans-serif" fill="#000000">
<text x="80" y="278">Nobody tells it the "right answer"; the environment just says "good move/bad move".</text>
<text x="80" y="302" font-size="13.2">The intelligence is not in any rule base; it is a policy accumulated over tens of thousands of loops.</text>
<text x="80" y="336" fill="#999999" font-size="13.5">A child learning to walk, a player grinding a level, an algorithm playing chess: same loop diagram.</text>
<text x="80" y="376" fill="#009E73">This loop gets its proper name later: reinforcement learning.</text>
</g>

</svg>