<svg xmlns="http://www.w3.org/2000/svg" width="820" height="440" viewBox="0 0 820 440">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/></marker>
</defs>
<text x="20" y="30" font-size="16" font-weight="bold" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">The precision ladder: how many bits each number takes</text>
<g font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#000000">
<rect x="60" y="80" width="700" height="56" fill="#0072B2" stroke="#000000" stroke-width="1.2"/>
<text x="410" y="114" font-size="14" text-anchor="middle" fill="#ffffff" font-weight="bold">fp32 (32 bits): the default precision for training</text>
<rect x="60" y="146" width="350" height="56" fill="#009E73" stroke="#000000" stroke-width="1.2"/>
<text x="235" y="180" font-size="14" text-anchor="middle" fill="#ffffff" font-weight="bold">fp16 / bf16 (16 bits): common for training</text>
<rect x="60" y="212" width="175" height="56" fill="#E69F00" stroke="#000000" stroke-width="1.2"/>
<text x="147" y="246" font-size="14" text-anchor="middle" fill="#ffffff" font-weight="bold">fp8 (8 bits)</text>
<rect x="60" y="278" width="88" height="56" fill="#D55E00" stroke="#000000" stroke-width="1.2"/>
<text x="104" y="312" font-size="14" text-anchor="middle" fill="#ffffff" font-weight="bold">int4</text>
</g>
<g font-size="14" font-family="Noto Sans CJK SC, sans-serif" fill="#000000">
<text x="60" y="368" font-size="11.4">VRAM use drops from 4 parts down to 0.5 parts; quantised to int4 and even a consumer graphics card can hold a very large model.</text>
<text x="60" y="394" fill="#D55E00" font-size="13.9">The cost: the numerical "fine detail" drops — in extreme cases, rare knowledge is the first to be erased.</text>
<text x="60" y="420" fill="#999999" font-size="9.5">In practice, int4 quality loss is usually small; the trade-off between "it runs" and "it won't run" is what really matters.</text>
</g>
</svg>