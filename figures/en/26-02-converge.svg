<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/></marker>
</defs>
<text x="20" y="30" font-size="16" font-weight="bold" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">One declaration, three machines, one result</text>
<g font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#000000">
<rect x="60" y="90" width="300" height="120" rx="10" fill="#ffffff" stroke="#0072B2" stroke-width="2"/>
<text x="210" y="120" text-anchor="middle" font-weight="bold" fill="#0072B2">System configuration (one file)</text>
<text x="80" y="150" font-size="13" fill="#999999">Declares: which packages, which services, </text>
<text x="80" y="174" font-size="13" fill="#999999">which users, which firewall rules.</text>
<text x="80" y="198" font-size="13" fill="#999999">This file goes into version control</text>
</g>
<path d="M 362 150 C 430 120 470 120 518 134" stroke="#000000" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
<path d="M 362 152 L 518 219" stroke="#000000" stroke-width="1.8" marker-end="url(#arr)"/>
<path d="M 362 154 C 430 200 470 260 518 302" stroke="#000000" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
<g font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#000000">
<rect x="525" y="100" width="150" height="70" rx="8" fill="#56B4E9" stroke="#000000" stroke-width="1.3"/><text x="600" y="140" text-anchor="middle">Laptop</text>
<rect x="525" y="185" width="150" height="70" rx="8" fill="#56B4E9" stroke="#000000" stroke-width="1.3"/><text x="600" y="225" text-anchor="middle">Server</text>
<rect x="525" y="270" width="150" height="70" rx="8" fill="#56B4E9" stroke="#000000" stroke-width="1.3"/><text x="600" y="310" text-anchor="middle">Old machine (rescue)</text>
</g>
<text x="60" y="380" font-size="10.8" font-family="Noto Sans CJK SC, sans-serif" fill="#000000">Three machines, one declaration, the same system state — "A new machine usable within the hour" is this declaration's payoff.</text>
</svg>