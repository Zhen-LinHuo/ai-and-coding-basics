<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/></marker>
</defs>
<text x="20" y="30" font-size="16" font-weight="bold" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">One sentence: English in 4 chunks, Chinese 11 chunks</text>
<rect x="60" y="70" width="94" height="44" rx="6" fill="#56B4E9" stroke="#000000" stroke-width="1"/><text x="107.0" y="97" text-anchor="middle" font-size="15" font-family="Noto Sans CJK SC, sans-serif" fill="#000000">un</text><rect x="160" y="70" width="120" height="44" rx="6" fill="#56B4E9" stroke="#000000" stroke-width="1"/><text x="220.0" y="97" text-anchor="middle" font-size="15" font-family="Noto Sans CJK SC, sans-serif" fill="#000000">believ</text><rect x="286" y="70" width="70" height="44" rx="6" fill="#56B4E9" stroke="#000000" stroke-width="1"/><text x="321.0" y="97" text-anchor="middle" font-size="15" font-family="Noto Sans CJK SC, sans-serif" fill="#000000">able</text><rect x="362" y="70" width="60" height="44" rx="6" fill="#56B4E9" stroke="#000000" stroke-width="1"/><text x="392.0" y="97" text-anchor="middle" font-size="15" font-family="Noto Sans CJK SC, sans-serif" fill="#000000">ly</text>
<text x="436" y="97" font-size="14" font-family="Noto Sans CJK SC, sans-serif" fill="#000000">unbelievably</text>
<text x="60" y="146" font-size="14" font-family="Noto Sans CJK SC, sans-serif" fill="#999999">English "whole word" is long but familiar; 3-4 chunks do.</text>
<rect x="60" y="180" width="44" height="44" rx="6" fill="#E69F00" stroke="#000000" stroke-width="1"/><text x="82" y="207" text-anchor="middle" font-size="15" font-family="Noto Sans CJK SC, sans-serif" fill="#000000">wo</text><rect x="110" y="180" width="44" height="44" rx="6" fill="#E69F00" stroke="#000000" stroke-width="1"/><text x="132" y="207" text-anchor="middle" font-size="15" font-family="Noto Sans CJK SC, sans-serif" fill="#000000">jue</text><rect x="160" y="180" width="44" height="44" rx="6" fill="#E69F00" stroke="#000000" stroke-width="1"/><text x="182" y="207" text-anchor="middle" font-size="15" font-family="Noto Sans CJK SC, sans-serif" fill="#000000">de</text><rect x="210" y="180" width="44" height="44" rx="6" fill="#E69F00" stroke="#000000" stroke-width="1"/><text x="232" y="207" text-anchor="middle" font-size="15" font-family="Noto Sans CJK SC, sans-serif" fill="#000000">zhe</text><rect x="260" y="180" width="44" height="44" rx="6" fill="#E69F00" stroke="#000000" stroke-width="1"/><text x="282" y="207" text-anchor="middle" font-size="15" font-family="Noto Sans CJK SC, sans-serif" fill="#000000">ge</text><rect x="310" y="180" width="44" height="44" rx="6" fill="#E69F00" stroke="#000000" stroke-width="1"/><text x="332" y="207" text-anchor="middle" font-size="15" font-family="Noto Sans CJK SC, sans-serif" fill="#000000">xiang</text><rect x="360" y="180" width="44" height="44" rx="6" fill="#E69F00" stroke="#000000" stroke-width="1"/><text x="382" y="207" text-anchor="middle" font-size="15" font-family="Noto Sans CJK SC, sans-serif" fill="#000000">fa</text><rect x="410" y="180" width="44" height="44" rx="6" fill="#E69F00" stroke="#000000" stroke-width="1"/><text x="432" y="207" text-anchor="middle" font-size="15" font-family="Noto Sans CJK SC, sans-serif" fill="#000000">nan</text><rect x="460" y="180" width="44" height="44" rx="6" fill="#E69F00" stroke="#000000" stroke-width="1"/><text x="482" y="207" text-anchor="middle" font-size="15" font-family="Noto Sans CJK SC, sans-serif" fill="#000000">yi</text><rect x="510" y="180" width="44" height="44" rx="6" fill="#E69F00" stroke="#000000" stroke-width="1"/><text x="532" y="207" text-anchor="middle" font-size="15" font-family="Noto Sans CJK SC, sans-serif" fill="#000000">zhi</text><rect x="560" y="180" width="44" height="44" rx="6" fill="#E69F00" stroke="#000000" stroke-width="1"/><text x="582" y="207" text-anchor="middle" font-size="15" font-family="Noto Sans CJK SC, sans-serif" fill="#000000">xin</text>
<text x="82" y="248" font-size="13" font-family="Noto Sans CJK SC, sans-serif" fill="#666666">(one cell per character)</text>
<text x="60" y="276" font-size="13.0" font-family="Noto Sans CJK SC, sans-serif" fill="#999999">Chinese has no spaces and all characters are common, so BPE</text><text x="60" y="292.9" font-size="13.0" font-family="Noto Sans CJK SC, sans-serif" fill="#999999">rarely merges them: the same sentence costs 2-3x the chunks.</text>
<g font-size="14" font-family="Noto Sans CJK SC, sans-serif" fill="#000000">
<text x="60" y="311.1">That's why long Chinese hits "the context limit" — a later section foreshadows this.</text>
</g>
</svg>