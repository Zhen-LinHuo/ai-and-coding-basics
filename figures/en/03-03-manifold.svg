</defs>
<text x="20" y="30" font-size="16" font-weight="bold" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">Manifold: data lives on a curled sheet; learning unrolls it</text>
<text y="76" font-size="14.0" text-anchor="middle" fill="#000000" font-family="Noto Sans CJK SC, sans-serif" x="129.0">In 30M dimensions: a curled sheet</text>
<path d="M 80 270 C 180 70, 300 70, 280 250 C 270 350, 180 330, 80 270 Z" fill="#56B4E9" fill-opacity="0.25" stroke="#0072B2" stroke-width="2"/><circle cx="100" cy="250" r="5" fill="#E69F00"/><circle cx="119" cy="232" r="5" fill="#E69F00"/><circle cx="137" cy="214" r="5" fill="#E69F00"/><circle cx="156" cy="198" r="5" fill="#E69F00"/><circle cx="175" cy="184" r="5" fill="#E69F00"/><circle cx="193" cy="173" r="5" fill="#E69F00"/><circle cx="212" cy="165" r="5" fill="#E69F00"/><circle cx="231" cy="161" r="5" fill="#E69F00"/><circle cx="249" cy="160" r="5" fill="#E69F00"/><circle cx="268" cy="164" r="5" fill="#E69F00"/><circle cx="287" cy="171" r="5" fill="#E69F00"/><circle cx="305" cy="181" r="5" fill="#E69F00"/><circle cx="324" cy="195" r="5" fill="#E69F00"/><circle cx="343" cy="210" r="5" fill="#E69F00"/><circle cx="361" cy="228" r="5" fill="#E69F00"/><circle cx="380" cy="246" r="5" fill="#E69F00"/>
<text y="392" font-size="11.0" text-anchor="middle" fill="#000000" font-family="Noto Sans CJK SC, sans-serif" x="129.1">All "one cat" photos crowd near this sheet</text>
<path d="M 430 210 L 530 210" stroke="#000000" stroke-width="2" marker-end="url(#arr)"/>
<text x="480" y="192" font-size="13" text-anchor="middle" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">learning=unroll</text>
<text x="680" y="76" font-size="14" text-anchor="middle" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">Unrolled: the pattern is plain</text>
<path d="M 530 260 L 830 260 L 830 160 L 530 160 Z" fill="#56B4E9" fill-opacity="0.25" stroke="#0072B2" stroke-width="2"/><circle cx="550" cy="180" r="5" fill="#E69F00"/><circle cx="567" cy="180" r="5" fill="#E69F00"/><circle cx="585" cy="252" r="5" fill="#E69F00"/><circle cx="602" cy="162" r="5" fill="#E69F00"/><circle cx="619" cy="234" r="5" fill="#E69F00"/><circle cx="637" cy="144" r="5" fill="#E69F00"/><circle cx="654" cy="216" r="5" fill="#E69F00"/><circle cx="671" cy="216" r="5" fill="#E69F00"/><circle cx="689" cy="198" r="5" fill="#E69F00"/><circle cx="706" cy="198" r="5" fill="#E69F00"/><circle cx="723" cy="180" r="5" fill="#E69F00"/><circle cx="741" cy="180" r="5" fill="#E69F00"/><circle cx="758" cy="252" r="5" fill="#E69F00"/><circle cx="775" cy="162" r="5" fill="#E69F00"/><circle cx="793" cy="234" r="5" fill="#E69F00"/><circle cx="810" cy="144" r="5" fill="#E69F00"/>
<text x="680" y="392" font-size="13" text-anchor="middle" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">Two directions on the sheet = cat pose and light</text>
<g font-size="14" font-family="Noto Sans CJK SC, sans-serif" fill="#000000">
<text x="120" y="446">Dimension is material; pattern lives on a low-dim sheet. The net learns not 30M-dim space,</text>
<text x="120" y="470">but this sheet's shape — know the sheet, and every cat falls into place.</text>
</g>
