<svg xmlns="http://www.w3.org/2000/svg" width="920" height="360" viewBox="0 0 920 360">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/></marker>
</defs>
<text x="20" y="30" font-size="16" font-weight="bold" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">Seventy years: three changes of lead</text>
<line x1="60" y1="230" x2="880" y2="230" stroke="#000000" stroke-width="2" marker-end="url(#arr)"/>
<g font-family="Noto Sans CJK SC, sans-serif" font-size="13" fill="#000000">
<text x="60" y="62" fill="#D55E00">Symbolism's golden age: proving theorems, writing rules, confidence</text>
<text x="60" y="79" fill="#D55E00">peaking in a famous claim — " machines will be able to do any work a</text>
<text x="60" y="96" fill="#D55E00">person can within a generation ".</text>
<text x="60" y="119" fill="#999999">(It never came true. The price was two "AI winters": funding withdrawn,</text>
<text x="60" y="136" fill="#999999">the field renamed itself to survive.)</text>
<text x="530" y="62" fill="#0072B2">Connectionism survived both winters: 1986 backpropagation solved</text>
<text x="530" y="79" fill="#0072B2">"how multilayer networks learn", and 2012 compute and data finally</text>
<text x="530" y="96" fill="#0072B2">caught up.</text>
<text x="530" y="119" fill="#009E73">Behaviourism runs all the way through, from cybernetics to</text>
<text x="530" y="136" fill="#009E73">reinforcement learning — never the headline, never off stage.</text>
<circle cx="110" cy="230" r="9" fill="#D55E00"/>
<text x="110" y="204" font-size="12.5" text-anchor="middle">1956</text>
<text x="110" y="188" font-size="12.5" text-anchor="middle">Dartmouth conference</text>
<text x="110" y="173" font-size="12.5" text-anchor="middle" fill="#666666">symbolism takes the stage</text>
<circle cx="250" cy="230" r="9" fill="#0072B2"/>
<text x="250" y="256" font-size="12.5" text-anchor="middle">1958</text>
<text x="250" y="272" font-size="12.5" text-anchor="middle">perceptron</text>
<text x="250" y="287" font-size="12.5" text-anchor="middle" fill="#666666">connectionism's debut</text>
<circle cx="390" cy="230" r="9" fill="#999999"/>
<text x="390" y="204" font-size="12.5" text-anchor="middle">1969</text>
<text x="390" y="188" font-size="12.5" text-anchor="middle">XOR criticism</text>
<text x="390" y="173" font-size="12.5" text-anchor="middle" fill="#666666">connectionism enters winter</text>
<circle cx="530" cy="230" r="9" fill="#E69F00"/>
<text x="530" y="256" font-size="12.5" text-anchor="middle">1980s</text>
<text x="530" y="272" font-size="12.5" text-anchor="middle">expert-system boom</text>
<text x="530" y="287" font-size="12.5" text-anchor="middle" fill="#666666">then the tide goes out</text>
<circle cx="670" cy="230" r="9" fill="#0072B2"/>
<text x="670" y="204" font-size="12.5" text-anchor="middle">1986</text>
<text x="670" y="188" font-size="12.5" text-anchor="middle">backpropagation</text>
<text x="670" y="173" font-size="12.5" text-anchor="middle" fill="#666666">connectionism revives</text>
<circle cx="810" cy="230" r="9" fill="#0072B2"/>
<text x="810" y="256" font-size="12.5" text-anchor="middle">2012</text>
<text x="810" y="272" font-size="12.5" text-anchor="middle">deep learning explodes</text>
<text x="810" y="287" font-size="12.5" text-anchor="middle" fill="#666666">lead role ever since</text>
</g>
</svg>
