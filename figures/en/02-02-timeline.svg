<svg xmlns="http://www.w3.org/2000/svg" width="920" height="300" viewBox="0 0 920 300">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/></marker>
</defs>
<text x="20" y="30" font-size="16" font-weight="bold" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">Seventy years: three changes of lead</text>
<line x1="60" y1="200" x2="880" y2="200" stroke="#000000" stroke-width="2" marker-end="url(#arr)"/>
<g font-family="Noto Sans CJK SC, sans-serif" font-size="13" fill="#000000">
<circle cx="120" cy="200" r="9" fill="#D55E00"/><text x="120" y="176" text-anchor="middle">1956</text>
<text x="120" y="234" text-anchor="middle">Dartmouth conference</text>
<text x="120" y="252" text-anchor="middle">symbolism takes the stage</text>
<circle cx="270" cy="200" r="9" fill="#0072B2"/><text x="270" y="176" text-anchor="middle">1958</text>
<text x="270" y="234" text-anchor="middle">perceptron</text>
<text x="270" y="252" text-anchor="middle">connectionism's debut</text>
<circle cx="400" cy="200" r="9" fill="#999999"/><text x="400" y="176" text-anchor="middle">1969</text>
<text x="400" y="234" text-anchor="middle">XOR criticism</text>
<text x="400" y="252" text-anchor="middle">connectionism enters winter</text>
<circle cx="520" cy="200" r="9" fill="#E69F00"/><text x="520" y="176" text-anchor="middle">1980s</text>
<text x="520" y="234" text-anchor="middle">expert-system boom</text>
<text x="520" y="252" text-anchor="middle">then the tide goes out</text>
<circle cx="640" cy="200" r="9" fill="#0072B2"/><text x="640" y="176" text-anchor="middle">1986</text>
<text x="640" y="234" text-anchor="middle">backpropagation</text>
<text x="640" y="252" text-anchor="middle">connectionism revives</text>
<circle cx="760" cy="200" r="9" fill="#0072B2"/><text x="760" y="176" text-anchor="middle">2012</text>
<text x="760" y="234" text-anchor="middle">deep learning explodes</text>
<text x="760" y="252" text-anchor="middle">lead role ever since</text>
</g>
<g font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#000000">
<text x="60" y="86" fill="#D55E00">Symbolism's golden age: proving theorems, writing rules,</text>
<text x="60" y="108" fill="#D55E00">confidence peaking in a famous claim:——"machines will be able to do any work a person can within a generation".</text>
<text x="60" y="140" fill="#999999">(It never came true. The price was two"AI winters": funding withdrawn, the field renamed itself to survive.)</text>
<text x="560" y="86" fill="#0072B2" font-size="10.8">Connectionism survived both winters:1986 backpropagation solved</text>
<text x="560" y="108" fill="#0072B2" font-size="9.5">"how multilayer networks learn",2012 compute and data finally caught up.</text>
<text x="560" y="140" fill="#009E73" font-size="9.0">Behaviourism runs all the way through, from cybernetics to reinforcement learning, never the headline, never off stage.</text>
</g>

</svg>