<svg xmlns="http://www.w3.org/2000/svg" width="900" height="290" viewBox="0 0 900 290">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/></marker>
<marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#0072B2"/></marker>
<marker id="arrv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#D55E00"/></marker>
</defs>

<text x="20" y="34" font-size="17" font-weight="bold" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">A perceptron does it all in three steps</text>
<g font-family="Noto Sans CJK SC, sans-serif" font-size="16" fill="#000000">
<rect x="40" y="70" width="120" height="40" rx="8" fill="#E69F00" stroke="#000000" stroke-width="1.5"/>
<text x="100" y="96" text-anchor="middle">Coursework x₁</text>
<rect x="40" y="170" width="120" height="40" rx="8" fill="#E69F00" stroke="#000000" stroke-width="1.5"/>
<text x="100" y="196" text-anchor="middle">Exam x₂</text>
</g>
<path d="M 160 90 L 330 118 M 160 190 L 330 162" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="216" y="86" font-size="15" fill="#D55E00" font-family="Noto Sans CJK SC, sans-serif">weight w₁ = 0.3</text>
<text x="216" y="206" font-size="15" fill="#D55E00" font-family="Noto Sans CJK SC, sans-serif">weight w₂ = 0.7</text>
<circle cx="370" cy="140" r="36" fill="#56B4E9" stroke="#000000" stroke-width="1.5"/>
<text x="370" y="147" font-size="18" text-anchor="middle" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">Σ</text>
<path d="M 406 140 L 470 140" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="472" y="108" width="180" height="64" rx="10" fill="#009E73" stroke="#000000" stroke-width="1.5"/>
<text x="562" y="134" font-size="15" text-anchor="middle" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">Pass with 60 ?</text>
<text x="562" y="158" font-size="15" text-anchor="middle" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">(threshold)</text>
<path d="M 652 140 L 716 140" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/>
<g font-family="Noto Sans CJK SC, sans-serif" font-size="16" fill="#000000">
<text x="726" y="122" fill="#009E73">≥60 → pass (1)</text>
<text x="726" y="162" fill="#D55E00">&lt;60 → fail (0)</text>
</g>
<text x="40" y="266" font-size="15" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">Output is just 0 and 1  values:"pass or fail" is all it says.</text>

</svg>