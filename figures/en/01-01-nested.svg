<svg xmlns="http://www.w3.org/2000/svg" width="940" height="410" viewBox="0 0 940 410">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/></marker>
</defs>
<text x="20" y="30" font-size="16" font-weight="bold" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">How the four terms nest</text>
<circle cx="260" cy="215" r="170" fill="#56B4E9" fill-opacity="0.25" stroke="#0072B2" stroke-width="1.5"/>
<circle cx="300" cy="235" r="120" fill="#E69F00" fill-opacity="0.3" stroke="#D55E00" stroke-width="1.5"/>
<circle cx="330" cy="255" r="70" fill="#009E73" fill-opacity="0.35" stroke="#009E73" stroke-width="1.5"/>
<circle cx="330" cy="272" r="38" fill="#009E73" fill-opacity="0.5" stroke="#006400" stroke-width="1.5"/>
<text x="330" y="268" font-size="12" text-anchor="middle" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">Large language</text>
<text x="330" y="284" font-size="12" text-anchor="middle" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">models</text>
<text x="330" y="246" font-size="15" text-anchor="middle" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">Deep learning</text>
<text x="300" y="152" font-size="15" text-anchor="middle" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">Machine learning</text>
<text x="260" y="82" font-size="15" text-anchor="middle" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">Artificial intelligence</text>
<g font-size="14" font-family="Noto Sans CJK SC, sans-serif" fill="#000000">
<text x="480" y="80" fill="#0072B2" font-size="9.0">Artificial intelligence: getting machines to do "the things that need intelligence" that goal itself</text>
<text x="480" y="116" fill="#D55E00" font-size="12.3">Machine learning: one means of reaching it — tuning parameters from data</text>
<text x="480" y="152" fill="#009E73" font-size="11.6">Deep learning: a kind of machine learning, using many-layer neural networks</text>
<text x="480" y="188" fill="#000000" font-size="11.6">Large language models: a product of deep learning, predicting the next word</text>
<text x="480" y="236" fill="#999999">How to read it: each ring inwards is a smaller scope,</text>
<text x="480" y="260" fill="#999999" font-size="12.3">but in today's news the "AI" lives almost entirely in the innermost ring.</text>
<text x="480" y="300" fill="#000000" font-size="12.8">The concentric circles are for positioning: on hearing any new term,</text>
<text x="480" y="324" fill="#000000" font-size="11.8">ask which layer it sits in, then how it relates to the neighbouring layer.</text>
</g>

</svg>