<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/></marker>
</defs><text x="20" y="30" font-size="16" font-weight="bold" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">The spectrum: from "use as you like" to "use it and you must open up"</text>
<line x1="80" y1="110" x2="840" y2="110" stroke="#000000" stroke-width="2" marker-end="url(#arr)"/>
<text x="80" y="92" font-size="13" fill="#999999" font-family="Noto Sans CJK SC, sans-serif">Permissive (commercial, closed — fine)</text>
<text x="700" y="92" font-size="13" fill="#999999" font-family="Noto Sans CJK SC, sans-serif">copyleft(infectiously open)</text>
<g font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#000000">
<circle cx="140" cy="110" r="26" fill="#0072B2"/><text x="140" y="116" text-anchor="middle" fill="#ffffff" font-size="12">MIT</text>
<circle cx="260" cy="110" r="26" fill="#0072B2"/><text x="260" y="116" text-anchor="middle" fill="#ffffff" font-size="12">Apache</text>
<circle cx="400" cy="110" r="26" fill="#E69F00"/><text x="400" y="116" text-anchor="middle" fill="#ffffff" font-size="12">LGPL</text>
<circle cx="540" cy="110" r="26" fill="#E69F00"/><text x="540" y="116" text-anchor="middle" fill="#ffffff" font-size="12">MPL</text>
<circle cx="680" cy="110" r="26" fill="#D55E00"/><text x="680" y="116" text-anchor="middle" fill="#ffffff" font-size="12">GPL</text>
<circle cx="790" cy="110" r="26" fill="#D55E00"/><text x="790" y="116" text-anchor="middle" fill="#ffffff" font-size="12">AGPL</text>
</g>
<g font-size="14" font-family="Noto Sans CJK SC, sans-serif" fill="#000000">
<text x="80" y="196" fill="#0072B2">MIT: keep a copyright notice, do as you like.</text>
<text x="80" y="226" fill="#999999">Apache: adds a patent grant; businesses like it.</text>
<text x="80" y="256" fill="#E69F00">MPL: the file you changed must be opened.</text>
<text x="80" y="286" fill="#D55E00">GPL: use my code and your whole work must be open under  GPL .</text>
<text x="80" y="316" fill="#D55E00" font-size="12.2">AGPL: even "serving it over a network" counts as distribution—— — closing the ""a network service isn't distribution"" loophole.</text>
</g>
</svg>