<svg xmlns="http://www.w3.org/2000/svg" width="860" height="420" viewBox="0 0 860 420">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/></marker>
</defs>
<text x="20" y="30" font-size="16" font-weight="bold" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">The Moravec paradox: the harder for people, the easier for machines</text>
<line x1="120" y1="330" x2="800" y2="330" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="120" y1="330" x2="120" y2="60" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="800" text-anchor="end" y="324" font-size="10.5" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">Harder for people</text>
<text x="66" y="56" font-size="14" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">Harder for machines</text>
<circle cx="190" cy="96" r="12" fill="#D55E00"/><circle cx="300" cy="122" r="12" fill="#D55E00"/><circle cx="410" cy="152" r="12" fill="#D55E00"/><circle cx="620" cy="292" r="12" fill="#009E73"/><circle cx="700" cy="266" r="12" fill="#009E73"/><circle cx="660" cy="318" r="12" fill="#009E73"/><text x="190" y="76" font-size="14" text-anchor="middle" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">a baby walking</text><text x="300" y="102" font-size="14" text-anchor="middle" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">hearing tone of voice</text><text x="410" y="132" font-size="14" text-anchor="middle" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">recognising a cat's face</text><text x="620" y="272" font-size="14" text-anchor="middle" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">playing chess</text><text x="700" y="246" font-size="14" text-anchor="middle" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">auditing a whole database</text><text x="660" y="352" font-size="14" text-anchor="middle" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">multiplying 10,000-digit numbers</text>
<g font-size="14" font-family="Noto Sans CJK SC, sans-serif" fill="#000000">
<text x="150" y="378" fill="#D55E00" font-size="11.7">Red (top left): instincts evolution spent hundreds of millions</text><text x="150" y="393.2" fill="#D55E00" font-size="11.7">of years on. Effortless for us, hardest for machines.</text>
<text x="150" y="402" fill="#009E73" font-size="9.8">Green (bottom right): symbol manipulation, invented by civilisation only</text><text x="150" y="414.7" fill="#009E73" font-size="9.8">a few thousand years ago. Laborious for us, trivial for machines.</text>
</g>
</svg>