<svg xmlns="http://www.w3.org/2000/svg" width="900" height="490" viewBox="0 0 900 490">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/></marker>
</defs>
<text x="20" y="30" font-size="16" font-weight="bold" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">BPE: start with characters, merge the commonest pairs step by step</text>
<g font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#000000">
<rect x="60" y="60" width="200" height="50" rx="8" fill="#ffffff" stroke="#D55E00" stroke-width="2"/>
<text x="160" y="90" text-anchor="middle">Naive: one cell per character</text>
<rect x="60" y="150" width="200" height="50" rx="8" fill="#ffffff" stroke="#009E73" stroke-width="2"/>
<text x="160" y="180" text-anchor="middle">Common pairs: one chunk</text>
</g>
<g font-family="Noto Sans CJK SC, sans-serif" font-size="15" fill="#000000">
<text x="330" y="86">t · o · k · e · n (5 cells)</text>
<path d="M 470 80 L 520 80" stroke="#999999" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="530" y="86">Corpus: "to" is frequent</text>
<path d="M 740 80 L 790 80" stroke="#999999" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="800" y="86">merge →</text>
<text x="330" y="156">to · k · e · n (4 cells)</text>
<path d="M 470 150 L 520 150" stroke="#999999" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="530" y="150">"ke" too</text>
<text x="330" y="226">to · ken (2 cells)</text>
</g>
<g font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#000000">
<text x="60" y="300">One rule: count which pair occurs most, weld it into a new symbol, repeat tens of thousands of times.</text>
<text x="60" y="330">So common words merge into chunks, rare ones fall back to characters — one vocabulary for both.</text>
</g>
<line x1="60" y1="360" x2="860" y2="360" stroke="#999999" stroke-width="1"/>
<g font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#000000">
<text x="60" y="392" fill="#D55E00">Vocab too small: cut too fine, sequences long, the "word"'s insides must be assembled.</text>
<text x="60" y="420" fill="#0072B2">Vocab too large: each word a memorised block; rare, misspelt and new words all unknown.</text>
<text x="60" y="456" fill="#000000" font-size="13.1">Model vocab size is a trade-off: the "memorise vs assemble" split — usually tens to hundreds of thousands of chunks.</text>
</g>

</svg>