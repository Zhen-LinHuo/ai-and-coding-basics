<svg xmlns="http://www.w3.org/2000/svg" width="860" height="450" viewBox="0 0 860 450">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/></marker>
</defs>
<text x="20" y="30" font-size="16" font-weight="bold" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">Alignment tax: obedience has a price</text>
<line x1="110" y1="330" x2="800" y2="330" stroke="#000000" stroke-width="1.3" marker-end="url(#arr)"/>
<line x1="110" y1="330" x2="110" y2="70" stroke="#000000" stroke-width="1.3" marker-end="url(#arr)"/>
<text x="800" y="352" text-anchor="end" font-size="11" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">Obedience (safe, polite, rule-following)</text>
<text x="46" y="66" font-size="13" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">Capability (benchmark score)</text>
<circle cx="620" cy="110" r="10" fill="#0072B2"/><text x="620" y="92" text-anchor="middle" font-size="13" fill="#0072B2" font-family="Noto Sans CJK SC, sans-serif">pretrained model</text>
<circle cx="380" cy="150" r="10" fill="#009E73"/><text x="380" y="132" text-anchor="middle" font-size="13" fill="#009E73" font-family="Noto Sans CJK SC, sans-serif">after alignment</text>
<path d="M 640 130 C 560 140 470 146 402 148" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4" fill="none" marker-end="url(#arr)"/>
<text x="470" y="120" font-size="13" fill="#999999" font-family="Noto Sans CJK SC, sans-serif">Path of movement: down and to the left</text>
<g font-size="14" font-family="Noto Sans CJK SC, sans-serif" fill="#000000">
<text x="140" y="372" font-size="9.9">Alignment makes a model more usable and safer, but benchmark scores often</text><text x="140" y="384.9" font-size="9.9">dip slightly—this loss is commonly called" the "alignment tax".</text>
<text x="140" y="398" fill="#D55E00" font-size="9.0">It is not a bug bug, but a real trade: part of the model's" unconstrained capability"</text><text x="140" y="409.7" fill="#D55E00" font-size="9.0">is exchanged for" something that can be safely handed to ordinary people".</text>
<text x="140" y="424" fill="#999999">The argument is over how much tax to levy—and this is part of" aligned to whom" the debate.</text>
</g>
</svg>