<svg xmlns="http://www.w3.org/2000/svg" width="800" height="380" viewBox="0 0 800 380">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/></marker>
</defs>
<text x="20" y="30" font-size="16" font-weight="bold" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">Retrieval augmentation: look it up first, then answer</text>
<g font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#000000">
<rect x="40" y="80" width="170" height="50" rx="8" fill="#56B4E9" stroke="#000000" stroke-width="1.3"/>
<text x="125" y="102" text-anchor="middle" font-size="11">Question: "How is annual</text>
<text x="125" y="116" text-anchor="middle" font-size="11">leave calculated at our</text>
<text x="125" y="130" text-anchor="middle" font-size="11">company?"</text>
<rect x="300" y="80" width="150" height="50" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
<text x="375" y="110" text-anchor="middle">Encode as a vector</text>
<rect x="540" y="60" width="200" height="90" rx="8" fill="#E69F00" fill-opacity="0.35" stroke="#000000" stroke-width="1.3"/>
<text x="640" y="96" text-anchor="middle" font-weight="bold">Knowledge base</text>
<text x="640" y="116" text-anchor="middle" font-size="11" fill="#999999">Company documents,</text>
<text x="640" y="131" text-anchor="middle" font-size="11" fill="#999999">one vector per passage</text>
<text x="640" y="146" text-anchor="middle" font-size="10" fill="#999999">(built offline)</text>
</g>
<path d="M 212 105 L 298 105" stroke="#000000" stroke-width="1.8" marker-end="url(#arr)"/>
<path d="M 452 105 L 538 105" stroke="#000000" stroke-width="1.8" marker-end="url(#arr)"/>
<path d="M 640 152 L 640 200 L 375 200 L 375 176" stroke="#009E73" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
<text x="420" y="222" font-size="9.7" fill="#009E73" font-family="Noto Sans CJK SC, sans-serif">Take the few most similar passages (not keyword matching — "same meaning")</text>
<g font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#000000">
<rect x="300" y="250" width="420" height="60" rx="8" fill="#009E73" fill-opacity="0.2" stroke="#000000" stroke-width="1.3"/>
<text x="510" y="278" text-anchor="middle" font-size="12.5">Hand the retrieved passages + the question to the model</text>
<text x="510" y="298" text-anchor="middle" fill="#999999" font-size="11">The model answers from the passage, not from memory</text>
</g>
<text x="40" y="338" font-size="9.5" font-family="Noto Sans CJK SC, sans-serif" fill="#000000">Why retrieval curbs hallucination: it swaps "making it up from memory"</text>
<text x="40" y="352" font-size="9.5" font-family="Noto Sans CJK SC, sans-serif" fill="#000000">for "saying what the material says". It is no cure: it still invents</text>
<text x="40" y="366" font-size="9.5" font-family="Noto Sans CJK SC, sans-serif" fill="#000000">what the material lacks, and retrieval still errs when it does.</text>
</svg>