<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/></marker>
<marker id="arrv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D55E00"/></marker>
</defs>
<text x="20" y="30" font-size="16" font-weight="bold" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">One network, two lives</text>
<rect x="40" y="70" width="330" height="200" rx="10" fill="#56B4E9" fill-opacity="0.15" stroke="#0072B2" stroke-width="2"/>
<text x="205" y="98" font-size="15" text-anchor="middle" fill="#0072B2" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">Training (once, weeks)</text>
<text x="60" y="130" font-size="12.5" font-family="Noto Sans CJK SC, sans-serif" fill="#000000">Examples → predict → subtract answer → split error</text>
<text x="60" y="158" font-size="12.5" font-family="Noto Sans CJK SC, sans-serif" fill="#000000">→ turn each weight a little → new batch, repeat</text>
<text x="60" y="196" font-size="14" font-family="Noto Sans CJK SC, sans-serif" fill="#D55E00">Knobs move: change happens here</text>
<text x="60" y="224" font-size="14" font-family="Noto Sans CJK SC, sans-serif" fill="#999999">backprop + gradient descent + vast data</text>
<rect x="530" y="70" width="330" height="200" rx="10" fill="#ffffff" stroke="#000000" stroke-width="2"/>
<text x="695" y="98" font-size="15" text-anchor="middle" fill="#000000" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">Inference (billions, ms each)</text>
<text x="550" y="130" font-size="14" font-family="Noto Sans CJK SC, sans-serif" fill="#000000">Question → one forward pass → answer</text>
<text x="550" y="158" font-size="14" font-family="Noto Sans CJK SC, sans-serif" fill="#000000">no examples, answers or gradients</text>
<text x="550" y="196" font-size="14" font-family="Noto Sans CJK SC, sans-serif" fill="#999999">Knobs still: weights frozen</text>
<text x="550" y="224" font-size="14" font-family="Noto Sans CJK SC, sans-serif" fill="#999999">just arithmetic, one forward</text>
<path d="M 380 170 L 520 170" stroke="#000000" stroke-width="2" marker-end="url(#arr)"/>
<text x="450" y="150" font-size="11" text-anchor="middle" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">Training ends,</text>
<text x="450" y="163" font-size="11" text-anchor="middle" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">weights fixed</text>
<text x="450" y="190" font-size="10.5" text-anchor="middle" fill="#999999" font-family="Noto Sans CJK SC, sans-serif">(unless fine-tuned,</text>
<text x="450" y="202" font-size="10.5" text-anchor="middle" fill="#999999" font-family="Noto Sans CJK SC, sans-serif">see above)</text>
<text x="450" y="320" font-size="14" text-anchor="middle" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">Training is "class", inference is "exam":</text>
<text x="450" y="346" font-size="14" text-anchor="middle" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">Open book, but no one marks it.</text>

</svg>