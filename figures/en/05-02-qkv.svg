<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/></marker>
<marker id="arrv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D55E00"/></marker>
</defs>
<text x="20" y="30" font-size="16" font-weight="bold" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">One attention step: a query asks every key, and values are taken by match</text>
<rect x="40" y="140" width="150" height="60" rx="10" fill="#E69F00" stroke="#000000" stroke-width="1.5"/>
<text x="115" y="176" font-size="15" text-anchor="middle" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">"it" (the current word)</text>
<path d="M 196 170 L 288 170" stroke="#000000" stroke-width="2" marker-end="url(#arr)"/>
<text x="242" y="156" font-size="13" text-anchor="middle" fill="#0072B2" font-family="Noto Sans CJK SC, sans-serif">query Q</text>
<rect x="300" y="70" width="230" height="52" rx="8" fill="#56B4E9" fill-opacity="0.35" stroke="#000000" stroke-width="1.3"/>
<text x="415" y="102" font-size="14" text-anchor="middle" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">kitten (key: animal)</text>
<rect x="300" y="144" width="230" height="52" rx="8" fill="#56B4E9" fill-opacity="0.35" stroke="#000000" stroke-width="1.3"/>
<text x="415" y="176" font-size="14" text-anchor="middle" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">chased (key: action)</text>
<rect x="300" y="218" width="230" height="52" rx="8" fill="#56B4E9" fill-opacity="0.35" stroke="#000000" stroke-width="1.3"/>
<text x="415" y="250" font-size="14" text-anchor="middle" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">the sun (key: scene)</text>
<path d="M 290 160 L 300 100" stroke="#D55E00" stroke-width="3.5" fill="none" marker-end="url(#arrv)"/>
<text x="264" y="98" font-size="12" fill="#D55E00" font-family="Noto Sans CJK SC, sans-serif">0.8</text>
<path d="M 292 170 L 300 170" stroke="#999999" stroke-width="2" fill="none" marker-end="url(#arr)"/>
<text x="266" y="176" font-size="12" fill="#999999" font-family="Noto Sans CJK SC, sans-serif">0.15</text>
<path d="M 290 180 L 300 244" stroke="#999999" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
<text x="262" y="250" font-size="12" fill="#999999" font-family="Noto Sans CJK SC, sans-serif">0.05</text>
<path d="M 532 96 L 700 150" stroke="#D55E00" stroke-width="3.5" fill="none" marker-end="url(#arrv)"/>
<path d="M 532 170 L 700 170" stroke="#999999" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>
<path d="M 532 244 L 700 190" stroke="#999999" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>
<circle cx="726" cy="170" r="26" fill="#56B4E9" stroke="#000000" stroke-width="1.5"/>
<text x="726" y="177" font-size="16" text-anchor="middle" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">Σ</text>
<path d="M 754 170 L 800 170" stroke="#000000" stroke-width="2" marker-end="url(#arr)"/>
<text x="808" y="176" font-size="10.8" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">new representation of "it"</text>
<text x="60" y="306" font-size="12.7" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">the higher the match (thicker arrow), the more its "value" contributes: new representation = = 0.8×kitten + 0.15×chased + 0.05×the sun.</text>
<text x="60" y="332" font-size="12.5" fill="#999999" font-family="Noto Sans CJK SC, sans-serif">Match is the dot product, then softmax normalised into percentages by softmax; query, key and value are each a learnable linear transform.</text>
</svg>