<svg xmlns="http://www.w3.org/2000/svg" width="880" height="290" viewBox="0 0 880 290">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/></marker>
</defs>
<text x="20" y="30" font-size="16" font-weight="bold" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">Context budget: one pool of memory that must be shared out</text>
<rect x="60" y="80" width="760" height="70" fill="#56B4E9" fill-opacity="0.3" stroke="#000000" stroke-width="1.3"/>
<rect x="60" y="80" width="180" height="70" fill="#0072B2" stroke="#000000" stroke-width="1.3"/>
<rect x="240" y="80" width="200" height="70" fill="#009E73" fill-opacity="0.6" stroke="#000000" stroke-width="1.3"/>
<rect x="440" y="80" width="200" height="70" fill="#E69F00" fill-opacity="0.6" stroke="#000000" stroke-width="1.3"/>
<rect x="640" y="80" width="180" height="70" fill="#D55E00" fill-opacity="0.5" stroke="#000000" stroke-width="1.3"/>
<text x="150" y="120" font-size="14" text-anchor="middle" fill="#ffffff" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">System prompt</text>
<text x="340" y="120" font-size="14" text-anchor="middle" fill="#000000" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">Conversation history</text>
<text x="540" y="120" font-size="14" text-anchor="middle" fill="#000000" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">Tool results</text>
<text x="730" y="120" font-size="14" text-anchor="middle" fill="#ffffff" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">Left for the answer</text>
<g font-size="14" font-family="Noto Sans CJK SC, sans-serif" fill="#000000">
<text x="60" y="196" font-size="10.1">Four tenants fight over one pool: the system prompt is fixed rent; history grows</text><text x="60" y="209.1" font-size="10.1">with every turn; one page of tool results can cost thousands token tokens;</text>
<text x="60" y="222" font-size="11.3">Too little slack and the answer has nowhere to go. harness The harness's</text><text x="60" y="236.7" font-size="11.3">daily job is deciding what to cut, what to keep, what to compress.</text>
<text x="60" y="258" fill="#D55E00">When it fills up: drop history (amnesia), compress (lose detail), or error out (refuse to work).</text>
</g>
</svg>