<svg xmlns="http://www.w3.org/2000/svg" width="820" height="430" viewBox="0 0 820 430">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/></marker>
</defs>
<text x="20" y="30" font-size="16" font-weight="bold" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">The bootstrap flywheel: models produce data, data trains better models</text>
<g font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#000000">
<rect x="120" y="90" width="200" height="60" rx="10" fill="#56B4E9" stroke="#000000" stroke-width="1.5"/>
<text x="220" y="126" text-anchor="middle" font-weight="bold">Current model</text>
<rect x="480" y="90" width="220" height="60" rx="10" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
<text x="590" y="126" text-anchor="middle" font-weight="bold">Generate data / solutions</text>
<rect x="480" y="240" width="220" height="60" rx="10" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
<text x="590" y="276" text-anchor="middle" font-weight="bold">Filter: keep only correct ones</text>
<rect x="120" y="240" width="200" height="60" rx="10" fill="#009E73" fill-opacity="0.4" stroke="#000000" stroke-width="1.5"/>
<text x="220" y="276" text-anchor="middle" font-weight="bold">Train a stronger model</text>
</g>
<path d="M 322 120 L 478 120" stroke="#000000" stroke-width="2" marker-end="url(#arr)"/>
<path d="M 700 152 C 760 160 760 260 702 268" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#arr)"/>
<path d="M 478 270 L 322 270" stroke="#000000" stroke-width="2" marker-end="url(#arr)"/>
<path d="M 120 240 C 60 220 60 130 118 122" stroke="#000000" stroke-width="2" fill="none" marker-end="url(#arr)"/>
<text x="450" y="220" font-size="13" text-anchor="middle" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">Auto-generated problems, auto-verified (only tasks with a verifier can spin)</text>
<g font-size="14" font-family="Noto Sans CJK SC, sans-serif" fill="#000000">
<text x="60" y="350" fill="#009E73">Prerequisite for spinning: the output can be **auto-verified** (code runs, maths checks out).</text>
<text x="60" y="378" fill="#D55E00" font-size="11.4">Failure point: fields without a verifier (writing, taste) — "judging</text><text x="60" y="392.8" fill="#D55E00" font-size="11.4">itself right"—the flywheel decays into self-admiration.</text>
<text x="60" y="406" fill="#999999" font-size="11.6">STaR 's approach: the model generates solutions, only those reaching</text><text x="60" y="421.1" fill="#999999" font-size="11.6">the correct answer are kept for training[@zelikman2022].</text>
</g>
</svg>