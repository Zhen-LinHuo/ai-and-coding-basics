<svg xmlns="http://www.w3.org/2000/svg" width="880" height="290" viewBox="0 0 880 290">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/></marker>
</defs>
<text x="20" y="30" font-size="16" font-weight="bold" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">上下文预算：一块必须分着花的内存</text>
<rect x="60" y="80" width="760" height="70" fill="#56B4E9" fill-opacity="0.3" stroke="#000000" stroke-width="1.3"/>
<rect x="60" y="80" width="180" height="70" fill="#0072B2" stroke="#000000" stroke-width="1.3"/>
<rect x="240" y="80" width="200" height="70" fill="#009E73" fill-opacity="0.6" stroke="#000000" stroke-width="1.3"/>
<rect x="440" y="80" width="200" height="70" fill="#E69F00" fill-opacity="0.6" stroke="#000000" stroke-width="1.3"/>
<rect x="640" y="80" width="180" height="70" fill="#D55E00" fill-opacity="0.5" stroke="#000000" stroke-width="1.3"/>
<text x="150" y="120" font-size="14" text-anchor="middle" fill="#ffffff" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">系统提示</text>
<text x="340" y="120" font-size="14" text-anchor="middle" fill="#000000" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">对话历史</text>
<text x="540" y="120" font-size="14" text-anchor="middle" fill="#000000" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">工具结果</text>
<text x="730" y="120" font-size="14" text-anchor="middle" fill="#ffffff" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">留给回答</text>
<g font-size="14" font-family="Noto Sans CJK SC, sans-serif" fill="#000000">
<text x="60" y="196">四个租户抢同一块内存：系统提示是固定租金；历史越聊越长；工具结果一页能顶几千 token；</text>
<text x="60" y="222">留白太少，回答就没地方写。harness 的日常就是砍谁、留谁、压缩谁。</text>
<text x="60" y="258" fill="#D55E00">装满之后：要么丢历史（失忆），要么压缩（丢细节），要么报错（拒绝工作）。</text>
</g>
