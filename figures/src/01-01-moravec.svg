<svg xmlns="http://www.w3.org/2000/svg" width="860" height="420" viewBox="0 0 860 420">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/></marker>
</defs>
<text x="20" y="30" font-size="16" font-weight="bold" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">莫拉维克悖论：对人越难的，对机器越容易</text>
<line x1="120" y1="330" x2="800" y2="330" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="120" y1="330" x2="120" y2="60" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="806" y="350" font-size="14" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">对人越难</text>
<text x="66" y="56" font-size="14" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">对机器越难</text>
<circle cx="190" cy="96" r="12" fill="#D55E00"/><circle cx="300" cy="122" r="12" fill="#D55E00"/><circle cx="410" cy="152" r="12" fill="#D55E00"/><circle cx="620" cy="292" r="12" fill="#009E73"/><circle cx="700" cy="266" r="12" fill="#009E73"/><circle cx="660" cy="318" r="12" fill="#009E73"/><text x="190" y="76" font-size="14" text-anchor="middle" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">婴儿走路</text><text x="300" y="102" font-size="14" text-anchor="middle" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">听出语气</text><text x="410" y="132" font-size="14" text-anchor="middle" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">认出猫脸</text><text x="620" y="326" font-size="14" text-anchor="middle" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">下棋</text><text x="700" y="300" font-size="14" text-anchor="middle" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">查全库对账</text><text x="660" y="352" font-size="14" text-anchor="middle" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">算万位数乘法</text>
<g font-size="14" font-family="Noto Sans CJK SC, sans-serif" fill="#000000">
<text x="150" y="378" fill="#D55E00">红色（左上）：进化练了几亿年的本能，人觉得毫不费力，机器偏偏最难。</text>
<text x="150" y="402" fill="#009E73">绿色（右下）：文明只发明了几千年的符号运算，人觉得费劲，机器轻松碾压。</text>
</g>
</svg>