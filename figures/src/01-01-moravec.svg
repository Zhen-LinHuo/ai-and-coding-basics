<svg xmlns="http://www.w3.org/2000/svg" width="860" height="420" viewBox="0 0 860 420">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/></marker>
</defs>
<text x="20" y="30" font-size="16" font-weight="bold" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">莫拉维克悖论：对机器，难的简单，简单的难</text>
<line x1="120" y1="330" x2="800" y2="330" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="120" y1="330" x2="120" y2="60" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="806" y="350" font-size="14" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">对人越难</text>
<text x="66" y="56" font-size="14" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">对机器越难</text>
<circle cx="170" cy="96" r="12" fill="#D55E00"/><text x="170" y="76" font-size="14" text-anchor="middle" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">婴儿走路</text>
<circle cx="260" cy="118" r="12" fill="#D55E00"/><text x="260" y="98" font-size="14" text-anchor="middle" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">听出语气</text>
<circle cx="360" cy="148" r="12" fill="#D55E00"/><text x="360" y="128" font-size="14" text-anchor="middle" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">认出猫脸</text>
<circle cx="640" cy="290" r="12" fill="#009E73"/><text x="230" y="320" font-size="14" text-anchor="middle" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">下棋</text>
<circle cx="760" cy="264" r="12" fill="#009E73"/><text x="150" y="294" font-size="14" text-anchor="middle" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">算万位数乘法</text>
<circle cx="500" cy="268" r="12" fill="#009E73"/><text x="330" y="290" font-size="14" text-anchor="middle" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">查全库对账</text>
<g font-size="14" font-family="Noto Sans CJK SC, sans-serif" fill="#000000">
<text x="150" y="378">红色（左上）：进化练了几亿年的本能，人觉得毫不费力，机器偏偏最难。</text>
<text x="150" y="402">绿色（右下）：文明只发明了几千年的符号运算，人觉得费劲，机器轻松碾压。</text>
</g>

</svg>