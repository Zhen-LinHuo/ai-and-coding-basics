<text x="90" y="300" font-size="13" fill="#009E73" font-family="Noto Sans CJK SC, sans-serif">输入 x：每一步新来的词</text>
<text x="90" y="340" font-size="14" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">红色箭头：上一步的摘要 + 这一步的输入 → 新摘要。每步只读写这一页纸。</text>
<text x="90" y="368" font-size="14" fill="#0072B2" font-family="Noto Sans CJK SC, sans-serif">内存恒定、速度线性；代价是历史越早，挤得越扁。</text>
