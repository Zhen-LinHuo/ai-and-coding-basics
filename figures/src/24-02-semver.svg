<svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/></marker>
</defs>
<text x="20" y="30" font-size="16" font-weight="bold" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">语义化版本：用三个数字声明"破坏了多少"</text>
<g font-family="Noto Sans CJK SC, sans-serif" font-size="16" fill="#000000">
<text x="60" y="90" font-weight="bold">2 . 3 . 1</text>
<text x="60" y="130" fill="#0072B2" font-size="14">主版本.次版本.修订号</text>
<g font-size="14" fill="#000000">
<rect x="250" y="70" width="180" height="40" rx="6" fill="#D55E00" fill-opacity="0.7"/><text x="340" y="96" text-anchor="middle" fill="#ffffff">主版本+1：接口变了</text>
<rect x="450" y="70" width="180" height="40" rx="6" fill="#E69F00" fill-opacity="0.7"/><text x="540" y="96" text-anchor="middle" fill="#ffffff">次版本+1：加了功能</text>
<rect x="650" y="70" width="180" height="40" rx="6" fill="#009E73" fill-opacity="0.7"/><text x="740" y="96" text-anchor="middle" fill="#ffffff">修订号+1：修了 bug</text>
</g>
<g font-size="14" fill="#000000">
<text x="60" y="180">于是"我依赖 ≥2.3、&lt;3.0"就是一句承诺：次版本随便升，主版本动了我再改代码。</text>
<text x="60" y="210" fill="#D55E00">前提是所有人都守约——谁在修订号里偷偷改接口，谁的依赖树就会在深夜爆炸。</text>
</g>
</g>
</svg>