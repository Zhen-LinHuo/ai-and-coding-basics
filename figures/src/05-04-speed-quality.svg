<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/></marker>
</defs>
<text x="20" y="30" font-size="16" font-weight="bold" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">速度与质量：一条正在移动的边界</text>
<line x1="110" y1="330" x2="800" y2="330" stroke="#000000" stroke-width="1.3" marker-end="url(#arr)"/>
<line x1="110" y1="330" x2="110" y2="70" stroke="#000000" stroke-width="1.3" marker-end="url(#arr)"/>
<text x="806" y="334" font-size="13.0" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">每秒生成</text><text x="806" y="350.9" font-size="13.0" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">token 数</text>
<text x="46" y="66" font-size="13" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">质量</text>
<circle cx="250" cy="130" r="10" fill="#0072B2"/><text x="250" y="112" text-anchor="middle" font-size="13" fill="#0072B2" font-family="Noto Sans CJK SC, sans-serif">大模型自回归</text>
<circle cx="380" cy="160" r="10" fill="#56B4E9"/><text x="380" y="142" text-anchor="middle" font-size="13" fill="#56B4E9" font-family="Noto Sans CJK SC, sans-serif">小模型自回归</text>
<circle cx="640" cy="200" r="10" fill="#E69F00"/><text x="640" y="182" text-anchor="middle" font-size="13" fill="#E69F00" font-family="Noto Sans CJK SC, sans-serif">扩散式语言模型</text>
<path d="M 300 120 C 420 140 560 170 680 190" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4" fill="none" marker-end="url(#arr)"/>
<text x="470" y="120" font-size="12" fill="#999999" font-family="Noto Sans CJK SC, sans-serif">这条路在往右上走</text>
<g font-size="14" font-family="Noto Sans CJK SC, sans-serif" fill="#000000">
<text x="140" y="372">自回归：质量与速度直接冲突——要快就换小模型，质量立刻掉。</text>
<text x="140" y="398" fill="#E69F00">扩散：并行解码把"快"和"质量"部分解耦，边界还在移动（2025 年的 Mercury、LLaDA）。</text>
<text x="140" y="424" fill="#999999">注意：坐标里的位置不写具体数字——这类性能数据三个月就过时。</text>
</g>
</svg>