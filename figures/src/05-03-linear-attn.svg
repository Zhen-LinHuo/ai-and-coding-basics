<svg xmlns="http://www.w3.org/2000/svg" width="900" height="350" viewBox="0 0 900 350">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/></marker>
<marker id="arrv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D55E00"/></marker>
</defs>
<text x="20" y="30" font-size="16" font-weight="bold" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">同一个式子，两种算法</text>
<rect x="40" y="70" width="380" height="100" rx="10" fill="#ffffff" stroke="#0072B2" stroke-width="2"/>
<text x="230" y="102" font-size="14" text-anchor="middle" font-weight="bold" fill="#0072B2" font-family="Noto Sans CJK SC, sans-serif">写法 A：先算所有配对</text>
<text x="230" y="130" font-size="13" text-anchor="middle" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">(QKᵀ)V：n×n 的注意力矩阵先算出</text>
<text x="230" y="154" font-size="13" text-anchor="middle" fill="#999999" font-family="Noto Sans CJK SC, sans-serif">计算与内存 ~ n²</text>
<rect x="480" y="70" width="380" height="100" rx="10" fill="#ffffff" stroke="#009E73" stroke-width="2"/>
<text x="670" y="102" font-size="14" text-anchor="middle" font-weight="bold" fill="#009E73" font-family="Noto Sans CJK SC, sans-serif">写法 B：先合并键与值</text>
<text x="670" y="130" font-size="13" text-anchor="middle" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">Q(KᵀV)：先用 K、V 攒出一个状态矩阵</text>
<text x="670" y="154" font-size="13" text-anchor="middle" fill="#999999" font-family="Noto Sans CJK SC, sans-serif">计算与内存 ~ n</text>
<path d="M 425 120 L 475 120" stroke="#000000" stroke-width="2" marker-end="url(#arr)"/>
<text x="450" y="108" font-size="13" text-anchor="middle" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">结合律</text>
<text x="450" y="142" font-size="12" text-anchor="middle" fill="#999999" font-family="Noto Sans CJK SC, sans-serif">同一结果</text>
<g font-size="14" font-family="Noto Sans CJK SC, sans-serif" fill="#000000">
<text x="60" y="230">代价只有一个：softmax 拿掉了。去掉"归一化"之后，原来的加权平均才能改写成</text>
<text x="60" y="256">"状态随输入逐步累加"的递推——也就是一个 RNN 的形态。</text>
<text x="60" y="292" fill="#0072B2">于是同一张网可以是两种样子：训练时像注意力（并行），推理时像 RNN（逐步、省内存）。</text>
<text x="60" y="318" fill="#999999">这就是"线性注意力"：把 n² 换成 n，代价是表达力略降——所以要混合用（下一图）。</text>
</g>
</svg>