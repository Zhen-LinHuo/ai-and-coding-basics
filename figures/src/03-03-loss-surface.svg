<marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0072B2"/></marker>
</defs>
<text x="20" y="30" font-size="16" font-weight="bold" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">损失地形：一片连绵的山谷</text>
<ellipse cx="430" cy="205" rx="270" ry="92" fill="#56B4E9" fill-opacity="0.30" stroke="#000000" stroke-width="1.5"/><ellipse cx="430" cy="231" rx="226" ry="79" fill="#56B4E9" fill-opacity="0.39" stroke="#999999" stroke-width="1"/><ellipse cx="430" cy="257" rx="182" ry="66" fill="#56B4E9" fill-opacity="0.48" stroke="#999999" stroke-width="1"/><ellipse cx="430" cy="283" rx="138" ry="53" fill="#56B4E9" fill-opacity="0.57" stroke="#999999" stroke-width="1"/><ellipse cx="430" cy="309" rx="94" ry="40" fill="#56B4E9" fill-opacity="0.66" stroke="#999999" stroke-width="1"/><ellipse cx="430" cy="335" rx="50" ry="27" fill="#56B4E9" fill-opacity="0.75" stroke="#999999" stroke-width="1"/><ellipse cx="430" cy="361" rx="6" ry="14" fill="#009E73" stroke="#000000" stroke-width="1.5"/>
<circle cx="612" cy="228" r="9" fill="#D55E00"/>
<path d="M 606 236 C 570 268 520 292 470 308" stroke="#D55E00" stroke-width="2.5" fill="none" marker-end="url(#arrv)"/>
<text x="626" y="224" font-size="13" fill="#D55E00" font-family="Noto Sans CJK SC, sans-serif">当前参数（球的位置）</text>
<text x="430" y="365" font-size="12" text-anchor="middle" fill="#ffffff" font-family="Noto Sans CJK SC, sans-serif">谷底：损失最小</text>
<g font-size="14" font-family="Noto Sans CJK SC, sans-serif" fill="#000000">
<text x="120" y="150" fill="#000000">竖直方向：损失（越高错得越离谱）</text>
<text x="120" y="176" fill="#000000">碗口两个方向：两个参数的取值</text>
<text x="60" y="466" fill="#0072B2">梯度下降 = 球沿坡面一路滚到谷底。坡面上任何一点都能读出一个损失值，</text>
<text x="60" y="492" fill="#0072B2">球总能感觉到"哪个方向是下坡"——这个感觉来自反向传播（下一图）。</text>
