<svg xmlns="http://www.w3.org/2000/svg" width="700" height="350" viewBox="0 0 700 350">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/></marker>
</defs>
<text x="20" y="30" font-size="16" font-weight="bold" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">代际：每次变更都是新的一代，旧的都在</text>
<g font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#000000">
<rect x="60" y="80" width="150" height="60" rx="8" fill="#56B4E9" fill-opacity="0.4" stroke="#000000" stroke-width="1.3"/><text x="135" y="116" text-anchor="middle">第 41 代（当前）</text>
<rect x="260" y="80" width="150" height="60" rx="8" fill="#56B4E9" fill-opacity="0.25" stroke="#000000" stroke-width="1.3"/><text x="335" y="116" text-anchor="middle">第 42 代（新）</text>
<rect x="460" y="80" width="150" height="60" rx="8" fill="#ffffff" stroke="#D55E00" stroke-width="1.5" stroke-dasharray="6 4"/><text x="535" y="116" text-anchor="middle" fill="#D55E00">第 42 代坏了！</text>
</g>
<path d="M 212 110 L 258 110" stroke="#000000" stroke-width="2" marker-end="url(#arr)"/>
<path d="M 535 145 L 535 190 L 335 190 L 335 144" stroke="#D55E00" stroke-width="2" fill="none" marker-end="url(#arr)"/>
<text x="380" y="212" font-size="14" fill="#D55E00" font-family="Noto Sans CJK SC, sans-serif">回滚 = 把"当前"指回第 41 代——几秒钟，原子操作</text>
<g font-size="14" font-family="Noto Sans CJK SC, sans-serif" fill="#000000">
<text x="60" y="262">传统发行版升级像"装修"：改完才发现墙敲错了，拆回去比装还难。</text>
<text x="60" y="290">声明式系统升级像"换屋子"：新一代整体落成，旧一代原样保留，随时搬回去。</text>
<text x="60" y="326" fill="#0072B2">大胆升级的底气，来自"回滚是廉价且完整的"。</text>
</g>
</svg>