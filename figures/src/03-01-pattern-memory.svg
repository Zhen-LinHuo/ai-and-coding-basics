<text x="86" y="52" font-size="13" text-anchor="middle" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">存入图案：「十」</text>
<g font-size="14" font-family="Noto Sans CJK SC, sans-serif" fill="#000000">
<text x="250" y="86">九颗神经元两两相连，共 36 条连线；</text>
<text x="250" y="110">存的那一刻按一个规则定死：</text>
<text x="250" y="140" fill="#009E73">图案里同色的两颗，权重 +1（绿线）</text>
<text x="250" y="164" fill="#D55E00">图案里异色的两颗，权重 -1（朱虚线）</text>
<text x="250" y="194">不需要任何训练，权重就是记忆。</text>
</g>
