<svg xmlns="http://www.w3.org/2000/svg" width="780" height="400" viewBox="0 0 780 400">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/></marker>
</defs>
<text x="20" y="30" font-size="16" font-weight="bold" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">行为主义的基本回路：行动、反馈、改进</text>
<rect x="80" y="120" width="180" height="80" rx="12" fill="#56B4E9" stroke="#000000" stroke-width="1.5"/>
<text x="170" y="154" font-size="16" text-anchor="middle" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">智能体</text>
<text x="170" y="178" font-size="13" text-anchor="middle" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">（做出动作的一方）</text>
<rect x="520" y="120" width="180" height="80" rx="12" fill="#E69F00" stroke="#000000" stroke-width="1.5"/>
<text x="610" y="154" font-size="16" text-anchor="middle" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">环境</text>
<text x="610" y="178" font-size="13" text-anchor="middle" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">（不迁就它的一方）</text>
<path d="M 262 145 L 518 145" stroke="#000000" stroke-width="2" marker-end="url(#arr)"/>
<text x="390" y="130" font-size="15" text-anchor="middle" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">动作</text>
<path d="M 518 185 L 262 185" stroke="#000000" stroke-width="2" marker-end="url(#arr)"/>
<text x="390" y="212" font-size="15" text-anchor="middle" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">反馈（分数/惩罚/新局面）</text>
<g font-size="14" font-family="Noto Sans CJK SC, sans-serif" fill="#000000">
<text x="80" y="278">没有人告诉它"正确答案"，只有环境回一句"这步不错/这步很糟"。</text>
<text x="80" y="302">智能不写在任何规则库里，而是几万次循环攒出来的行动策略。</text>
<text x="80" y="336" fill="#999999">孩子学走路、玩家练关卡、算法下棋，用的是同一张回路图。</text>
<text x="80" y="376" fill="#009E73">这条回路在第 1.4 节会拿到正式名字：强化学习。</text>
</g>

</svg>