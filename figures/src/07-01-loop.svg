<svg xmlns="http://www.w3.org/2000/svg" width="880" height="420" viewBox="0 0 880 420">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/></marker>
</defs>
<text x="20" y="30" font-size="16" font-weight="bold" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">智能体循环：观察 → 决策 → 调用 → 回填</text>
<g font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#000000">
<rect x="70" y="120" width="180" height="60" rx="10" fill="#56B4E9" stroke="#000000" stroke-width="1.5"/>
<text x="160" y="146" text-anchor="middle" font-weight="bold">观察</text>
<text x="160" y="168" text-anchor="middle" fill="#999999" font-size="12">读上下文与工具结果</text>
<rect x="360" y="120" width="180" height="60" rx="10" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
<text x="450" y="146" text-anchor="middle" font-weight="bold">决策</text>
<text x="450" y="168" text-anchor="middle" fill="#999999" font-size="12">模型：下一步做什么</text>
<rect x="650" y="120" width="180" height="60" rx="10" fill="#E69F00" fill-opacity="0.4" stroke="#000000" stroke-width="1.5"/>
<text x="740" y="146" text-anchor="middle" font-weight="bold">调用</text>
<text x="740" y="168" text-anchor="middle" fill="#999999" font-size="12">工具：跑命令/读文件</text>
</g>
<path d="M 252 150 L 358 150" stroke="#000000" stroke-width="2" marker-end="url(#arr)"/>
<path d="M 542 150 L 648 150" stroke="#000000" stroke-width="2" marker-end="url(#arr)"/>
<path d="M 740 182 C 740 280 160 280 160 184" stroke="#0072B2" stroke-width="2" fill="none" marker-end="url(#arr)"/>
<text x="450" y="272" text-anchor="middle" font-size="13" fill="#0072B2" font-family="Noto Sans CJK SC, sans-serif">结果回填进上下文（这就是"循环"）</text>
<g font-size="14" font-family="Noto Sans CJK SC, sans-serif" fill="#000000">
<text x="60" y="330">一个任务 = 这个圈转 N 圈。每转一圈，模型都要重新读一遍全部上下文——</text>
<text x="60" y="356" fill="#D55E00">所以上下文窗口是硬约束：转得越多、装得越多，离"装不下"越近。</text>
<text x="60" y="392" fill="#999999">这也解释了为什么 harness 的主要工程是"管理上下文"：什么该进来、什么该被压缩掉。</text>
</g>
</svg>