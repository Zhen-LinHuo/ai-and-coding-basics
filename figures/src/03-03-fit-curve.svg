<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/></marker>
</defs>
<text x="20" y="30" font-size="16" font-weight="bold" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">两颗神经元，各自画一条直线；相乘，就得到一条抛物线</text>
<line x1="130" y1="340" x2="420" y2="340" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="150" y1="360" x2="150" y2="60" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="426" y="344" font-size="13" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">x</text>
<text x="128" y="56" font-size="13" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">y</text>
<path d="M 100 374 L 400 264" stroke="#009E73" stroke-width="2.2" fill="none"/>
<path d="M 100 198 L 400 308" stroke="#D55E00" stroke-width="2.2" fill="none"/>
<path d="150,436 154,430 159,424 163,418 168,413 172,407 176,402 181,397 185,392 190,387 194,382 198,378 203,373 207,369 212,364 216,360 221,356 225,352 229,349 234,345 238,342 243,338 247,335 251,332 256,329 260,326 265,323 269,321 273,318 278,316 282,313 287,311 291,309 295,308 300,306 304,304 309,303 313,301 317,300 322,299 326,298 331,297 335,297 339,296 344,295 348,295 353,295 357,295 362,295 366,295 370,295 375,296 379,296 384,297 388,298 392,299 397,300 401,301 406,302 410,304 " stroke="#0072B2" stroke-width="3.5" fill="none"/>
<circle cx="156" cy="432" r="5" fill="#E69F00" fill-opacity="0.9"/><circle cx="181" cy="396" r="5" fill="#E69F00" fill-opacity="0.9"/><circle cx="206" cy="373" r="5" fill="#E69F00" fill-opacity="0.9"/><circle cx="231" cy="346" r="5" fill="#E69F00" fill-opacity="0.9"/><circle cx="255" cy="327" r="5" fill="#E69F00" fill-opacity="0.9"/><circle cx="280" cy="323" r="5" fill="#E69F00" fill-opacity="0.9"/><circle cx="305" cy="314" r="5" fill="#E69F00" fill-opacity="0.9"/><circle cx="329" cy="291" r="5" fill="#E69F00" fill-opacity="0.9"/><circle cx="354" cy="300" r="5" fill="#E69F00" fill-opacity="0.9"/><circle cx="379" cy="301" r="5" fill="#E69F00" fill-opacity="0.9"/><circle cx="404" cy="292" r="5" fill="#E69F00" fill-opacity="0.9"/>
<g font-size="13" font-family="Noto Sans CJK SC, sans-serif" fill="#000000">
<text x="300" y="70" fill="#009E73">神经元 1 的直线</text>
<text x="404" y="118" fill="#D55E00">神经元 2 的直线</text>
<text x="90" y="90" fill="#0072B2">乘积：抛物线</text>
</g>
<g font-size="14" font-family="Noto Sans CJK SC, sans-serif" fill="#000000">
<text x="560" y="70" font-size="15" font-weight="bold" fill="#000000">它对应一个 4 参数的小网络：</text>
<circle cx="600" cy="130" r="20" fill="#E69F00" stroke="#000000" stroke-width="1.5"/><text x="600" y="135" text-anchor="middle">x</text>
<path d="M 622 118 L 700 96" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/>
<path d="M 622 142 L 700 176" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="650" y="98" fill="#009E73">w₁, b₁</text>
<text x="650" y="176" fill="#D55E00">w₂, b₂</text>
<rect x="702" y="82" width="120" height="40" rx="8" fill="#009E73" fill-opacity="0.2" stroke="#009E73" stroke-width="1.5"/>
<text x="762" y="107" text-anchor="middle">神经元 1：w₁x+b₁</text>
<rect x="702" y="166" width="120" height="40" rx="8" fill="#D55E00" fill-opacity="0.15" stroke="#D55E00" stroke-width="1.5"/>
<text x="762" y="191" text-anchor="middle">神经元 2：w₂x+b₂</text>
<circle cx="880" cy="145" r="24" fill="#56B4E9" stroke="#000000" stroke-width="1.5"/>
<text x="880" y="152" text-anchor="middle" font-size="16">×</text>
<path d="M 822 102 L 858 132" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/>
<path d="M 822 186 L 858 158" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/>
<path d="M 905 145 L 940 145" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="948" y="151" fill="#000000">y</text>
<text x="560" y="260">每颗神经元只做线性转化（一条直线），</text>
<text x="560" y="286">但两个一次式相乘就是二次式：</text>
<text x="560" y="318" fill="#0072B2">(w₁x+b₁)(w₂x+b₂) = w₁w₂·x² + (w₁b₂+w₂b₁)x + b₁b₂</text>
<text x="560" y="350">四个权重拧出三个系数——"简单单元拼出复杂曲线"的最小例子。</text>
<text x="560" y="382" fill="#999999">真网络并不真的做乘法，而是靠非线性激活完成同类的组合（第 1.4.1 节）。</text>
</g>
</svg>