<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/></marker>
</defs>
<text x="20" y="30" font-size="16" font-weight="bold" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">两颗神经元，各自画一条直线；相乘，就得到一条抛物线</text>
<line x1="130" y1="340" x2="430" y2="340" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="150" y1="360" x2="150" y2="60" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="436" y="344" font-size="13" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">x</text>
<text x="128" y="56" font-size="13" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">y</text>
<path d="M 150 319 L 410 209" stroke="#009E73" stroke-width="2.2" fill="none"/>
<path d="M 150 209 L 410 319" stroke="#D55E00" stroke-width="2.2" fill="none"/>
<polyline points="150,306 154,302 159,299 163,295 168,292 172,289 176,286 181,283 185,280 190,277 194,275 198,272 203,270 207,268 212,266 216,264 221,262 225,261 229,259 234,258 238,257 243,255 247,254 251,253 256,253 260,252 265,252 269,251 273,251 278,251 282,251 287,251 291,251 295,252 300,252 304,253 309,253 313,254 317,255 322,257 326,258 331,259 335,261 339,262 344,264 348,266 353,268 357,270 362,272 366,275 370,277 375,280 379,283 384,286 388,289 392,292 397,295 401,299 406,302 410,306" fill="none" stroke="#0072B2" stroke-width="3.5"/>
<circle cx="156" cy="300" r="5.5" fill="#E69F00" stroke="#ffffff" stroke-width="1"/><circle cx="177" cy="285" r="5.5" fill="#E69F00" stroke="#ffffff" stroke-width="1"/><circle cx="198" cy="273" r="5.5" fill="#E69F00" stroke="#ffffff" stroke-width="1"/><circle cx="218" cy="263" r="5.5" fill="#E69F00" stroke="#ffffff" stroke-width="1"/><circle cx="239" cy="256" r="5.5" fill="#E69F00" stroke="#ffffff" stroke-width="1"/><circle cx="259" cy="252" r="5.5" fill="#E69F00" stroke="#ffffff" stroke-width="1"/><circle cx="280" cy="251" r="5.5" fill="#E69F00" stroke="#ffffff" stroke-width="1"/><circle cx="301" cy="252" r="5.5" fill="#E69F00" stroke="#ffffff" stroke-width="1"/><circle cx="321" cy="256" r="5.5" fill="#E69F00" stroke="#ffffff" stroke-width="1"/><circle cx="342" cy="263" r="5.5" fill="#E69F00" stroke="#ffffff" stroke-width="1"/><circle cx="362" cy="273" r="5.5" fill="#E69F00" stroke="#ffffff" stroke-width="1"/><circle cx="383" cy="285" r="5.5" fill="#E69F00" stroke="#ffffff" stroke-width="1"/><circle cx="404" cy="300" r="5.5" fill="#E69F00" stroke="#ffffff" stroke-width="1"/>
<g font-size="13" font-family="Noto Sans CJK SC, sans-serif" fill="#000000">
<text x="330" y="200" fill="#009E73">神经元 1 的直线</text>
<text x="330" y="120" fill="#D55E00">神经元 2 的直线</text>
<text x="240" y="140" fill="#0072B2">乘积：抛物线</text>
</g>
<circle cx="240" cy="150" r="11" fill="#56B4E9"/><text x="240" y="155" text-anchor="middle" fill="#ffffff" font-size="13" font-family="Noto Sans CJK SC, sans-serif">1</text>
<circle cx="240" cy="255" r="11" fill="#56B4E9"/><text x="240" y="260" text-anchor="middle" fill="#ffffff" font-size="13" font-family="Noto Sans CJK SC, sans-serif">2</text>
<circle cx="240" cy="320" r="11" fill="#56B4E9"/><text x="240" y="325" text-anchor="middle" fill="#ffffff" font-size="13" font-family="Noto Sans CJK SC, sans-serif">3</text>
<line x1="251" y1="150" x2="262" y2="150" stroke="#000000" stroke-width="1"/>
<line x1="251" y1="255" x2="262" y2="255" stroke="#000000" stroke-width="1"/>
<line x1="251" y1="320" x2="262" y2="320" stroke="#000000" stroke-width="1"/>
<!-- 迷你网络 -->
<g font-size="14" font-family="Noto Sans CJK SC, sans-serif" fill="#000000">
<text x="560" y="70" font-size="15" font-weight="bold" fill="#000000">它对应一个 4 参数的小网络：</text>
<circle cx="600" cy="130" r="20" fill="#E69F00" stroke="#000000" stroke-width="1.5"/><text x="600" y="135" text-anchor="middle">x</text>
<path d="M 622 118 L 700 96" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/>
<path d="M 622 142 L 700 176" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="650" y="98" fill="#009E73">w₁, b₁</text>
<text x="650" y="176" fill="#D55E00">w₂, b₂</text>
<rect x="702" y="82" width="130" height="40" rx="8" fill="#009E73" fill-opacity="0.2" stroke="#009E73" stroke-width="1.5"/>
<text x="767" y="107" text-anchor="middle">神经元 1：w₁x+b₁</text>
<rect x="702" y="166" width="130" height="40" rx="8" fill="#D55E00" fill-opacity="0.15" stroke="#D55E00" stroke-width="1.5"/>
<text x="767" y="191" text-anchor="middle">神经元 2：w₂x+b₂</text>
<circle cx="885" cy="145" r="24" fill="#56B4E9" stroke="#000000" stroke-width="1.5"/>
<text x="885" y="152" text-anchor="middle" font-size="16">×</text>
<path d="M 832 102 L 863 132" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/>
<path d="M 832 186 L 863 158" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/>
<path d="M 910 145 L 945 145" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="953" y="151" fill="#000000">y</text>
<text x="560" y="260">每颗神经元只做线性转化（一条直线），</text>
<text x="560" y="286">但两个一次式相乘就是二次式：</text>
<text x="560" y="318" fill="#0072B2">(w₁x+b₁)(w₂x+b₂) = w₁w₂·x² + (w₁b₂+w₂b₁)x + b₁b₂</text>
<text x="560" y="350">四个权重拧出三个系数——"简单单元拼出复杂曲线"的最小例子。</text>
<text x="560" y="382" fill="#999999">真网络并不真的做乘法，而是靠非线性激活完成同类的组合（第 1.4.1 节）。</text>
</g>
</svg>