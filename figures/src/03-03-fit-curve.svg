<circle cx="169" cy="186" r="5.5" fill="#E69F00" stroke="#ffffff" stroke-width="1"/><circle cx="193" cy="207" r="5.5" fill="#E69F00" stroke="#ffffff" stroke-width="1"/><circle cx="217" cy="228" r="5.5" fill="#E69F00" stroke="#ffffff" stroke-width="1"/><circle cx="241" cy="248" r="5.5" fill="#E69F00" stroke="#ffffff" stroke-width="1"/><circle cx="266" cy="269" r="5.5" fill="#E69F00" stroke="#ffffff" stroke-width="1"/><circle cx="290" cy="290" r="5.5" fill="#E69F00" stroke="#ffffff" stroke-width="1"/><circle cx="314" cy="311" r="5.5" fill="#E69F00" stroke="#ffffff" stroke-width="1"/><circle cx="339" cy="328" r="5.5" fill="#E69F00" stroke="#ffffff" stroke-width="1"/><circle cx="363" cy="308" r="5.5" fill="#E69F00" stroke="#ffffff" stroke-width="1"/><circle cx="387" cy="287" r="5.5" fill="#E69F00" stroke="#ffffff" stroke-width="1"/><circle cx="411" cy="266" r="5.5" fill="#E69F00" stroke="#ffffff" stroke-width="1"/>
<g font-size="13" font-family="Noto Sans CJK SC, sans-serif" fill="#000000">
<text x="330" y="250" fill="#009E73">神经元 1 的输出</text>
<text x="70" y="250" fill="#D55E00">神经元 2 的输出</text>
<text x="180" y="150" fill="#0072B2">两者相加 = V 形</text>
<text x="337" y="348" text-anchor="middle" fill="#999999">折点（x=1）</text>
</g>
<circle cx="180" cy="128" r="11" fill="#56B4E9"/><text x="180" y="133" text-anchor="middle" fill="#ffffff" font-size="13" font-family="Noto Sans CJK SC, sans-serif">1</text>
<circle cx="180" cy="196" r="11" fill="#56B4E9"/><text x="180" y="201" text-anchor="middle" fill="#ffffff" font-size="13" font-family="Noto Sans CJK SC, sans-serif">2</text>
<circle cx="180" cy="296" r="11" fill="#56B4E9"/><text x="180" y="301" text-anchor="middle" fill="#ffffff" font-size="13" font-family="Noto Sans CJK SC, sans-serif">3</text>
<!-- 迷你网络 -->
<g font-size="14" font-family="Noto Sans CJK SC, sans-serif" fill="#000000">
<text x="560" y="70" font-size="15" font-weight="bold" fill="#000000">对应的小网络（4 个权重 + 2 个折弯）：</text>
<circle cx="600" cy="150" r="20" fill="#E69F00" stroke="#000000" stroke-width="1.5"/><text x="600" y="155" text-anchor="middle">x</text>
<path d="M 622 140 L 700 112" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/>
<path d="M 622 160 L 700 190" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="648" y="112" fill="#009E73">w₁, b₁</text>
<text x="648" y="196" fill="#D55E00">w₂, b₂</text>
<rect x="702" y="92" width="130" height="40" rx="8" fill="#009E73" fill-opacity="0.2" stroke="#009E73" stroke-width="1.5"/>
<text x="767" y="117" text-anchor="middle">直线 → 负数归零</text>
<rect x="702" y="170" width="130" height="40" rx="8" fill="#D55E00" fill-opacity="0.15" stroke="#D55E00" stroke-width="1.5"/>
<text x="767" y="195" text-anchor="middle">直线 → 负数归零</text>
<circle cx="885" cy="150" r="24" fill="#56B4E9" stroke="#000000" stroke-width="1.5"/>
<text x="885" y="157" text-anchor="middle" font-size="16">Σ</text>
<path d="M 832 112 L 863 138" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/>
<path d="M 832 190 L 863 162" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/>
<path d="M 909 150 L 944 150" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="952" y="156" fill="#000000">y</text>
<text x="560" y="256">每颗神经元只两件事：</text>
<text x="560" y="282">先算一条直线（加权和），再把负数折成 0。</text>
<text x="560" y="316" fill="#0072B2">每颗贡献一个"折点"；两颗相加，就是两段直线拼成的 V。</text>
<text x="560" y="350">神经元越多，折点越多，拼出的线越接近任意曲线——</text>
<text x="560" y="376">这就是"许多简单单元拼出复杂映射"的全部秘密。</text>
<text x="560" y="410" fill="#999999">这个"负数归零"的动作叫 ReLU，是深度学习里最常见的非线性。</text>
</g>
</svg>