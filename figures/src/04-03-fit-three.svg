<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/></marker>
</defs>
<text x="20" y="26" font-size="16" font-weight="bold" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">同一条数据，三种"学"法</text>
<rect x="40" y="60" width="270" height="200" fill="#ffffff" stroke="#000000" stroke-width="1.3"/><circle cx="50" cy="84" r="4.5" fill="#000000"/><circle cx="69" cy="100" r="4.5" fill="#000000"/><circle cx="89" cy="76" r="4.5" fill="#000000"/><circle cx="113" cy="112" r="4.5" fill="#000000"/><circle cx="137" cy="100" r="4.5" fill="#000000"/><circle cx="161" cy="132" r="4.5" fill="#000000"/><circle cx="185" cy="120" r="4.5" fill="#000000"/><circle cx="209" cy="144" r="4.5" fill="#000000"/><circle cx="233" cy="136" r="4.5" fill="#000000"/><circle cx="257" cy="152" r="4.5" fill="#000000"/><circle cx="281" cy="146" r="4.5" fill="#000000"/><circle cx="300" cy="156" r="4.5" fill="#000000"/><line x1="50" y1="84" x2="300" y2="158" stroke="#999999" stroke-width="3"/><text x="175" y="46" font-size="14" text-anchor="middle" fill="#999999" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">欠拟合：太懒</text>
<rect x="345" y="60" width="270" height="200" fill="#ffffff" stroke="#000000" stroke-width="1.3"/><circle cx="355" cy="84" r="4.5" fill="#000000"/><circle cx="374" cy="100" r="4.5" fill="#000000"/><circle cx="394" cy="76" r="4.5" fill="#000000"/><circle cx="418" cy="112" r="4.5" fill="#000000"/><circle cx="442" cy="100" r="4.5" fill="#000000"/><circle cx="466" cy="132" r="4.5" fill="#000000"/><circle cx="490" cy="120" r="4.5" fill="#000000"/><circle cx="514" cy="144" r="4.5" fill="#000000"/><circle cx="538" cy="136" r="4.5" fill="#000000"/><circle cx="562" cy="152" r="4.5" fill="#000000"/><circle cx="586" cy="146" r="4.5" fill="#000000"/><circle cx="605" cy="156" r="4.5" fill="#000000"/><polyline points="346,145 352,141 359,136 366,132 372,128 379,124 386,120 393,117 399,114 406,111 413,108 420,106 426,104 433,102 440,100 446,99 453,98 460,97 467,96 473,96 480,96 487,96 493,96 500,97 507,98 514,99 520,100 527,102 534,104 540,106 547,108 554,111 561,114 567,117 574,120 581,124 588,128 594,132 601,136 608,141 614,145" fill="none" stroke="#009E73" stroke-width="3"/><text x="480" y="46" font-size="14" text-anchor="middle" fill="#009E73" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">合适：抓住了趋势</text>
<rect x="650" y="60" width="270" height="200" fill="#ffffff" stroke="#000000" stroke-width="1.3"/><circle cx="660" cy="84" r="4.5" fill="#000000"/><circle cx="679" cy="100" r="4.5" fill="#000000"/><circle cx="699" cy="76" r="4.5" fill="#000000"/><circle cx="723" cy="112" r="4.5" fill="#000000"/><circle cx="747" cy="100" r="4.5" fill="#000000"/><circle cx="771" cy="132" r="4.5" fill="#000000"/><circle cx="795" cy="120" r="4.5" fill="#000000"/><circle cx="819" cy="144" r="4.5" fill="#000000"/><circle cx="843" cy="136" r="4.5" fill="#000000"/><circle cx="867" cy="152" r="4.5" fill="#000000"/><circle cx="891" cy="146" r="4.5" fill="#000000"/><circle cx="910" cy="156" r="4.5" fill="#000000"/><polyline points="651,100 657,89 664,83 671,83 677,90 684,100 691,111 698,117 704,117 711,110 718,100 725,89 731,83 738,83 745,90 751,100 758,111 765,117 772,117 778,111 785,100 792,89 798,83 805,83 812,89 819,100 825,110 832,117 839,117 845,111 852,100 859,90 866,83 872,83 879,89 886,100 893,110 899,117 906,117 913,111 919,100" fill="none" stroke="#D55E00" stroke-width="3"/><text x="785" y="46" font-size="14" text-anchor="middle" fill="#D55E00" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">过拟合：背下了每一点</text>
<g font-size="14" font-family="Noto Sans CJK SC, sans-serif" fill="#000000">
<text x="40" y="292">一条直线，连趋势都没学会。</text>
<text x="345" y="292">平顺地穿过点云中间，容忍个别偏差。</text>
<text x="650" y="292">每个点都精确穿过，还画出了数据里根本不存在的起伏。</text>
<text x="40" y="330" fill="#999999">三张图的"训练得分"：从左到右依次是差、好、100 分。</text>
<text x="40" y="356" fill="#D55E00">但拿新数据一考，得分最高的是中间那张——"背题"不等于"会做题"。</text>
</g>
</svg>