<svg xmlns="http://www.w3.org/2000/svg" width="820" height="420" viewBox="0 0 820 420">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/></marker>
</defs>
<text x="20" y="30" font-size="16" font-weight="bold" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">缩放不是永动机：边际递减与数据墙</text>
<line x1="100" y1="350" x2="790" y2="350" stroke="#000000" stroke-width="1.3" marker-end="url(#arr)"/>
<line x1="100" y1="350" x2="100" y2="70" stroke="#000000" stroke-width="1.3" marker-end="url(#arr)"/>
<text x="796" y="354" font-size="13" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">算力（对数刻度）</text>
<text x="40" y="66" font-size="13" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">损失</text>
<polyline points="100,110 108,119 116,128 124,137 132,145 140,153 148,161 156,168 164,175 172,182 180,188 188,195 196,200 204,206 212,212 220,217 228,222 236,227 244,231 252,236 260,240 268,244 276,248 284,252 292,255 300,259 308,262 316,265 324,268 332,271 340,274 348,277 356,279 364,282 372,284 380,286 388,289 396,291 404,293 412,295 420,297 428,298 436,300 444,302 452,303 460,305 468,306 476,308 484,309 492,310 500,311 508,313 516,314 524,315 532,316 540,317 548,318 556,319 564,319 572,320 580,321 588,322 596,323 604,323 612,324 620,325 628,325 636,326 644,326 652,327 660,328 668,328 676,329 684,329" fill="none" stroke="#0072B2" stroke-width="3"/>
<line x1="500" y1="120" x2="500" y2="350" stroke="#D55E00" stroke-width="1.8" stroke-dasharray="7 4"/>
<text x="512" y="136" font-size="13" fill="#D55E00" font-family="Noto Sans CJK SC, sans-serif">高质量公开文本接近用尽</text>
<text x="512" y="158" font-size="13" fill="#D55E00" font-family="Noto Sans CJK SC, sans-serif">（"数据墙"）</text>
<text x="512" y="204" font-size="14" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">曲线越来越平：损失仍在降，</text>
<text x="512" y="228" font-size="14" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">但每降同样的幅度，</text>
<text x="512" y="252" font-size="14" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">投入要翻好几倍。</text>
<text x="512" y="292" font-size="14" fill="#0072B2" font-family="Noto Sans CJK SC, sans-serif">出路不在"更大"，而在更干净的</text>
<text x="512" y="316" font-size="14" fill="#0072B2" font-family="Noto Sans CJK SC, sans-serif">数据、更好的架构与目标。</text>
<text x="100" y="384" font-size="14" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">注意纵轴是损失：线越平 = 同样的进步越贵。</text>
</svg>