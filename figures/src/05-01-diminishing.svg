<svg xmlns="http://www.w3.org/2000/svg" width="820" height="420" viewBox="0 0 820 420">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/></marker>
</defs>
<text x="20" y="30" font-size="16" font-weight="bold" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">缩放不是永动机：边际递减与数据墙</text>
<line x1="80" y1="360" x2="780" y2="360" stroke="#000000" stroke-width="1.3" marker-end="url(#arr)"/>
<line x1="80" y1="360" x2="80" y2="70" stroke="#000000" stroke-width="1.3" marker-end="url(#arr)"/>
<text x="786" y="364" font-size="13" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">算力（对数）</text>
<text x="30" y="66" font-size="13" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">损失（对数）</text>
<polyline points="80,110 88,118 96,125 104,132 112,139 120,145 128,151 136,157 144,163 152,169 160,174 168,179 176,184 184,189 192,193 200,198 208,202 216,206 224,210 232,214 240,217 248,221 256,224 264,227 272,231 280,234 288,236 296,239 304,242 312,244 320,247 328,249 336,252 344,254 352,256 360,258 368,260 376,262 384,264 392,265 400,267 408,269 416,270 424,272 432,273 440,275 448,276 456,277 464,278 472,280 480,281 488,282 496,283 504,284 512,285 520,286 528,318 536,319 544,320 552,322 560,323 568,324 576,326 584,327 592,328 600,329 608,331 616,332 624,333 632,334 640,335 648,336 656,337 664,338 672,339 680,340 688,341 696,342 704,343 712,344" fill="none" stroke="#0072B2" stroke-width="3"/>
<line x1="540" y1="150" x2="540" y2="360" stroke="#D55E00" stroke-width="1.8" stroke-dasharray="7 4"/>
<text x="552" y="166" font-size="13" fill="#D55E00" font-family="Noto Sans CJK SC, sans-serif">高质量公开文本</text>
<text x="552" y="184" font-size="13" fill="#D55E00" font-family="Noto Sans CJK SC, sans-serif">接近用尽（"数据墙"）</text>
<g font-size="14" font-family="Noto Sans CJK SC, sans-serif" fill="#000000">
<text x="540" y="230">曲线越来越平：</text>
<text x="540" y="254">损失仍在降，但每降同样的</text>
<text x="540" y="278">幅度，投入要翻好几倍。</text>
<text x="540" y="314" fill="#0072B2">出路不在"更大"，而在更干净的</text>
<text x="540" y="338" fill="#0072B2">数据、更好的架构、更好的目标。</text>
</g>
<text x="80" y="392" font-size="14" font-family="Noto Sans CJK SC, sans-serif" fill="#000000">注意：这是双对数坐标。曲线变平 ≠ 停止进步，只是"同样的进步"越来越贵。</text>
</svg>