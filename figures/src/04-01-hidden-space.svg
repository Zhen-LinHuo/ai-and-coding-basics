<svg xmlns="http://www.w3.org/2000/svg" width="920" height="470" viewBox="0 0 920 470">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/></marker>
</defs>
<text x="20" y="30" font-size="16" font-weight="bold" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">同一条直线，在哪个空间里画？</text>
<rect x="70" y="80" width="300" height="240" fill="#ffffff" stroke="#000000" stroke-width="1.3"/><path d="M 60 330 C 190 300, 250 140, 380 70" stroke="#0072B2" stroke-width="3" fill="none"/><circle cx="70" cy="320" r="12" fill="#E69F00" stroke="#000000" stroke-width="1.3"/><path d="M 370 306 L 382 330 L 358 330 Z" fill="#009E73" stroke="#000000" stroke-width="1.3"/><path d="M 70 66 L 82 90 L 58 90 Z" fill="#009E73" stroke="#000000" stroke-width="1.3"/><circle cx="370" cy="80" r="12" fill="#E69F00" stroke="#000000" stroke-width="1.3"/><text x="220.0" y="344" font-size="13" text-anchor="middle" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">输入空间（你看到的平面）</text><rect x="560" y="80" width="360" height="240" fill="#ffffff" stroke="#000000" stroke-width="1.3"/><line x1="580" y1="310" x2="900" y2="100" stroke="#D55E00" stroke-width="3"/><path d="M 600 96 L 612 120 L 588 120 Z" fill="#009E73" stroke="#000000" stroke-width="1.3"/><path d="M 680 116 L 692 140 L 668 140 Z" fill="#009E73" stroke="#000000" stroke-width="1.3"/><circle cx="780" cy="280" r="12" fill="#E69F00" stroke="#000000" stroke-width="1.3"/><circle cx="840" cy="250" r="12" fill="#E69F00" stroke="#000000" stroke-width="1.3"/><text x="740" y="344" font-size="13" text-anchor="middle" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">隐藏层造出的新空间（同一批点，新坐标）</text>
<g font-size="14" font-family="Noto Sans CJK SC, sans-serif" fill="#000000">
<text x="40" y="392">左：原始输入的平面上，圆和三角只能靠弯线分开（单层感知机画不出弯线，这就是 XOR 之墙）。</text>
<text x="40" y="418">右：隐藏层每颗神经元的"是/否"答案拼成新坐标——同一批点换了位置，一条真正的直线就分开了。</text>
<text x="40" y="444">弯线在新空间里是直线；每个拐弯都对应某颗隐藏神经元的那条线。</text>
</g>
</svg>