<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/></marker>
</defs>
<text x="20" y="30" font-size="16" font-weight="bold" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">锁文件：给整棵树每一片叶子记哈希</text>
<g font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#000000">
<rect x="40" y="70" width="380" height="180" rx="10" fill="#ffffff" stroke="#D55E00" stroke-width="2"/>
<text x="230" y="100" text-anchor="middle" font-weight="bold" fill="#D55E00">没有锁文件</text>
<text x="60" y="130">"我依赖库 A"——装的时候取 A 的最新版。</text>
<text x="60" y="158">今天装是 1.2，下个月装是 2.0（接口变了）。</text>
<text x="60" y="186" fill="#999999">两台机器装出两个不同的世界，</text>
<text x="60" y="214" fill="#999999">"我这能跑"成为无解悬案。</text>
<rect x="480" y="70" width="380" height="180" rx="10" fill="#ffffff" stroke="#009E73" stroke-width="2"/>
<text x="670" y="100" text-anchor="middle" font-weight="bold" fill="#009E73">有锁文件</text>
<text x="500" y="130">每一片叶子记下：精确版本 + 内容哈希。</text>
<text x="500" y="158">装的时候先验哈希——内容对不上就拒绝。</text>
<text x="500" y="186" fill="#999999">任何机器、任何时间，装出同一棵树。</text>
<text x="500" y="214" fill="#999999">哈希同时防篡改：上游被黑也能被拦下。</text>
</g>
<text x="40" y="290" font-size="14" font-family="Noto Sans CJK SC, sans-serif" fill="#000000">锁文件把"可复现"从愿望变成检查——这是它与"requirements 列表"的本质区别：列表只写名字，锁文件写指纹。</text>
</svg>