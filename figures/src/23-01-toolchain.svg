<svg xmlns="http://www.w3.org/2000/svg" width="980" height="320" viewBox="0 0 980 320">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/></marker>
</defs>
<text x="20" y="30" font-size="16" font-weight="bold" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">四件套的协作：编辑 → 编译 → 调试 → 版本</text>
<g font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#000000">
<rect x="40" y="80" width="190" height="110" rx="10" fill="#ffffff" stroke="#0072B2" stroke-width="2"/>
<text x="135" y="110" text-anchor="middle" font-weight="bold" fill="#0072B2">编辑器</text>
<text x="135" y="140" text-anchor="middle" fill="#999999" font-size="12">写与改</text>
<rect x="300" y="80" width="190" height="110" rx="10" fill="#ffffff" stroke="#E69F00" stroke-width="2"/>
<text x="395" y="110" text-anchor="middle" font-weight="bold" fill="#E69F00">编译器/构建</text>
<text x="395" y="140" text-anchor="middle" fill="#999999" font-size="12">翻译与检查</text>
<rect x="560" y="80" width="190" height="110" rx="10" fill="#ffffff" stroke="#009E73" stroke-width="2"/>
<text x="655" y="110" text-anchor="middle" font-weight="bold" fill="#009E73">调试器</text>
<text x="655" y="140" text-anchor="middle" fill="#999999" font-size="12">停下来看内部</text>
<rect x="780" y="80" width="160" height="110" rx="10" fill="#ffffff" stroke="#CC79A7" stroke-width="2"/>
<text x="860" y="110" text-anchor="middle" font-weight="bold" fill="#CC79A7">版本控制</text>
<text x="860" y="140" text-anchor="middle" fill="#999999" font-size="12">记住每一步</text>
</g>
<path d="M 232 135 L 298 135" stroke="#000000" stroke-width="1.8" marker-end="url(#arr)"/>
<path d="M 492 135 L 558 135" stroke="#000000" stroke-width="1.8" marker-end="url(#arr)"/>
<path d="M 655 192 C 655 230 860 230 860 192" stroke="#999999" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
<text x="760" y="248" font-size="12" fill="#999999" font-family="Noto Sans CJK SC, sans-serif">改坏了？回滚到上一个好版本</text>
<path d="M 860 80 C 860 40 135 40 135 78" stroke="#999999" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
<text x="480" y="52" font-size="12" fill="#999999" font-family="Noto Sans CJK SC, sans-serif">从历史取回某个版本继续编辑</text>
<text x="40" y="290" font-size="14" font-family="Noto Sans CJK SC, sans-serif" fill="#000000">IDE 不是第四种东西，而是把四件套装进同一个窗口、让它们互相感知的整合器。命令行组合与 IDE 等价，只是界面不同。</text>
</svg>