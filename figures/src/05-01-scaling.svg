<svg xmlns="http://www.w3.org/2000/svg" width="820" height="440" viewBox="0 0 820 440">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/></marker>
</defs>
<text x="20" y="30" font-size="16" font-weight="bold" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">双对数坐标下，它是一条直线</text>
<line x1="70" y1="360" x2="780" y2="360" stroke="#000000" stroke-width="1.3" marker-end="url(#arr)"/>
<line x1="70" y1="360" x2="70" y2="70" stroke="#000000" stroke-width="1.3" marker-end="url(#arr)"/>
<text x="786" y="364" font-size="13" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">算力（对数）</text>
<text x="20" y="66" font-size="13" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">损失（对数）</text>
<polyline points="70,90 78,98 86,105 94,113 102,120 110,128 118,135 126,143 134,150 142,158 150,166 158,173 166,181 174,188 182,196 190,203 198,211 206,219 214,226 222,234 230,241 238,249 246,256 254,264 262,271 270,279 278,287 286,294 294,302 302,309 310,317 318,324 326,332 334,339 342,347 350,355 358,362 366,370 374,377 382,385 390,392 398,400 406,408 414,415 422,423 430,430 438,438 446,445 454,453 462,460 470,468 478,476 486,483 494,491 502,498 510,506 518,513 526,521 534,528 542,536 550,544 558,551 566,559 574,566 582,574 590,581 598,589 606,597 614,604 622,612 630,619 638,627 646,634 654,642 662,649 670,657 678,665 686,672 694,680 702,687 710,695 718,702 726,710 734,717 742,725" fill="none" stroke="#0072B2" stroke-width="3"/>
<g font-size="13" font-family="Noto Sans CJK SC, sans-serif" fill="#000000">
<text x="120" y="120" fill="#0072B2">实测点几乎落在一条直线上</text>
<text x="120" y="142" fill="#999999">横轴每翻 10 倍，纵轴下降固定的格数</text>
<text x="120" y="164" fill="#999999">——这就是"幂律"的全部含义</text>
</g>
<g font-size="14" font-family="Noto Sans CJK SC, sans-serif" fill="#000000">
<text x="120" y="392">把"投入翻倍、产出按固定比例增长"画在普通坐标上是一条越来越平的曲线；</text>
<text x="120" y="416">换到双对数坐标，它变成一条直线——指数关系被"拉直"了。</text>
</g>
</svg>