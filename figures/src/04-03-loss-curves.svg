<text x="600" y="150" fill="#009E73">训练损失：一路下降</text>
<text x="470" y="196" fill="#D55E00">验证损失：降到某轮开始回升</text>
<line x1="520" y1="240" x2="520" y2="310" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="524" y="332" fill="#999999">分叉点 = 开始背题的地方</text>
<text x="120" y="352">训练损失只说明"它对练过的题多熟"；验证损失才说明"它对新题有没有把握"。</text>
<text x="120" y="378" fill="#0072B2">停早了的模型欠拟合，停晚了过拟合——"什么时候停"本身就是一个要学的决策（早停）。</text>
</g>
