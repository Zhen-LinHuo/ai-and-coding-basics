<text x="20" y="30" font-size="16" font-weight="bold" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">两条损失曲线：分叉的地方，就是该停的地方</text>
<line x1="100" y1="330" x2="760" y2="330" stroke="#000000" stroke-width="1.3" marker-end="url(#arr)"/>
<line x1="100" y1="330" x2="100" y2="70" stroke="#000000" stroke-width="1.3" marker-end="url(#arr)"/>
<text x="780" y="334" font-size="13" text-anchor="end" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">训练轮数</text>
<text x="56" y="66" font-size="13" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">损失</text>
<polyline points="100,120 108,131 116,141 124,151 132,160 140,168 148,176 156,184 164,191 172,197 180,204 188,209 196,215 204,220 212,225 220,230 228,234 236,238 244,242 252,245 260,248 268,252 276,254 284,257 292,260 300,262 308,265 316,267 324,269 332,271 340,272 348,274 356,276 364,277 372,279 380,280 388,281 396,282 404,283 412,284 420,285 428,286 436,287 444,288 452,288 460,289 468,290 476,290 484,291 492,292 500,292 508,293 516,293 524,293 532,294 540,294 548,295 556,295 564,295 572,295 580,296 588,296 596,296 604,296 612,297 620,297 628,297 636,297 644,297 652,298 660,298 668,298 676,298 684,298 692,298 700,298 708,298 716,299 724,299 732,299" fill="none" stroke="#009E73" stroke-width="2.5"/>
