<g font-size="14" font-family="Noto Sans CJK SC, sans-serif" fill="#000000">
<text x="560" y="130" fill="#009E73">训练损失：一路下降</text>
<text x="470" y="176" fill="#D55E00">验证损失：降到某轮开始回升</text>
<line x1="524" y1="216" x2="524" y2="330" stroke="#999999" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="528" y="348" fill="#999999">分叉点 = 开始背题的地方</text>
<text x="110" y="368">训练损失只说明"它对练过的题多熟"；验证损失才说明"它对新题有没有把握"。</text>
<text x="110" y="394" fill="#0072B2">停早了欠拟合，停晚了过拟合——"什么时候停"本身就是一个要学的决策（早停）。</text>
</g>
</svg>