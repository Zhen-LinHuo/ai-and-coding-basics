<svg xmlns="http://www.w3.org/2000/svg" width="900" height="490" viewBox="0 0 900 490">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/></marker>
</defs>
<text x="20" y="30" font-size="16" font-weight="bold" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">BPE：从字符开始，一步步合并最常见的搭档</text>
<g font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#000000">
<rect x="60" y="60" width="200" height="50" rx="8" fill="#ffffff" stroke="#D55E00" stroke-width="2"/>
<text x="160" y="90" text-anchor="middle">低频做法：一个字一格</text>
<rect x="60" y="150" width="200" height="50" rx="8" fill="#ffffff" stroke="#009E73" stroke-width="2"/>
<text x="160" y="180" text-anchor="middle">高频组合：合成一块</text>
</g>
<g font-family="Noto Sans CJK SC, sans-serif" font-size="15" fill="#000000">
<text x="330" y="86">t · o · k · e · n   （5 格）</text>
<path d="M 470 80 L 520 80" stroke="#999999" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="530" y="86">统计语料发现 "to" 常见</text>
<path d="M 740 80 L 790 80" stroke="#999999" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="800" y="86">合并 →</text>
<text x="330" y="156">to · k · e · n   （4 格）</text>
<path d="M 470 150 L 520 150" stroke="#999999" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="530" y="150">"ke" 也常见</text>
<text x="330" y="226">to · ken   （2 格）</text>
</g>
<g font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#000000">
<text x="60" y="300">规则只有一个：数一数哪对搭档出现得最多，就把它们焊死成一个新符号，重复几万次。</text>
<text x="60" y="330">于是常见词被合并成整块，生僻词自动退回字符——一个词表同时照顾两头。</text>
</g>
<line x1="60" y1="360" x2="860" y2="360" stroke="#999999" stroke-width="1"/>
<g font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#000000">
<text x="60" y="392" fill="#D55E00">词表太小：切得太碎，序列长，"词"的内部结构全靠自己拼。</text>
<text x="60" y="420" fill="#0072B2">词表太大：每个词整块记忆，生僻词、错拼词、新词全变成生字。</text>
<text x="60" y="456" fill="#000000">模型vocab规模的取舍，本质是"背多少、拼多少"的分工线——通常在几万到十几万块。</text>
</g>

</svg>