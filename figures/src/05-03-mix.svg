<marker id="arrv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D55E00"/></marker>
</defs>
<text x="20" y="30" font-size="16" font-weight="bold" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">两个极端之间的工程折中</text>
<line x1="110" y1="330" x2="800" y2="330" stroke="#000000" stroke-width="1.3" marker-end="url(#arr)"/>
<line x1="110" y1="330" x2="110" y2="70" stroke="#000000" stroke-width="1.3" marker-end="url(#arr)"/>
<text x="806" y="334" font-size="13" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">长上下文效率</text>
<text x="46" y="66" font-size="13" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">精确回忆能力</text>
<circle cx="230" cy="130" r="10" fill="#0072B2"/><text x="230" y="112" text-anchor="middle" font-size="13" fill="#0072B2" font-family="Noto Sans CJK SC, sans-serif">纯注意力</text>
<circle cx="700" cy="270" r="10" fill="#009E73"/><text x="700" y="252" text-anchor="middle" font-size="13" fill="#009E73" font-family="Noto Sans CJK SC, sans-serif">纯 SSM / 线性</text>
<circle cx="470" cy="196" r="12" fill="#E69F00"/><text x="470" y="176" text-anchor="middle" font-size="13" fill="#E69F00" font-family="Noto Sans CJK SC, sans-serif">混合层</text>
<path d="M 250 138 C 330 160 400 180 452 192" stroke="#999999" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
<path d="M 678 262 C 600 240 530 214 490 200" stroke="#999999" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
<g font-size="14" font-family="Noto Sans CJK SC, sans-serif" fill="#000000">
<text x="140" y="372">纯注意力：找细节最准，长文最贵。</text>
<text x="140" y="398">纯 SSM：长文便宜，但"从十万字里原样找出某句话"会失手。</text>
<text x="140" y="424" fill="#E69F00">混合：大部分层用省钱的，少数层用精确的——2025 年后的主流折中。</text>
</g>
