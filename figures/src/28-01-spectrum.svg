<svg xmlns="http://www.w3.org/2000/svg" width="900" height="270" viewBox="0 0 900 270">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/></marker>
</defs>
<text x="20" y="30" font-size="16" font-weight="bold" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">光谱：从"随便用"到"用了也得开源"</text>
<line x1="80" y1="120" x2="840" y2="120" stroke="#000000" stroke-width="2" marker-end="url(#arr)"/>
<text x="80" y="100" font-size="13" fill="#999999" font-family="Noto Sans CJK SC, sans-serif">宽松（拿去商用、闭源都行）</text>
<text x="700" y="100" font-size="13" fill="#999999" font-family="Noto Sans CJK SC, sans-serif">copyleft（传染开源）</text>
<g font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#000000">
<circle cx="140" cy="120" r="26" fill="#0072B2"/><text x="140" y="126" text-anchor="middle" fill="#ffffff" font-size="12">MIT</text>
<circle cx="260" cy="120" r="26" fill="#0072B2"/><text x="260" y="126" text-anchor="middle" fill="#ffffff" font-size="12">Apache</text>
<circle cx="400" cy="120" r="26" fill="#E69F00"/><text x="400" y="126" text-anchor="middle" fill="#ffffff" font-size="12">LGPL</text>
<circle cx="540" cy="120" r="26" fill="#E69F00"/><text x="540" y="126" text-anchor="middle" fill="#ffffff" font-size="12">MPL</text>
<circle cx="680" cy="120" r="26" fill="#D55E00"/><text x="680" y="126" text-anchor="middle" fill="#ffffff" font-size="12">GPL</text>
<circle cx="790" cy="120" r="26" fill="#D55E00"/><text x="790" y="126" text-anchor="middle" fill="#ffffff" font-size="12">AGPL</text>
</g>
<g font-size="14" font-family="Noto Sans CJK SC, sans-serif" fill="#000000">
<text x="100" y="180" fill="#0072B2">MIT：留一句版权声明，其他随便。</text>
<text x="300" y="180" fill="#999999">Apache：多一条专利授权，企业偏爱。</text>
<text x="560" y="180" fill="#E69F00">MPL：改动的这个文件要开源。</text>
<text x="640" y="210" fill="#D55E00">GPL：用了我的代码，你的整个作品也须以 GPL 开源。</text>
<text x="640" y="240" fill="#D55E00">AGPL：连"通过网络提供服务"也算分发——SaaS  loophole 的堵法。</text>
</g>
</svg>