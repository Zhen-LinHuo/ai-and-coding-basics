<g font-size="14" font-family="Noto Sans CJK SC, sans-serif" fill="#000000">
<text x="60" y="452">自回归：n 个字至少 n 步，一步接一步，没法提前收工。</text>
<text x="60" y="480" fill="#009E73">扩散：几十步就能把整段一起定下来——并行，是"快"的来源；但长文连贯性更难保。</text>
