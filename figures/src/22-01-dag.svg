<svg xmlns="http://www.w3.org/2000/svg" width="660" height="290" viewBox="0 0 660 290">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/></marker>
</defs>
<text x="20" y="30" font-size="16" font-weight="bold" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">提交链：每个提交都是一次快照 + 指向上一个的指针</text>
<g font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#000000">
<circle cx="100" cy="120" r="24" fill="#56B4E9" stroke="#000000" stroke-width="1.5"/><text x="100" y="126" text-anchor="middle" font-size="12">A</text>
<circle cx="220" cy="120" r="24" fill="#56B4E9" stroke="#000000" stroke-width="1.5"/><text x="220" y="126" text-anchor="middle" font-size="12">B</text>
<circle cx="340" cy="120" r="24" fill="#56B4E9" stroke="#000000" stroke-width="1.5"/><text x="340" y="126" text-anchor="middle" font-size="12">C</text>
<circle cx="460" cy="70" r="24" fill="#E69F00" stroke="#000000" stroke-width="1.5"/><text x="460" y="76" text-anchor="middle" font-size="12">D</text>
<circle cx="460" cy="170" r="24" fill="#E69F00" stroke="#000000" stroke-width="1.5"/><text x="460" y="176" text-anchor="middle" font-size="12">E</text>
<circle cx="580" cy="120" r="24" fill="#009E73" stroke="#000000" stroke-width="1.5"/><text x="580" y="126" text-anchor="middle" font-size="12">F</text>
</g>
<path d="M 124 120 L 194 120" stroke="#000000" stroke-width="1.8" marker-end="url(#arr)"/>
<path d="M 244 120 L 314 120" stroke="#000000" stroke-width="1.8" marker-end="url(#arr)"/>
<path d="M 364 108 L 434 78" stroke="#000000" stroke-width="1.8" marker-end="url(#arr)"/>
<path d="M 364 132 L 434 162" stroke="#000000" stroke-width="1.8" marker-end="url(#arr)"/>
<path d="M 484 78 L 556 108" stroke="#000000" stroke-width="1.8" marker-end="url(#arr)"/>
<path d="M 484 162 L 556 132" stroke="#000000" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="100" y="170" text-anchor="middle" font-size="12" fill="#999999" font-family="Noto Sans CJK SC, sans-serif">每个提交记住"我的上一个是谁"</text>
<text x="580" y="166" text-anchor="middle" font-size="12" fill="#999999" font-family="Noto Sans CJK SC, sans-serif">合并提交：两个爹</text>
<g font-size="14" font-family="Noto Sans CJK SC, sans-serif" fill="#000000">
<text x="60" y="230">D 和 E 是从 C 分出的两条平行尝试（分支）；F 把它们合并。整个历史是一张"只进不退"的图（DAG）。</text>
<text x="60" y="258" fill="#0072B2">这就是"可以大胆改"的底气：任何一步都能回到任何一个快照。</text>
</g>
</svg>