<svg xmlns="http://www.w3.org/2000/svg" width="700" height="420" viewBox="0 0 700 420">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/></marker>
<marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0072B2"/></marker>
<marker id="arrv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D55E00"/></marker>
</defs>
<text x="20" y="32" font-size="16" font-weight="bold" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">异或（XOR）：三条候选直线，每条都至少混进一个异类</text>
<rect x="150" y="80" width="300" height="240" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
<line x1="150" y1="200.0" x2="450" y2="200.0" stroke="#E69F00" stroke-width="2.5" stroke-dasharray="8 5"/>
<line x1="300.0" y1="80" x2="300.0" y2="320" stroke="#D55E00" stroke-width="2.5" stroke-dasharray="8 5"/>
<line x1="150" y1="248" x2="360" y2="80" stroke="#CC79A7" stroke-width="2.5" stroke-dasharray="8 5"/>
<circle cx="150" cy="320" r="14" fill="#E69F00" stroke="#000000" stroke-width="1.5"/><circle cx="450" cy="80" r="14" fill="#E69F00" stroke="#000000" stroke-width="1.5"/><path d="M 150 65 L 164 91 L 136 91 Z" fill="#009E73" stroke="#000000" stroke-width="1.5"/><path d="M 450 305 L 464 331 L 436 331 Z" fill="#009E73" stroke="#000000" stroke-width="1.5"/>
<text x="462" y="205" font-size="14" fill="#E69F00" font-family="Noto Sans CJK SC, sans-serif">横切</text>
<text x="300" y="70" font-size="14" text-anchor="middle" fill="#D55E00" font-family="Noto Sans CJK SC, sans-serif">竖切</text>
<text x="368" y="74" font-size="14" fill="#CC79A7" font-family="Noto Sans CJK SC, sans-serif">斜切</text>
<text x="150" y="346" font-size="13" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">横轴：输入 1　　纵轴：输入 2</text>
<text x="60" y="392" font-size="14" font-family="Noto Sans CJK SC, sans-serif" fill="#000000">圆 = 输出 0，三角 = 输出 1。三条线怎么摆都分不干净——这就是单层感知机的天花板。横切、竖切各混进一圆一三角；斜切挤出三个圆、只留住一个三角。</text>
</svg>