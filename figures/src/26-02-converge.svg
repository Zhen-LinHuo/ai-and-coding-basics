<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/></marker>
</defs>
<text x="20" y="30" font-size="16" font-weight="bold" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">同一份声明，三台机器收敛到同一结果</text>
<g font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#000000">
<rect x="60" y="90" width="300" height="120" rx="10" fill="#ffffff" stroke="#0072B2" stroke-width="2"/>
<text x="210" y="120" text-anchor="middle" font-weight="bold" fill="#0072B2">系统配置（一个文件）</text>
<text x="80" y="150" font-size="13" fill="#999999">声明：装哪些包、开哪些服务、</text>
<text x="80" y="174" font-size="13" fill="#999999">用户是谁、防火墙规则……</text>
<text x="80" y="198" font-size="13" fill="#999999">这个文件进版本控制</text>
</g>
<path d="M 360 130 C 430 110 470 110 520 130" stroke="#000000" stroke-width="1.8" marker-end="url(#arr)"/>
<path d="M 360 170 C 430 190 470 190 520 170" stroke="#000000" stroke-width="1.8" marker-end="url(#arr)"/>
<path d="M 360 200 C 430 260 470 260 520 230" stroke="#000000" stroke-width="1.8" marker-end="url(#arr)"/>
<g font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#000000">
<rect x="525" y="100" width="150" height="70" rx="8" fill="#56B4E9" stroke="#000000" stroke-width="1.3"/><text x="600" y="140" text-anchor="middle">笔记本</text>
<rect x="525" y="185" width="150" height="70" rx="8" fill="#56B4E9" stroke="#000000" stroke-width="1.3"/><text x="600" y="225" text-anchor="middle">服务器</text>
<rect x="525" y="270" width="150" height="70" rx="8" fill="#56B4E9" stroke="#000000" stroke-width="1.3"/><text x="600" y="310" text-anchor="middle">旧机器救援</text>
</g>
<text x="60" y="380" font-size="14" font-family="Noto Sans CJK SC, sans-serif" fill="#000000">三台机器从同一份声明出发，收敛到相同的系统状态——"新机器到手一小时可用"就是这份声明的回报。</text>
</svg>