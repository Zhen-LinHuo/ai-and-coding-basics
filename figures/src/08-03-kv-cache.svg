<svg xmlns="http://www.w3.org/2000/svg" width="820" height="430" viewBox="0 0 820 430">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/></marker>
</defs>
<text x="20" y="30" font-size="16" font-weight="bold" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">KV 缓存：随对话线性增长的记忆包袱</text>
<g font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#000000">
<rect x="60" y="80" width="90" height="50" rx="6" fill="#56B4E9" stroke="#000000" stroke-width="1.2"/><text x="105" y="110" text-anchor="middle">第 1 轮</text>
<rect x="60" y="150" width="180" height="50" rx="6" fill="#56B4E9" fill-opacity="0.7" stroke="#000000" stroke-width="1.2"/><text x="150" y="180" text-anchor="middle">第 2 轮：缓存×2</text>
<rect x="60" y="220" width="360" height="50" rx="6" fill="#56B4E9" fill-opacity="0.5" stroke="#000000" stroke-width="1.2"/><text x="240" y="250" text-anchor="middle">第 3 轮：缓存×4</text>
<rect x="60" y="290" width="720" height="50" rx="6" fill="#56B4E9" fill-opacity="0.35" stroke="#000000" stroke-width="1.2"/><text x="420" y="320" text-anchor="middle">第 4 轮：缓存×8 —— 还没回答一个字，包袱已经翻三倍</text>
</g>
<g font-size="14" font-family="Noto Sans CJK SC, sans-serif" fill="#000000">
<text x="60" y="380">[第 1.5.2 节](#sec:attention)说过注意力要两两配对；推理时为了不重算，每一轮的"键值"都要留着——</text>
<text x="60" y="406" fill="#D55E00">这就是 KV 缓存：与上下文长度成正比，长对话的物理瓶颈。</text>
</g>
</svg>