<svg xmlns="http://www.w3.org/2000/svg" width="700" height="430" viewBox="0 0 700 430">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/></marker>
</defs>
<text x="20" y="30" font-size="16" font-weight="bold" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">多头：同一个房间里的几双眼睛</text>
<g font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#000000">
<rect x="60" y="70" width="200" height="46" rx="8" fill="#56B4E9" stroke="#000000" stroke-width="1.3"/>
<text x="160" y="98" text-anchor="middle">输入（同一句话）</text>
</g>
<path d="M 160 116 L 100 170" stroke="#999999" stroke-width="1.5" marker-end="url(#arr)"/>
<path d="M 160 116 L 260 170" stroke="#999999" stroke-width="1.5" marker-end="url(#arr)"/>
<path d="M 160 116 L 420 170" stroke="#999999" stroke-width="1.5" marker-end="url(#arr)"/>
<g font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#000000">
<rect x="40" y="172" width="180" height="70" rx="8" fill="#ffffff" stroke="#009E73" stroke-width="1.8"/>
<text x="130" y="198" text-anchor="middle" font-weight="bold" fill="#009E73">头 1：谁在干什么</text>
<text x="130" y="222" text-anchor="middle" fill="#999999">盯"动词-主语"搭配</text>
<rect x="250" y="172" width="180" height="70" rx="8" fill="#ffffff" stroke="#E69F00" stroke-width="1.8"/>
<text x="340" y="198" text-anchor="middle" font-weight="bold" fill="#E69F00">头 2：谁指谁</text>
<text x="340" y="222" text-anchor="middle" fill="#999999">盯代词与先行词</text>
<rect x="460" y="172" width="180" height="70" rx="8" fill="#ffffff" stroke="#CC79A7" stroke-width="1.8"/>
<text x="550" y="198" text-anchor="middle" font-weight="bold" fill="#CC79A7">头 3：修饰关系</text>
<text x="550" y="222" text-anchor="middle" fill="#999999">盯形容词与名词</text>
</g>
<path d="M 130 242 L 300 310" stroke="#999999" stroke-width="1.5" marker-end="url(#arr)"/>
<path d="M 340 242 L 320 310" stroke="#999999" stroke-width="1.5" marker-end="url(#arr)"/>
<path d="M 550 242 L 340 310" stroke="#999999" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="230" y="312" width="220" height="46" rx="8" fill="#56B4E9" stroke="#000000" stroke-width="1.5"/>
<text x="340" y="340" text-anchor="middle">拼在一起 → 下一层</text>
<text x="60" y="404" font-size="14" font-family="Noto Sans CJK SC, sans-serif" fill="#000000">每个头独立做一遍完整的注意力，看到的"关系"不同；头的分工不是人为指定的，是训练中自己长出来的。</text>
</svg>