<svg xmlns="http://www.w3.org/2000/svg" width="700" height="440" viewBox="0 0 700 440">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/></marker>
</defs>
<text x="20" y="30" font-size="16" font-weight="bold" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">多头：同一个房间里的几双眼睛</text>
<rect x="240" y="60" width="220" height="48" rx="8" fill="#56B4E9" stroke="#000000" stroke-width="1.3"/>
<text x="350" y="90" font-size="14" text-anchor="middle" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">输入（同一句话）</text>
<path d="M 300 110 L 170 168" stroke="#999999" stroke-width="1.5" marker-end="url(#arr)"/>
<path d="M 350 110 L 350 168" stroke="#999999" stroke-width="1.5" marker-end="url(#arr)"/>
<path d="M 400 110 L 530 168" stroke="#999999" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="60" y="170" width="220" height="66" rx="8" fill="#ffffff" stroke="#009E73" stroke-width="1.8"/>
<text x="170" y="196" font-size="14" text-anchor="middle" font-weight="bold" fill="#009E73" font-family="Noto Sans CJK SC, sans-serif">头 1：谁在干什么</text>
<text x="170" y="220" font-size="13" text-anchor="middle" fill="#999999" font-family="Noto Sans CJK SC, sans-serif">盯"主语—动词"搭配</text>
<rect x="240" y="170" width="220" height="66" rx="8" fill="#ffffff" stroke="#E69F00" stroke-width="1.8"/>
<text x="350" y="196" font-size="14" text-anchor="middle" font-weight="bold" fill="#E69F00" font-family="Noto Sans CJK SC, sans-serif">头 2：谁指谁</text>
<text x="350" y="220" font-size="13" text-anchor="middle" fill="#999999" font-family="Noto Sans CJK SC, sans-serif">盯代词与先行词</text>
<rect x="420" y="170" width="220" height="66" rx="8" fill="#ffffff" stroke="#CC79A7" stroke-width="1.8"/>
<text x="530" y="196" font-size="14" text-anchor="middle" font-weight="bold" fill="#CC79A7" font-family="Noto Sans CJK SC, sans-serif">头 3：修饰关系</text>
<text x="530" y="220" font-size="13" text-anchor="middle" fill="#999999" font-family="Noto Sans CJK SC, sans-serif">盯形容词与名词</text>
<path d="M 170 236 L 170 276" stroke="#999999" stroke-width="1.5"/>
<path d="M 350 236 L 350 276" stroke="#999999" stroke-width="1.5"/>
<path d="M 530 236 L 530 276" stroke="#999999" stroke-width="1.5"/>
<line x1="170" y1="276" x2="530" y2="276" stroke="#999999" stroke-width="1.5"/>
<path d="M 350 276 L 350 306" stroke="#000000" stroke-width="2" marker-end="url(#arr)"/>
<rect x="240" y="308" width="220" height="46" rx="8" fill="#56B4E9" stroke="#000000" stroke-width="1.5"/>
<text x="350" y="337" font-size="14" text-anchor="middle" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">输出拼在一起 → 下一层</text>
<text x="60" y="410" font-size="14" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">三个头各自独立做一遍完整的注意力，看到的"关系"不同；分工不是人为指定的，是训练中自己长出来的。</text>
</svg>