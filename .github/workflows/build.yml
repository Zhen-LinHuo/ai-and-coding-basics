name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

# PDF 不在 CI 里造。它是文档产物，构建环境重（TeX 数百 MB 起），
# 而 lint 这三项门是全书质量的真正守门员。构建与发版见 AGENTS.md。
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/lint_emoji.py
      - run: python scripts/lint_sections.py
      - run: python scripts/lint_bib.py
