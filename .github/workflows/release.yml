name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  pdf:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/zhen-linhuo/reproducible-executors/executor-guixsd:v0.2.2
      options: --privileged
    steps:
      - name: TLS trust and workspace ownership (must precede checkout)
        run: |
          {
            echo "SSL_CERT_FILE=/run/current-system/profile/etc/ssl/certs/ca-certificates.crt"
            echo "SSL_CERT_DIR=/run/current-system/profile/etc/ssl/certs"
            echo "CURL_CA_BUNDLE=/run/current-system/profile/etc/ssl/certs/ca-certificates.crt"
            echo "GIT_SSL_CAINFO=/run/current-system/profile/etc/ssl/certs/ca-certificates.crt"
            echo "GIT_CONFIG_COUNT=1"
            echo "GIT_CONFIG_KEY_0=safe.directory"
            echo "GIT_CONFIG_VALUE_0=*"
          } >> "$GITHUB_ENV"

      - name: put the system profile on PATH (must precede checkout)
        # 镜像的 /run/current-system/profile/bin 不在 PATH 上；不先加，checkout 找不到
        # git，会静默退回 REST 下载，结果是没有 .git 的工作区。
        run: echo "/run/current-system/profile/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@v4

      - name: start guix-daemon
        # 容器里没有 shepherd，socket 不会自己出现。就绪判据只用 socket + pid：
        # `guix gc --list-roots` 在没有 daemon 时也会返回 0，不能用来判活。
        run: |
          /run/current-system/profile/bin/guix-daemon \
            --build-users-group=guixbuild \
            --substitute-urls="https://bordeaux.guix.gnu.org https://ci.guix.gnu.org" \
            </dev/null >/var/log/guix-daemon.log 2>&1 &
          pid=$!
          for _ in $(seq 1 60); do
            kill -0 "$pid" 2>/dev/null || { echo "daemon died"; tail -40 /var/log/guix-daemon.log; exit 1; }
            [ -S /var/guix/daemon-socket/socket ] && break
            sleep 1
          done
          [ -S /var/guix/daemon-socket/socket ] || { echo "no socket"; tail -40 /var/log/guix-daemon.log; exit 1; }
          echo "guix-daemon up (pid $pid)"

      - name: build PDF
        run: |
          guix time-machine -C .guix/channels.scm -- \
            shell -m .guix/manifest.scm -- make pdf

      - uses: actions/upload-artifact@v4
        with:
          name: book-pdf
          path: build/out/*.pdf
          if-no-files-found: error

  publish:
    needs: pdf
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: book-pdf
          path: dist
      - name: attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.pdf
          fail_on_unmatched_files: true
      - name: read the asset back
        # release-integrity：不核对回读，等于不知道发出去的是什么。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          local_sum=$(sha256sum dist/*.pdf | awk '{print $1}')
          gh release download "${GITHUB_REF_NAME}" --pattern '*.pdf' --dir /tmp/back
          remote_sum=$(sha256sum /tmp/back/*.pdf | awk '{print $1}')
          echo "local : $local_sum"
          echo "remote: $remote_sum"
          [ "$local_sum" = "$remote_sum" ] || { echo "asset mismatch"; exit 1; }
          pdfinfo /tmp/back/*.pdf | awk '/^Pages:/{print "pages:", $2}'
