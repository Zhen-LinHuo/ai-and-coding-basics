</defs>
<text x="20" y="30" font-size="16" font-weight="bold" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">显存墙：三笔账加在一起</text>
<g font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#000000">
<rect x="60" y="80" width="420" height="60" fill="#0072B2" stroke="#000000" stroke-width="1.2"/>
<text x="270" y="116" text-anchor="middle" fill="#ffffff" font-weight="bold">权重（常驻，大头）</text>
<rect x="60" y="146" width="180" height="60" fill="#009E73" stroke="#000000" stroke-width="1.2"/>
<text x="150" y="182" text-anchor="middle" fill="#ffffff" font-weight="bold">激活</text>
<rect x="246" y="146" width="180" height="60" fill="#E69F00" stroke="#000000" stroke-width="1.2"/>
<text x="336" y="182" text-anchor="middle" fill="#ffffff" font-weight="bold">KV 缓存</text>
