<text x="60" y="170" font-size="14" fill="#999999" font-family="Noto Sans CJK SC, sans-serif">每个词只拿到上一词压缩出的"摘要"；隔得越远，早期信息磨损越重。</text>
<text x="60" y="240" font-size="15" font-weight="bold" fill="#0072B2" font-family="Noto Sans CJK SC, sans-serif">注意力：任意两词直达</text>
