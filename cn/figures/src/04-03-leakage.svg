<svg xmlns="http://www.w3.org/2000/svg" width="940" height="300" viewBox="0 0 940 300">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/></marker>
</defs>
<text x="20" y="30" font-size="16" font-weight="bold" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">三种常见的数据泄漏：考题混进题库</text>
<g font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#000000">
<rect x="40" y="60" width="280" height="170" rx="8" fill="#ffffff" stroke="#D55E00" stroke-width="1.8"/>
<text x="56" y="88" font-weight="bold" fill="#D55E00">时间穿越</text>
<text x="56" y="114">用明天的数据预测今天</text>
<text x="56" y="138">（随机切分时序数据）</text>
<text x="56" y="170" fill="#999999">模型"记住"了未来，</text>
<text x="56" y="192" fill="#999999">实盘一用就崩</text>
<rect x="340" y="60" width="280" height="170" rx="8" fill="#ffffff" stroke="#D55E00" stroke-width="1.8"/>
<text x="356" y="88" font-weight="bold" fill="#D55E00">同源重复</text>
<text x="356" y="114">同一患者的两次影像</text>
<text x="356" y="138">一份在训练集、一份在测试集</text>
<text x="356" y="170" fill="#999999">模型认得"这个人"，</text>
<text x="356" y="192" fill="#999999">不是认得"这个病"</text>
<rect x="640" y="60" width="280" height="170" rx="8" fill="#ffffff" stroke="#D55E00" stroke-width="1.8"/>
<text x="656" y="88" font-weight="bold" fill="#D55E00">特征泄题</text>
<text x="656" y="114">输入里藏着答案本身</text>
<text x="656" y="138">（"退款金额"出现在预测</text>
<text x="656" y="158">"是否退款"的输入里）</text>
<text x="656" y="190" fill="#999999">离线满分，上线归零</text>
</g>
<text x="40" y="276" font-size="14" font-family="Noto Sans CJK SC, sans-serif" fill="#000000">三种泄漏的共同症状：离线成绩高得可疑。看到"准确率 99.9%"，先怀疑泄漏，再怀疑天才。</text>
</svg>