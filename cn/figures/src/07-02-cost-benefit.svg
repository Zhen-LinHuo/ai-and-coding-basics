<g font-size="14" font-family="Noto Sans CJK SC, sans-serif" fill="#000000">
<text x="600" y="110" fill="#0072B2">多智能体：复杂任务上占优</text>
<text x="300" y="196" fill="#999999">单智能体：简单任务够用且便宜</text>
