<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/></marker>
<marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#009E73"/></marker>
<marker id="arrv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D55E00"/></marker>
<marker id="arrp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#CC79A7"/></marker>
</defs>
<text x="20" y="30" font-size="17" font-weight="bold" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">生物神经元</text>
<text x="660" y="30" font-size="17" font-weight="bold" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">人工神经元</text>
<!-- 生物：树突橙、胞体天蓝、轴突绿 -->
<path d="M 142 142 L 92 106 M 158 136 L 132 92 M 186 134 L 188 92 M 198 144 L 250 104" stroke="#E69F00" stroke-width="2.5" fill="none"/>
<circle cx="170" cy="170" r="38" fill="#56B4E9" stroke="#000000" stroke-width="1.5"/>
<text x="170" y="176" font-size="15" text-anchor="middle" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">胞体</text>
<path d="M 208 176 L 330 176" stroke="#009E73" stroke-width="3" fill="none"/>
<path d="M 330 176 L 366 162 M 330 176 L 366 190" stroke="#009E73" stroke-width="2.5" fill="none"/>
<text x="58" y="86" font-size="14" fill="#E69F00" font-family="Noto Sans CJK SC, sans-serif">树突</text>
<text x="248" y="206" font-size="14" fill="#009E73" font-family="Noto Sans CJK SC, sans-serif">轴突</text>
<text x="352" y="222" font-size="14" fill="#009E73" font-family="Noto Sans CJK SC, sans-serif">末梢</text>
<!-- 中栏映射 -->
<g font-size="15" fill="#CC79A7" font-family="Noto Sans CJK SC, sans-serif">
<text x="410" y="125" text-anchor="end">树突 收信号</text>
<path d="M 420 120 L 560 120" stroke="#CC79A7" stroke-width="2.5" marker-end="url(#arrp)"/>
<text x="570" y="125" fill="#000000">输入 x</text>
<text x="410" y="185" text-anchor="end">胞体 汇总</text>
<path d="M 420 180 L 560 180" stroke="#CC79A7" stroke-width="2.5" marker-end="url(#arrp)"/>
<text x="570" y="185" fill="#000000">加权求和 Σ</text>
<text x="410" y="245" text-anchor="end">轴突 传出</text>
<path d="M 420 240 L 560 240" stroke="#CC79A7" stroke-width="2.5" marker-end="url(#arrp)"/>
<text x="570" y="245" fill="#000000">输出 y</text>
</g>
<!-- 人工：输入橙、Σ天蓝、输出绿 -->
<g font-family="Noto Sans CJK SC, sans-serif" font-size="16" fill="#000000">
<circle cx="690" cy="110" r="17" fill="#E69F00" stroke="#000000" stroke-width="1.5"/><text x="690" y="116" text-anchor="middle">x₁</text>
<circle cx="690" cy="180" r="17" fill="#E69F00" stroke="#000000" stroke-width="1.5"/><text x="690" y="186" text-anchor="middle">x₂</text>
<circle cx="690" cy="250" r="17" fill="#E69F00" stroke="#000000" stroke-width="1.5"/><text x="690" y="256" text-anchor="middle">x₃</text>
<text x="652" y="72" font-size="14">输入</text>
</g>
<path d="M 707 112 L 768 158 M 707 180 L 768 180 M 707 248 L 768 202" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="726" y="128" font-size="14" fill="#D55E00" font-family="Noto Sans CJK SC, sans-serif">w₁</text>
<text x="726" y="172" font-size="14" fill="#D55E00" font-family="Noto Sans CJK SC, sans-serif">w₂</text>
<text x="726" y="244" font-size="14" fill="#D55E00" font-family="Noto Sans CJK SC, sans-serif">w₃</text>
<circle cx="800" cy="180" r="30" fill="#56B4E9" stroke="#000000" stroke-width="1.5"/>
<text x="800" y="186" font-size="17" text-anchor="middle" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">Σ</text>
<path d="M 830 180 L 856 180" stroke="#009E73" stroke-width="3" marker-end="url(#arr)"/>
<text x="862" y="186" font-size="16" fill="#009E73" font-family="Noto Sans CJK SC, sans-serif">y</text>
<text x="20" y="316" font-size="14" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">同色即同职：收信号的部件橙、汇总的部件天蓝、送出结果的部件绿。</text>

</svg>