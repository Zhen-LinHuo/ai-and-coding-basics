<svg xmlns="http://www.w3.org/2000/svg" width="860" height="320" viewBox="0 0 860 320">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/></marker>
</defs>
<text x="20" y="30" font-size="16" font-weight="bold" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">一次编辑-编译-调试循环</text>
<g font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#000000">
<rect x="70" y="90" width="170" height="54" rx="10" fill="#56B4E9" stroke="#000000" stroke-width="1.4"/><text x="155" y="122" text-anchor="middle">① 改代码</text>
<rect x="360" y="90" width="170" height="54" rx="10" fill="#E69F00" fill-opacity="0.35" stroke="#000000" stroke-width="1.4"/><text x="445" y="122" text-anchor="middle">② 编译：报错！</text>
<rect x="650" y="90" width="170" height="54" rx="10" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="735" y="122" text-anchor="middle">③ 读错误信息</text>
<rect x="650" y="210" width="170" height="54" rx="10" fill="#ffffff" stroke="#000000" stroke-width="1.4"/><text x="735" y="242" text-anchor="middle">④ 定位并理解</text>
<rect x="360" y="210" width="170" height="54" rx="10" fill="#E69F00" fill-opacity="0.35" stroke="#000000" stroke-width="1.4"/><text x="445" y="242" text-anchor="middle">⑤ 重编译：通过</text>
</g>
<path d="M 242 117 L 358 117" stroke="#000000" stroke-width="1.8" marker-end="url(#arr)"/>
<path d="M 532 117 L 648 117" stroke="#000000" stroke-width="1.8" marker-end="url(#arr)"/>
<path d="M 735 146 L 735 208" stroke="#000000" stroke-width="1.8" marker-end="url(#arr)"/>
<path d="M 648 237 L 532 237" stroke="#000000" stroke-width="1.8" marker-end="url(#arr)"/>
<path d="M 358 237 C 200 237 100 200 152 146" stroke="#009E73" stroke-width="2" fill="none" marker-end="url(#arr)"/>
<text x="180" y="288" font-size="14" fill="#009E73" font-family="Noto Sans CJK SC, sans-serif">编译器的错误信息不是指责，是线索——读它是新手成长最快的方式。</text>
</svg>