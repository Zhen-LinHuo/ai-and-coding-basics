<svg xmlns="http://www.w3.org/2000/svg" width="950" height="360" viewBox="0 0 950 360">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/></marker>
</defs>
<text x="20" y="30" font-size="16" font-weight="bold" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">同构与异构：一样的工人，和各司其职的工人</text>
<g font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#000000">
<rect x="40" y="70" width="410" height="220" rx="10" fill="#ffffff" stroke="#999999" stroke-width="2"/>
<text x="245" y="100" text-anchor="middle" font-weight="bold" fill="#999999">同构（CPU）：全能工人</text>
<rect x="90" y="130" width="100" height="50" rx="6" fill="#56B4E9" fill-opacity="0.3" stroke="#999999" stroke-width="1.2"/><text x="140" y="160" text-anchor="middle" font-size="12">核 1</text><rect x="210" y="130" width="100" height="50" rx="6" fill="#56B4E9" fill-opacity="0.3" stroke="#999999" stroke-width="1.2"/><text x="260" y="160" text-anchor="middle" font-size="12">核 2</text><rect x="330" y="130" width="100" height="50" rx="6" fill="#56B4E9" fill-opacity="0.3" stroke="#999999" stroke-width="1.2"/><text x="380" y="160" text-anchor="middle" font-size="12">核 3</text><rect x="90" y="200" width="100" height="50" rx="6" fill="#56B4E9" fill-opacity="0.3" stroke="#999999" stroke-width="1.2"/><text x="140" y="230" text-anchor="middle" font-size="12">核 4</text><rect x="210" y="200" width="100" height="50" rx="6" fill="#56B4E9" fill-opacity="0.3" stroke="#999999" stroke-width="1.2"/><text x="260" y="230" text-anchor="middle" font-size="12">核 5</text><rect x="330" y="200" width="100" height="50" rx="6" fill="#56B4E9" fill-opacity="0.3" stroke="#999999" stroke-width="1.2"/><text x="380" y="230" text-anchor="middle" font-size="12">核 6</text>
<text x="60" y="272" fill="#999999">什么都会做：逻辑、跳转、串行任务。</text>
<text x="60" y="296" fill="#999999">但"100 万次乘加"这种粗活，效率一般。</text>
<rect x="500" y="70" width="410" height="220" rx="10" fill="#ffffff" stroke="#0072B2" stroke-width="2"/>
<text x="705" y="100" text-anchor="middle" font-weight="bold" fill="#0072B2">异构（GPU/加速器）：专业团队</text>
<rect x="530" y="130" width="36" height="26" rx="4" fill="#0072B2" fill-opacity="0.7"/><rect x="574" y="130" width="36" height="26" rx="4" fill="#0072B2" fill-opacity="0.7"/><rect x="618" y="130" width="36" height="26" rx="4" fill="#0072B2" fill-opacity="0.7"/><rect x="662" y="130" width="36" height="26" rx="4" fill="#0072B2" fill-opacity="0.7"/><rect x="706" y="130" width="36" height="26" rx="4" fill="#0072B2" fill-opacity="0.7"/><rect x="750" y="130" width="36" height="26" rx="4" fill="#0072B2" fill-opacity="0.7"/><rect x="794" y="130" width="36" height="26" rx="4" fill="#0072B2" fill-opacity="0.7"/><rect x="838" y="130" width="36" height="26" rx="4" fill="#0072B2" fill-opacity="0.7"/><rect x="530" y="166" width="36" height="26" rx="4" fill="#0072B2" fill-opacity="0.7"/><rect x="574" y="166" width="36" height="26" rx="4" fill="#0072B2" fill-opacity="0.7"/><rect x="618" y="166" width="36" height="26" rx="4" fill="#0072B2" fill-opacity="0.7"/><rect x="662" y="166" width="36" height="26" rx="4" fill="#0072B2" fill-opacity="0.7"/><rect x="706" y="166" width="36" height="26" rx="4" fill="#0072B2" fill-opacity="0.7"/><rect x="750" y="166" width="36" height="26" rx="4" fill="#0072B2" fill-opacity="0.7"/><rect x="794" y="166" width="36" height="26" rx="4" fill="#0072B2" fill-opacity="0.7"/><rect x="838" y="166" width="36" height="26" rx="4" fill="#0072B2" fill-opacity="0.7"/><rect x="530" y="202" width="36" height="26" rx="4" fill="#0072B2" fill-opacity="0.7"/><rect x="574" y="202" width="36" height="26" rx="4" fill="#0072B2" fill-opacity="0.7"/><rect x="618" y="202" width="36" height="26" rx="4" fill="#0072B2" fill-opacity="0.7"/><rect x="662" y="202" width="36" height="26" rx="4" fill="#0072B2" fill-opacity="0.7"/><rect x="706" y="202" width="36" height="26" rx="4" fill="#0072B2" fill-opacity="0.7"/><rect x="750" y="202" width="36" height="26" rx="4" fill="#0072B2" fill-opacity="0.7"/><rect x="794" y="202" width="36" height="26" rx="4" fill="#0072B2" fill-opacity="0.7"/><rect x="838" y="202" width="36" height="26" rx="4" fill="#0072B2" fill-opacity="0.7"/>
<text x="520" y="248" fill="#0072B2">几千个小工人同时做同一件事：乘加。</text>
<text x="520" y="272" fill="#0072B2">神经网络 = 海量独立的乘加——天生对口。</text>
</g>
<text x="40" y="330" font-size="14" font-family="Noto Sans CJK SC, sans-serif" fill="#000000">这就是为什么 AI 时代显卡涨价：神经网络的主要工作（矩阵乘法）恰好是 GPU 最擅长的"笨活"。</text>
</svg>