<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/></marker>
<marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0072B2"/></marker>
</defs>
<text x="20" y="30" font-size="16" font-weight="bold" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">从一颗到一层到很多层："深度"这个名字的来历</text>
<g font-family="Noto Sans CJK SC, sans-serif">
<rect x="40" y="70" width="250" height="150" rx="10" fill="#ffffff" stroke="#D55E00" stroke-width="2"/>
<text x="56" y="98" font-size="15" font-weight="bold" fill="#D55E00">单层感知机（1960s）</text>
<text x="56" y="124" font-size="13" fill="#000000">一层神经元，一条直线边界。</text>
<text x="56" y="146" font-size="13" fill="#000000">XOR 直接判死刑。</text>
<rect x="330" y="70" width="250" height="150" rx="10" fill="#ffffff" stroke="#E69F00" stroke-width="2"/>
<text x="346" y="98" font-size="15" font-weight="bold" fill="#E69F00">多层感知机 MLP（1986 后）</text>
<text x="346" y="124" font-size="13" fill="#000000">中间加"隐藏层"，边界会拐弯。</text>
<text x="346" y="146" font-size="13" fill="#000000">XOR 解锁。</text>
<rect x="620" y="70" width="260" height="150" rx="10" fill="#ffffff" stroke="#0072B2" stroke-width="2"/>
<text x="636" y="98" font-size="15" font-weight="bold" fill="#0072B2">深度网络（2012 起）</text>
<text x="636" y="124" font-size="13" fill="#000000">隐藏层堆很多层，每层在上一层的</text>
<text x="636" y="146" font-size="13" fill="#000000">空间上再画一次线。</text>
</g>
<path d="M 296 145 L 322 145" stroke="#000000" stroke-width="2" marker-end="url(#arr)"/>
<path d="M 586 145 L 612 145" stroke="#000000" stroke-width="2" marker-end="url(#arr)"/>
<g font-size="14" font-family="Noto Sans CJK SC, sans-serif" fill="#000000">
<text x="40" y="270" fill="#D55E00">层数 = 1，深 = 0</text>
<text x="330" y="270" fill="#E69F00">层数 = 2，深 = 1</text>
<text x="620" y="270" fill="#0072B2">层数 = 几十到几百，这就是"深度"</text>
</g>
<g font-size="14" font-family="Noto Sans CJK SC, sans-serif" fill="#000000">
<text x="40" y="330">为什么"深"比"宽"划算？组合复用：第一层学会的小零件（边缘、拐角），</text>
<text x="40" y="356">第二层直接拿去拼大零件（耳朵、胡须），第三层拼整只猫——</text>
<text x="40" y="382">每个零件不用重学。扁平的一层想表达同样的东西，参数要多得多。</text>
<text x="40" y="430" fill="#999999">2012 年 ImageNet 那次夺冠（前文的绿色区），让"深度学习"接管了这个领域。</text>
</g>
</svg>