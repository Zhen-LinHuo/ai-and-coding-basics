<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/></marker>
</defs>
<text x="20" y="30" font-size="16" font-weight="bold" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">MCP：把"N×M 的接线"变成"N+M"</text>
<g font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#000000">
<rect x="60" y="110" width="200" height="90" rx="10" fill="#56B4E9" stroke="#000000" stroke-width="1.5"/>
<text x="160" y="146" text-anchor="middle" font-weight="bold">主机（你的助手）</text>
<text x="160" y="172" text-anchor="middle" fill="#999999" font-size="12">内置一个 MCP 客户端</text>
<rect x="480" y="60" width="220" height="52" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
<text x="590" y="92" text-anchor="middle">服务器：文件系统</text>
<rect x="480" y="128" width="220" height="52" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
<text x="590" y="160" text-anchor="middle">服务器：GitHub</text>
<rect x="480" y="196" width="220" height="52" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
<text x="590" y="228" text-anchor="middle">服务器：数据库</text>
</g>
<path d="M 262 140 L 478 90" stroke="#000000" stroke-width="1.8" marker-end="url(#arr)"/>
<path d="M 262 155 L 478 152" stroke="#000000" stroke-width="1.8" marker-end="url(#arr)"/>
<path d="M 262 170 L 478 218" stroke="#000000" stroke-width="1.8" marker-end="url(#arr)"/>
<g font-size="14" font-family="Noto Sans CJK SC, sans-serif" fill="#000000">
<text x="60" y="290">没有 MCP 之前：M 个助手接 N 个工具，要写 M×N 份专用胶水。</text>
<text x="60" y="318">有了统一协议：每个助手实现一次客户端，每个工具实现一次服务器——M+N 份。</text>
<text x="60" y="352" fill="#0072B2">统一接口的价值远大于接口本身：它把"接新工具"从开发问题变成了配置问题。</text>
</g>
</svg>