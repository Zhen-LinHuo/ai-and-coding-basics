<g font-size="14" font-family="Noto Sans CJK SC, sans-serif" fill="#000000">
<text x="660" y="120" fill="#D55E00">连线 3×4 + 4×2 = 20 条，</text>
<text x="660" y="144" fill="#D55E00">每条一个权重；</text>
<text x="660" y="184">再加每颗神经元的偏置</text>
<text x="660" y="208">4 + 2 = 6 个；</text>
<text x="660" y="248" fill="#0072B2">合计 26 个参数。</text>
<text x="660" y="292">训练就是把这 26 个旋钮</text>
<text x="660" y="316">一起拧到合适的位置。</text>
<text x="660" y="360" fill="#999999">GPT 级模型是同样的动作，</text>
<text x="660" y="384" fill="#999999">只是旋钮数以千亿计。</text>
