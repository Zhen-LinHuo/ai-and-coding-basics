<svg xmlns="http://www.w3.org/2000/svg" width="920" height="365" viewBox="0 0 920 365">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/></marker>
</defs>
<text x="20" y="30" font-size="16" font-weight="bold" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">The three schools = a threefold answer to "where intelligence comes from"</text>
<g font-family="Noto Sans CJK SC, sans-serif" font-size="13" fill="#000000">
<rect x="40" y="52" width="270" height="224" rx="10" fill="#ffffff" stroke="#D55E00" stroke-width="2"/>
<text x="54" y="78" font-size="15" font-weight="bold" fill="#D55E00">Symbolism</text>
<text x="54" y="102">Answer: intelligence comes from</text>
<text x="54" y="118">reasoning, and reasoning is the</text>
<text x="54" y="133">manipulation of symbols.</text>
<text x="54" y="154" font-size="10.9">Knowledge representation: explicit rules</text>
<text x="54" y="170">and facts ("birds can fly").</text>
<text x="54" y="192" font-size="11.8">Examples: logic, expert systems, chess</text>
<text x="54" y="207">programs.</text>
<text x="54" y="228" fill="#999999">Slogan: intelligence = symbol</text>
<text x="54" y="244" fill="#999999">manipulation.</text>
<rect x="330" y="52" width="270" height="239" rx="10" fill="#ffffff" stroke="#0072B2" stroke-width="2"/>
<text x="344" y="78" font-size="15" font-weight="bold" fill="#0072B2">Connectionism</text>
<text x="344" y="102" font-size="12.9">Answer: intelligence comes from how</text>
<text x="344" y="118" font-size="11.8">many simple units are connected, like a</text>
<text x="344" y="133">brain.</text>
<text x="344" y="154">Knowledge representation: spread</text>
<text x="344" y="170">across the connection weights,</text>
<text x="344" y="186">readable by nobody line by line.</text>
<text x="344" y="207">Examples: the perceptron, deep</text>
<text x="344" y="222">learning, large language models.</text>
<text x="344" y="244" fill="#999999" font-size="12.9">Slogan: intelligence = emerges from</text>
<text x="344" y="260" fill="#999999">data.</text>
<rect x="620" y="52" width="270" height="239" rx="10" fill="#ffffff" stroke="#009E73" stroke-width="2"/>
<text x="634" y="78" font-size="15" font-weight="bold" fill="#009E73">Behaviourism</text>
<text x="634" y="102">Answer: intelligence comes from</text>
<text x="634" y="118">interaction with the environment:</text>
<text x="634" y="133">act, take feedback, improve.</text>
<text x="634" y="154">Knowledge representation: no</text>
<text x="634" y="170" font-size="12.9">"stockpile"-style knowledge, only a</text>
<text x="634" y="186">policy for acting.</text>
<text x="634" y="207">Examples: cybernetics, robotics,</text>
<text x="634" y="222">reinforcement learning.</text>
<text x="634" y="244" fill="#999999">Slogan: intelligence =</text>
<text x="634" y="260" fill="#999999">discovered by trial and error.</text>
</g>
<text x="40" y="316" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">Do the three answers conflict? No. Today's strong systems usually</text>
<text x="40" y="332" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">borrow a bit of each — see the end of this chapter.</text>
</svg>
