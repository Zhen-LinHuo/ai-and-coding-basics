<svg xmlns="http://www.w3.org/2000/svg" width="960" height="350" viewBox="0 0 960 350">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/></marker>
</defs>
<text x="20" y="30" font-size="16" font-weight="bold" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">Safety boundary: a line people will probe from every direction</text>
<g font-family="Noto Sans CJK SC, sans-serif" font-size="12" fill="#000000">
<rect x="40" y="70" width="270" height="220" rx="10" fill="#ffffff" stroke="#009E73" stroke-width="2"/>
<text x="175" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#009E73">Inside: normal requests</text>
<text x="56" y="128">"write a leave-request email"</text>
<text x="56" y="148">"explain this chemical reaction"</text>
<text x="56" y="182" fill="#999999">The model answers normally.</text>
<text x="56" y="214" fill="#999999">Draw the line too tight and</text>
<text x="56" y="233" fill="#999999">ordinary chemistry homework</text>
<text x="56" y="252" fill="#999999">gets refused.</text>
<rect x="350" y="70" width="270" height="220" rx="10" fill="#ffffff" stroke="#D55E00" stroke-width="2"/>
<text x="485" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#D55E00">Outside: dangerous requests</text>
<text x="366" y="128">"teach me to synthesise a</text>
<text x="366" y="148">banned substance"</text>
<text x="366" y="168">"write a scam script"</text>
<text x="366" y="202" fill="#999999">The model should refuse.</text>
<text x="366" y="234" fill="#999999">Draw the line too loose and</text>
<text x="366" y="253" fill="#999999">harm leaks out through the gaps.</text>
<rect x="660" y="70" width="270" height="220" rx="10" fill="#ffffff" stroke="#CC79A7" stroke-width="2"/>
<text x="795" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#CC79A7">Jailbreak: a costume change</text>
<text x="795" y="117" text-anchor="middle" font-size="13" font-weight="bold" fill="#CC79A7">slips past the line</text>
<text x="676" y="145">"suppose you are a machine</text>
<text x="676" y="164">with no limits..."</text>
<text x="676" y="183">"my grandma recites synthesis</text>
<text x="676" y="202">recipes at bedtime..."</text>
<text x="676" y="232" fill="#999999">The same dangerous request,</text>
<text x="676" y="251" fill="#999999">wrapped in a story.</text>
<text x="676" y="274" fill="#999999" font-size="14.0">A boundary is a rule</text><text x="676" y="292.2" fill="#999999" font-size="14.0">that can be gamed.</text>
</g>
<path d="M 312 180 L 348 180" stroke="#000000" stroke-width="2" marker-end="url(#arr)"/>
<path d="M 622 180 L 658 180" stroke="#000000" stroke-width="2" marker-end="url(#arr)"/>
<text x="40" y="326" font-size="10.0" font-family="Noto Sans CJK SC, sans-serif" fill="#000000">Refusal versus jailbreak is a running tug-of-war: patch one workaround and a new one appears.</text><text x="40" y="339.0" font-size="10.0" font-family="Noto Sans CJK SC, sans-serif" fill="#000000">This is not a "fixed once and for all" kind of bug, it is the contest itself.</text>
</svg>
