<svg xmlns="http://www.w3.org/2000/svg" width="640" height="340" viewBox="0 0 640 340">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/></marker>
</defs>
<text x="20" y="30" font-size="16" font-weight="bold" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">A typical project tree: a newcomer guesses right in  10  minutes</text>
<g font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#000000">
<text x="80" y="80" font-family="monospace">myproject/</text>
<text x="110" y="106" font-family="monospace">README.md</text><text x="330" y="106" fill="#999999" font-size="12">← The first file a stranger reads</text>
<text x="110" y="132" font-family="monospace">src/</text><text x="330" y="132" fill="#999999" font-size="12">Source code</text>
<text x="110" y="158" font-family="monospace">tests/</text><text x="330" y="158" fill="#999999" font-size="12">Tests (next to  src , impossible to miss)</text>
<text x="110" y="184" font-family="monospace">docs/</text><text x="330" y="184" fill="#999999" font-size="12">Documentation</text>
<text x="110" y="210" font-family="monospace">LICENSE</text><text x="330" y="210" fill="#999999" font-size="12">Legal identity</text>
<text x="110" y="236" font-family="monospace">README  config beyond it……</text><text x="330" y="236" fill="#999999" font-size="12">Build and dependency declarations</text>
</g>
<text x="60" y="292" font-size="9.6" font-family="Noto Sans CJK SC, sans-serif" fill="#000000">The value of convention: location is documentation."Where are the tests?" No need to ask — the convention answered.</text>
<text x="60" y="318" font-size="13" fill="#999999" font-family="Noto Sans CJK SC, sans-serif">A clever structure of your own levies an "understanding tax" on every newcomer.</text>
</svg>