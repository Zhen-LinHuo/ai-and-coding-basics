<svg xmlns="http://www.w3.org/2000/svg" width="920" height="280" viewBox="0 0 920 280">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/></marker>
</defs>
<text x="20" y="30" font-size="16" font-weight="bold" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">Three areas: change → pick → archive</text>
<g font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#000000">
<rect x="60" y="90" width="200" height="120" rx="10" fill="#ffffff" stroke="#D55E00" stroke-width="2"/>
<text x="160" y="120" text-anchor="middle" font-weight="bold" fill="#D55E00">Working tree</text>
<text x="160" y="148" text-anchor="middle" fill="#999999" font-size="12">The files you are editing</text>
<text x="160" y="172" text-anchor="middle" fill="#999999" font-size="12">(mess is fine)</text>
<rect x="360" y="90" width="200" height="120" rx="10" fill="#ffffff" stroke="#E69F00" stroke-width="2"/>
<text x="460" y="120" text-anchor="middle" font-weight="bold" fill="#E69F00">Staging area</text>
<text x="460" y="148" text-anchor="middle" fill="#999999" font-size="12">Changes picked for archiving</text>
<text x="460" y="172" text-anchor="middle" fill="#999999" font-size="12">(you can pick only half)</text>
<rect x="660" y="90" width="200" height="120" rx="10" fill="#ffffff" stroke="#009E73" stroke-width="2"/>
<text x="760" y="120" text-anchor="middle" font-weight="bold" fill="#009E73">Repository (history)</text>
<text x="760" y="148" text-anchor="middle" fill="#999999" font-size="12">The formal snapshot chain</text>
<text x="760" y="172" text-anchor="middle" fill="#999999" font-size="12">(immutable)</text>
</g>
<path d="M 262 150 L 358 150" stroke="#000000" stroke-width="2" marker-end="url(#arr)"/>
<text x="310" y="138" font-size="13" text-anchor="middle" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">git add</text>
<path d="M 562 150 L 658 150" stroke="#000000" stroke-width="2" marker-end="url(#arr)"/>
<text x="610" y="138" font-size="13" text-anchor="middle" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">git commit</text>
<text x="60" y="248" font-size="12.7" font-family="Noto Sans CJK SC, sans-serif" fill="#000000">Why staging matters: changes can accumulate, committed by "logic" rather than by "time" — one commit, one story.</text>
</svg>