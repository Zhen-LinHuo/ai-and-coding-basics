<svg xmlns="http://www.w3.org/2000/svg" width="960" height="350" viewBox="0 0 960 350">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/></marker>
</defs>
<text x="20" y="30" font-size="16" font-weight="bold" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">Safety boundary: a line people will probe from every direction</text>
<g font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#000000">
<rect x="40" y="70" width="270" height="220" rx="10" fill="#ffffff" stroke="#009E73" stroke-width="2"/>
<text x="175" y="100" text-anchor="middle" font-weight="bold" fill="#009E73">Inside: normal requests</text>
<text x="56" y="130">""write a leave-request email""</text>
<text x="56" y="156">""explain this chemical reaction""</text>
<text x="56" y="190" fill="#999999">The model answers normally.</text>
<text x="56" y="222" fill="#999999">Draw the line too tight</text>
<text x="56" y="246" fill="#999999">and ordinary chemistry homework gets refused.</text>
<rect x="350" y="70" width="270" height="220" rx="10" fill="#ffffff" stroke="#D55E00" stroke-width="2"/>
<text x="485" y="100" text-anchor="middle" font-weight="bold" fill="#D55E00">Outside: dangerous requests</text>
<text x="366" y="130">""teach me to synthesise a banned substance""</text>
<text x="366" y="156">""write a scam script""</text>
<text x="366" y="190" fill="#999999">The model should refuse.</text>
<text x="366" y="222" fill="#999999">Draw the line too loose</text>
<text x="366" y="246" fill="#999999">and harm leaks out through the gaps.</text>
<rect x="660" y="70" width="270" height="220" rx="10" fill="#ffffff" stroke="#CC79A7" stroke-width="2"/>
<text x="795" y="100" text-anchor="middle" font-weight="bold" fill="#CC79A7" font-size="12.7">Jailbreak: a change of costume slips past the line</text>
<text x="676" y="130" font-size="10.9">""suppose you are a machine with no limits..."……"</text>
<text x="676" y="156" font-size="9.5">""my grandma recites synthesis recipes at bedtime..."……"</text>
<text x="676" y="190" fill="#999999">The same dangerous request,</text>
<text x="676" y="214" fill="#999999">wrapped in a story.</text>
<text x="676" y="246" fill="#999999" font-size="11.9">A boundary is a rule, and rules can be gamed.</text>
</g>
<path d="M 312 180 L 348 180" stroke="#000000" stroke-width="2" marker-end="url(#arr)"/>
<path d="M 622 180 L 658 180" stroke="#000000" stroke-width="2" marker-end="url(#arr)"/>
<text x="40" y="326" font-size="10.0" font-family="Noto Sans CJK SC, sans-serif" fill="#000000">Refusal versus jailbreak is a running tug-of-war: patch one workaround and a new one appears. This is not a""fixed once and for all""kind of bug bug, it is the contest itself.</text>
</svg>