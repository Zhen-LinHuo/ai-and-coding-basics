<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/></marker>
</defs>
<text x="20" y="30" font-size="16" font-weight="bold" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">Single agent vs Multi-agent: the gain is not free</text>
<line x1="110" y1="330" x2="800" y2="330" stroke="#000000" stroke-width="1.3" marker-end="url(#arr)"/>
<line x1="110" y1="330" x2="110" y2="70" stroke="#000000" stroke-width="1.3" marker-end="url(#arr)"/>
<text x="806" y="334" font-size="9.0" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">Task complexity</text>
<text x="46" y="66" font-size="13" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">Gain</text>
<line x1="140" y1="240" x2="700" y2="120" stroke="#0072B2" stroke-width="2.5"/>
<line x1="140" y1="240" x2="500" y2="140" stroke="#999999" stroke-width="2" stroke-dasharray="8 5"/>
<polyline points="500,140 540,150 580,170 620,200 660,240 700,290" fill="none" stroke="#D55E00" stroke-width="2.5" stroke-dasharray="8 5"/>
<g font-size="14" font-family="Noto Sans CJK SC, sans-serif" fill="#000000">
<text x="600" y="110" fill="#0072B2">Multi-agent: wins on complex tasks</text>
<text x="300" y="196" fill="#999999">Single agent: enough and cheaper on simple tasks</text>
<text x="560" y="248" fill="#D55E00" font-size="12.3">Past the line: coordination cost eats the gain</text>
<text x="140" y="372" fill="#999999" font-size="10.6">Dashed line = multi-agent gain: starts in the red (coordination overhead), catches up, overtakes, then sinks under its own chaos.</text>
</g>
</svg>