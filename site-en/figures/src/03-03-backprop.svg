<svg xmlns="http://www.w3.org/2000/svg" width="720" height="500" viewBox="0 0 720 500">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/></marker>
<marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0072B2"/></marker>
<marker id="arrv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D55E00"/></marker>
</defs>
<text x="20" y="30" font-size="16" font-weight="bold" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">Backpropagation: error at the output, the bill goes back to every neuron</text>
<line x1="159" y1="190" x2="341" y2="150" stroke="#999999" stroke-width="1"/><line x1="159" y1="190" x2="341" y2="230" stroke="#999999" stroke-width="1"/><line x1="159" y1="190" x2="341" y2="310" stroke="#999999" stroke-width="1"/><line x1="159" y1="290" x2="341" y2="150" stroke="#999999" stroke-width="1"/><line x1="159" y1="290" x2="341" y2="230" stroke="#999999" stroke-width="1"/><line x1="159" y1="290" x2="341" y2="310" stroke="#999999" stroke-width="1"/><line x1="379" y1="150" x2="561" y2="230" stroke="#999999" stroke-width="1"/><line x1="379" y1="230" x2="561" y2="230" stroke="#999999" stroke-width="1"/><line x1="379" y1="310" x2="561" y2="230" stroke="#999999" stroke-width="1"/><circle cx="140" cy="190" r="19" fill="#E69F00" stroke="#000000" stroke-width="1.5"/><circle cx="140" cy="290" r="19" fill="#E69F00" stroke="#000000" stroke-width="1.5"/><circle cx="360" cy="150" r="19" fill="#56B4E9" stroke="#000000" stroke-width="1.5"/><circle cx="360" cy="230" r="19" fill="#56B4E9" stroke="#000000" stroke-width="1.5"/><circle cx="360" cy="310" r="19" fill="#56B4E9" stroke="#000000" stroke-width="1.5"/><circle cx="580" cy="230" r="19" fill="#009E73" stroke="#000000" stroke-width="1.5"/>
<path d="M 560 262 C 470 330 280 330 155 312" stroke="#D55E00" stroke-width="2.5" fill="none" marker-end="url(#arrv)"/>
<text x="360" y="352" font-size="14" text-anchor="middle" fill="#D55E00" font-family="Noto Sans CJK SC, sans-serif">Error flows right to left</text>
<g font-size="14" font-family="Noto Sans CJK SC, sans-serif" fill="#000000">
<text x="140" y="150" text-anchor="middle">Input layer</text>
<text x="360" y="120" text-anchor="middle">Hidden layer</text>
<text x="580" y="185" text-anchor="middle">Output layer</text>
<text x="60" y="428">Grey: forward pass (left to right, giving the prediction).</text>
<text x="60" y="452">Red: backprop (right to left, layer by layer saying"how much of this error is yours").</text>
<text x="60" y="476">Each weight is turned by its share of blame—— more for the guilty, less for the rest.</text>
</g>
</svg>