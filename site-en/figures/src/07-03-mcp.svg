<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/></marker>
</defs>
<text x="20" y="30" font-size="16" font-weight="bold" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">MCP: turning "N×M  wiring "into "N+M"</text>
<g font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#000000">
<rect x="60" y="110" width="200" height="90" rx="10" fill="#56B4E9" stroke="#000000" stroke-width="1.5"/>
<text x="160" y="146" text-anchor="middle" font-weight="bold">Host (your assistant)</text>
<text x="160" y="172" text-anchor="middle" fill="#999999" font-size="12">with a built-in  MCP MCP client</text>
<rect x="480" y="60" width="220" height="52" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
<text x="590" y="92" text-anchor="middle">Server: filesystem</text>
<rect x="480" y="128" width="220" height="52" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
<text x="590" y="160" text-anchor="middle">Server: GitHub</text>
<rect x="480" y="196" width="220" height="52" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.3"/>
<text x="590" y="228" text-anchor="middle">Server: database</text>
</g>
<path d="M 262 140 L 478 90" stroke="#000000" stroke-width="1.8" marker-end="url(#arr)"/>
<path d="M 262 155 L 478 152" stroke="#000000" stroke-width="1.8" marker-end="url(#arr)"/>
<path d="M 262 170 L 478 218" stroke="#000000" stroke-width="1.8" marker-end="url(#arr)"/>
<g font-size="14" font-family="Noto Sans CJK SC, sans-serif" fill="#000000">
<text x="60" y="290">Without  MCP  before: M  assistants ×  N  tools =  M×N  bespoke glue adapters.</text>
<text x="60" y="318" font-size="13.5">One protocol: each assistant implements the client once, each tool a server once — ——M+N  adapters.</text>
<text x="60" y="352" fill="#0072B2" font-size="9.0">A unified interface is worth far more than the interface itself: it turns ""adding a new tool""from a development problem into a configuration problem.</text>
</g>
</svg>