<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/></marker>
</defs>
<text x="20" y="30" font-size="16" font-weight="bold" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">Multi-head: several pairs of eyes in one room</text>
<rect x="280" y="60" width="200" height="46" rx="8" fill="#56B4E9" stroke="#000000" stroke-width="1.3"/>
<text x="380" y="88" font-size="14" text-anchor="middle" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">input (the same sentence)</text>
<path d="M 320 108 L 160 164" stroke="#999999" stroke-width="1.5" marker-end="url(#arr)"/>
<path d="M 380 108 L 380 164" stroke="#999999" stroke-width="1.5" marker-end="url(#arr)"/>
<path d="M 440 108 L 600 164" stroke="#999999" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="40" y="166" width="230" height="62" rx="8" fill="#ffffff" stroke="#009E73" stroke-width="1.8"/>
<text x="155" y="192" font-size="14" text-anchor="middle" font-weight="bold" fill="#009E73" font-family="Noto Sans CJK SC, sans-serif">head 1what each one watches</text>
<text x="155" y="215" font-size="13" text-anchor="middle" fill="#999999" font-family="Noto Sans CJK SC, sans-serif">watch"subject—verb"collocation</text>
<rect x="285" y="166" width="230" height="62" rx="8" fill="#ffffff" stroke="#E69F00" stroke-width="1.8"/>
<text x="400" y="192" font-size="14" text-anchor="middle" font-weight="bold" fill="#E69F00" font-family="Noto Sans CJK SC, sans-serif">head 2who refers to whom</text>
<text x="400" y="215" font-size="13" text-anchor="middle" fill="#999999" font-family="Noto Sans CJK SC, sans-serif">watch pronoun and antecedent</text>
<rect x="530" y="166" width="230" height="62" rx="8" fill="#ffffff" stroke="#CC79A7" stroke-width="1.8"/>
<text x="645" y="192" font-size="14" text-anchor="middle" font-weight="bold" fill="#CC79A7" font-family="Noto Sans CJK SC, sans-serif">head 3modification</text>
<text x="645" y="215" font-size="13" text-anchor="middle" fill="#999999" font-family="Noto Sans CJK SC, sans-serif">watch adjective and noun</text>
<path d="M 155 228 L 155 268" stroke="#999999" stroke-width="1.5"/>
<path d="M 400 228 L 400 268" stroke="#999999" stroke-width="1.5"/>
<path d="M 645 228 L 645 268" stroke="#999999" stroke-width="1.5"/>
<line x1="155" y1="268" x2="645" y2="268" stroke="#999999" stroke-width="1.5"/>
<path d="M 400 268 L 400 300" stroke="#000000" stroke-width="2" marker-end="url(#arr)"/>
<rect x="280" y="302" width="240" height="46" rx="8" fill="#56B4E9" stroke="#000000" stroke-width="1.5"/>
<text x="400" y="331" font-size="14" text-anchor="middle" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">outputs concatenated → next layer</text>
<text x="40" y="404" font-size="10.4" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">Three heads each run the full attention independently, seeing different relations; the split is not assigned by hand, it grows in training.</text>
