<svg xmlns="http://www.w3.org/2000/svg" width="990" height="600" viewBox="0 0 990 600">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/></marker>
<marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0072B2"/></marker>
</defs>
<text x="20" y="30" font-size="16" font-weight="bold" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">Multimodal: different senses, one representation space</text>
<g font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#000000">
<rect x="40" y="80" width="200" height="120" rx="10" fill="#ffffff" stroke="#0072B2" stroke-width="2"/>
<text x="140" y="112" text-anchor="middle" font-weight="bold">text</text>
<text x="140" y="140" text-anchor="middle">split into token</text>
<text x="140" y="164" text-anchor="middle" fill="#999999">"the weather is nice today"</text>
<rect x="40" y="250" width="200" height="120" rx="10" fill="#ffffff" stroke="#E69F00" stroke-width="2"/>
<text x="140" y="282" text-anchor="middle" font-weight="bold">image</text>
<text x="140" y="310" text-anchor="middle">cut into small tiles</text>
<text x="140" y="334" text-anchor="middle" fill="#999999">16×16 pixel patch</text>
<rect x="40" y="420" width="200" height="110" rx="10" fill="#ffffff" stroke="#009E73" stroke-width="2"/>
<text x="140" y="452" text-anchor="middle" font-weight="bold">audio</text>
<text x="140" y="480" text-anchor="middle">cut into short frames</text>
<text x="140" y="504" text-anchor="middle" fill="#999999">each frame 20 ms</text>
</g>
<path d="M 240 140 C 330 140 380 220 430 260" stroke="#0072B2" stroke-width="2" fill="none" marker-end="url(#arr)"/>
<path d="M 240 310 L 430 290" stroke="#E69F00" stroke-width="2" fill="none" marker-end="url(#arr)"/>
<path d="M 240 475 C 330 470 380 380 430 330" stroke="#009E73" stroke-width="2" fill="none" marker-end="url(#arr)"/>
<g font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#000000">
<text x="450" y="200" fill="#999999">each passes through its own</text>
<text x="450" y="224" fill="#999999">"encoder"(also a</text>
<text x="450" y="248" fill="#999999">neural network)</text>
<rect x="460" y="270" width="240" height="110" rx="12" fill="#56B4E9" fill-opacity="0.25" stroke="#000000" stroke-width="1.5"/>
<text x="580" y="316" text-anchor="middle" font-weight="bold">one representation space</text>
<text x="580" y="344" text-anchor="middle" fill="#999999">everything is a column of numbers</text>
<circle cx="500" cy="340" r="6" fill="#0072B2"/><circle cx="540" cy="360" r="6" fill="#E69F00"/><circle cx="620" cy="330" r="6" fill="#009E73"/><circle cx="660" cy="352" r="6" fill="#0072B2"/>
</g>
<path d="M 700 325 L 780 325" stroke="#000000" stroke-width="2" marker-end="url(#arr)"/>
<rect x="782" y="270" width="180" height="110" rx="12" fill="#ffffff" stroke="#000000" stroke-width="2"/>
<text x="872" y="316" text-anchor="middle" font-weight="bold" font-size="15">large language model</text>
<text x="872" y="344" text-anchor="middle" fill="#999999" font-size="10.1">does not care which sense the input came from</text>
<text x="40" y="570" font-size="10.7" font-family="Noto Sans CJK SC, sans-serif" fill="#000000">the point is not"it can read images"but alignment: during training, paired"image and its text description"are pulled together, so both maps share one set of place names.</text>
</svg>