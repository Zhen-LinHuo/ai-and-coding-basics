site_name: AI and Computing, from First Principles
site_description: For readers who want to understand how it all actually works
site_url: https://zhen-linhuo.github.io/ai-and-coding-basics/en/
repo_url: https://github.com/Zhen-LinHuo/ai-and-coding-basics
edit_uri: blob/main/content/en/
docs_dir: site-src-en
site_dir: site/en

theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js


extra:
  alternate:
    - name: 中文
      link: /ai-and-coding-basics/cn/
      lang: zh
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Zhen-LinHuo/ai-and-coding-basics

copyright: >
  CC BY-SA 4.0 (text) · Apache-2.0 (code) © 2026 Zhen-Lin Huo · __SITE_VERSION__

