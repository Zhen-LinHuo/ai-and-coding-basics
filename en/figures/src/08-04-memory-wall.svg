<svg xmlns="http://www.w3.org/2000/svg" width="700" height="340" viewBox="0 0 700 340">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/></marker>
</defs>
<text x="20" y="30" font-size="16" font-weight="bold" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">The memory wall: three bills added together</text>
<g font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#000000">
<rect x="60" y="80" width="420" height="60" fill="#0072B2" stroke="#000000" stroke-width="1.2"/>
<text x="270" y="116" text-anchor="middle" fill="#ffffff" font-weight="bold">Weights (resident, the biggest share)</text>
<rect x="60" y="146" width="180" height="60" fill="#009E73" stroke="#000000" stroke-width="1.2"/>
<text x="150" y="182" text-anchor="middle" fill="#ffffff" font-weight="bold">Activations</text>
<rect x="246" y="146" width="180" height="60" fill="#E69F00" stroke="#000000" stroke-width="1.2"/>
<text x="336" y="182" text-anchor="middle" fill="#ffffff" font-weight="bold">KV cache</text>
<rect x="432" y="146" width="180" height="60" fill="#CC79A7" stroke="#000000" stroke-width="1.2"/>
<text x="522" y="182" text-anchor="middle" fill="#ffffff" font-weight="bold">Other overhead</text>
</g>
<g font-size="14" font-family="Noto Sans CJK SC, sans-serif" fill="#000000">
<text x="60" y="250" font-size="9.0">Three levers, three engineering directions: quantisation shrinks the weights (see earlier), batching spreads the activations, </text>
<text x="60" y="276" font-size="9.0">and sliding windows plus cache management shrink the KV — the fixed state seen earlier is the more aggressive move.</text>
<text x="60" y="310" fill="#D55E00">The wall's unit of measure is plain: can this model "fit" on one card.</text>
</g>
</svg>