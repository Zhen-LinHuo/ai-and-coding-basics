<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/></marker>
<marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0072B2"/></marker>
</defs>
<text x="20" y="30" font-size="16" font-weight="bold" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">From one neuron to a layer to many: "depth" — where the name came from</text>
<g font-family="Noto Sans CJK SC, sans-serif">
<rect x="40" y="70" width="250" height="150" rx="10" fill="#ffffff" stroke="#D55E00" stroke-width="2"/>
<text x="56" y="98" font-size="15" font-weight="bold" fill="#D55E00">Single-layer perceptron (1960s)</text>
<text x="56" y="124" font-size="13" fill="#000000">One layer of neurons, one straight boundary.</text>
<text x="56" y="146" font-size="13" fill="#000000">XOR is a dead end.</text>
<rect x="330" y="70" width="250" height="150" rx="10" fill="#ffffff" stroke="#E69F00" stroke-width="2"/>
<text x="346" y="98" font-size="15" font-weight="bold" fill="#E69F00">Multilayer perceptron MLP (1986 onward)</text>
<text x="346" y="124" font-size="13" fill="#000000">Add a "hidden layer" in between and the boundary bends.</text>
<text x="346" y="146" font-size="13" fill="#000000">XOR unlocked.</text>
<rect x="620" y="70" width="260" height="150" rx="10" fill="#ffffff" stroke="#0072B2" stroke-width="2"/>
<text x="636" y="98" font-size="15" font-weight="bold" fill="#0072B2">Deep networks (2012 onward)</text>
<text x="636" y="124" font-size="9.7" fill="#000000">Many stacked hidden layers, each redrawing the line</text>
<text x="636" y="146" font-size="13" fill="#000000">in the space the last one made.</text>
</g>
<path d="M 296 145 L 322 145" stroke="#000000" stroke-width="2" marker-end="url(#arr)"/>
<path d="M 586 145 L 612 145" stroke="#000000" stroke-width="2" marker-end="url(#arr)"/>
<g font-size="14" font-family="Noto Sans CJK SC, sans-serif" fill="#000000">
<text x="40" y="270" fill="#D55E00">Layers = 1, depth = 0</text>
<text x="330" y="270" fill="#E69F00">Layers = 2, depth = 1</text>
<text x="620" y="270" fill="#0072B2" font-size="11.7">Layers = dozens to hundreds — that is "depth"</text>
</g>
<g font-size="14" font-family="Noto Sans CJK SC, sans-serif" fill="#000000">
<text x="40" y="330">Why "deep" beats "wide"? Compositional reuse: the small parts the first layer learns (edges, corners),</text>
<text x="40" y="356">the second assembles into bigger parts (ears, whiskers), the third into a whole cat——</text>
<text x="40" y="382">No part is relearned. A flat single layer needs far more parameters for the same thing.</text>
<text x="40" y="430" fill="#999999" font-size="12.8">2012 marked the breakthrough: ImageNet took the title (Section  1.1 's green zone), letting "deep learning" take over the field.</text>
</g>
</svg>