<svg xmlns="http://www.w3.org/2000/svg" width="940" height="330" viewBox="0 0 940 330">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/></marker>
<marker id="arrv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#D55E00"/></marker>
</defs>
<text x="20" y="30" font-size="16" font-weight="bold" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">The hardest part of reinforcement learning: the score comes late and sparse</text>
<g font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#000000">
<text x="60" y="74">One game of 120 moves:</text>
<circle cx="60" cy="110" r="16" fill="#ffffff" stroke="#999999" stroke-width="1.5"/><text x="60" y="115" text-anchor="middle" font-size="11">#10.</text><circle cx="122" cy="110" r="16" fill="#ffffff" stroke="#999999" stroke-width="1.5"/><text x="122" y="115" text-anchor="middle" font-size="11">#20.</text><circle cx="184" cy="110" r="16" fill="#ffffff" stroke="#999999" stroke-width="1.5"/><text x="184" y="115" text-anchor="middle" font-size="11">#30.</text><circle cx="246" cy="110" r="16" fill="#ffffff" stroke="#999999" stroke-width="1.5"/><text x="246" y="115" text-anchor="middle" font-size="11">#40.</text><circle cx="308" cy="110" r="16" fill="#ffffff" stroke="#999999" stroke-width="1.5"/><text x="308" y="115" text-anchor="middle" font-size="11">#50.</text><circle cx="370" cy="110" r="16" fill="#ffffff" stroke="#999999" stroke-width="1.5"/><text x="370" y="115" text-anchor="middle" font-size="11">#60.</text><circle cx="432" cy="110" r="16" fill="#ffffff" stroke="#999999" stroke-width="1.5"/><text x="432" y="115" text-anchor="middle" font-size="11">#70.</text><circle cx="494" cy="110" r="16" fill="#ffffff" stroke="#999999" stroke-width="1.5"/><text x="494" y="115" text-anchor="middle" font-size="11">#80.</text><circle cx="556" cy="110" r="16" fill="#ffffff" stroke="#999999" stroke-width="1.5"/><text x="556" y="115" text-anchor="middle" font-size="11">#90.</text><circle cx="618" cy="110" r="16" fill="#ffffff" stroke="#999999" stroke-width="1.5"/><text x="618" y="115" text-anchor="middle" font-size="11">#100.</text><circle cx="680" cy="110" r="16" fill="#ffffff" stroke="#999999" stroke-width="1.5"/><text x="680" y="115" text-anchor="middle" font-size="11">#110.</text><circle cx="742" cy="110" r="16" fill="#ffffff" stroke="#999999" stroke-width="1.5"/><text x="742" y="115" text-anchor="middle" font-size="11">#120.</text>
<path d="M 60 146 L 760 146" stroke="#999999" stroke-width="1"/>
<path d="M 745 110 L 762 110" stroke="#000000" stroke-width="2" marker-end="url(#arr)"/>
<text x="778" y="114" font-size="13" fill="#000000">End</text>
<text x="745" y="84" font-size="14" fill="#D55E00">+1 (a win)</text>
<text x="60" y="196" fill="#D55E00">The whole episode hands out a score at this single instant.</text>
<text x="60" y="222">Question: how much credit do step 3 and step 97  each get for this "win"?</text>
<text x="60" y="256" fill="#0072B2" font-size="10.3">This is "credit assignment": the score is spread back over every step in time——the same mental work as spreading the error back to every weight in backpropagation.</text>
<text x="60" y="300" fill="#999999" font-size="9.0">The later and sparser the score, the slower the learning; so many tasks add "process rewards" (a pellet eaten also scores), but process rewards are easy to design badly and teach it to game the score.</text>
</g>
</svg>