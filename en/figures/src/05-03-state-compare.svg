e-width="0.5"/><line x1="240" y1="110" x2="640" y2="110" stroke="#0072B2" stroke-width="0.5"/><line x1="320" y1="110" x2="400" y2="110" stroke="#0072B2" stroke-width="0.5"/><line x1="320" y1="110" x2="480" y2="110" stroke="#0072B2" stroke-width="0.5"/><line x1="320" y1="110" x2="560" y2="110" stroke="#0072B2" stroke-width="0.5"/><line x1="320" y1="110" x2="640" y2="110" stroke="#0072B2" stroke-width="0.5"/><line x1="400" y1="110" x2="480" y2="110" stroke="#0072B2" stroke-width="0.5"/><line x1="400" y1="110" x2="560" y2="110" stroke="#0072B2" stroke-width="0.5"/><line x1="400" y1="110" x2="640" y2="110" stroke="#0072B2" stroke-width="0.5"/><line x1="480" y1="110" x2="560" y2="110" stroke="#0072B2" stroke-width="0.5"/><line x1="480" y1="110" x2="640" y2="110" stroke="#0072B2" stroke-width="0.5"/><line x1="560" y1="110" x2="640" y2="110" stroke="#0072B2" stroke-width="0.5"/>
<text x="740" y="114" font-size="11.2" fill="#0072B2" font-family="Noto Sans CJK SC, sans-serif">cache grows with length</text>
<text x="60" y="196" font-size="14" font-weight="bold" fill="#009E73" font-family="Noto Sans CJK SC, sans-serif">linear attention / SSM: squeeze history into a fixed-size state</text>
<rect x="80" y="230" width="150" height="70" rx="10" fill="#009E73" fill-opacity="0.25" stroke="#009E73" stroke-width="2"/>
<text x="155" y="262" text-anchor="middle" font-size="14" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">state</text>
<text x="155" y="286" text-anchor="middle" font-size="12" fill="#999999" font-family="Noto Sans CJK SC, sans-serif">fixed size</text>
<circle cx="270" cy="265" r="12" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><path d="M 258 265 L 224 265" stroke="#999999" stroke-width="1" marker-end="url(#arr)"/><circle cx="360" cy="265" r="12" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><path d="M 348 265 L 314 265" stroke="#999999" stroke-width="1" marker-end="url(#arr)"/><circle cx="450" cy="265" r="12" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><path d="M 438 265 L 404 265" stroke="#999999" stroke-width="1" marker-end="url(#arr)"/><circle cx="540" cy="265" r="12" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><path d="M 528 265 L 494 265" stroke="#999999" stroke-width="1" marker-end="url(#arr)"/><circle cx="630" cy="265" r="12" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><path d="M 618 265 L 584 265" stroke="#999999" stroke-width="1" marker-end="url(#arr)"/><circle cx="720" cy="265" r="12" fill="#ffffff" stroke="#000000" stroke-width="1.2"/><path d="M 708 265 L 674 265" stroke="#999999" stroke-width="1" marker-end="url(#arr)"/>
<text x="270" y="310" font-size="13" fill="#999999" font-family="Noto Sans CJK SC, sans-serif">each new word: read the state, update it, same size</text>
<g font-size="14" font-family="Noto Sans CJK SC, sans-serif" fill="#000000">
<text x="60" y="356">look back over all history: exact, but cache and compute grow quadratically with length.</text>
<text x="60" y="384">summary only: constant memory, linear speed, but"recalling one early detail exactly"is hard.</text>
</g>
</svg>