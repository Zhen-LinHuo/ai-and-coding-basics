<text x="20" y="30" font-size="16" font-weight="bold" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">Two ways to remember: keep everything, or keep a summary</text>
<text x="60" y="76" font-size="14" font-weight="bold" fill="#0072B2" font-family="Noto Sans CJK SC, sans-serif">attention: every step can look back over all history</text>
