<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/></marker>
</defs>
<text x="20" y="30" font-size="16" font-weight="bold" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">Ten thousand records, split three ways, each with a job</text>
<rect x="40" y="70" width="560" height="60" fill="#56B4E9" fill-opacity="0.35" stroke="#000000" stroke-width="1.3"/>
<text x="320" y="106" font-size="15" text-anchor="middle" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">Training set 70%</text>
<rect x="610" y="70" width="120" height="60" fill="#E69F00" fill-opacity="0.4" stroke="#000000" stroke-width="1.3"/>
<text x="670" y="106" font-size="14" text-anchor="middle" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">Validation set 15%</text>
<rect x="740" y="70" width="120" height="60" fill="#D55E00" fill-opacity="0.35" stroke="#000000" stroke-width="1.3"/>
<text x="800" y="106" font-size="14" text-anchor="middle" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">Test set 15%</text>
<g font-size="14" font-family="Noto Sans CJK SC, sans-serif" fill="#000000">
<text x="40" y="172" fill="#0072B2">Training set: the workbook that adjusts the weights.</text>
<text x="40" y="198" fill="#E69F00">Validation set: a mock exam for tuning "how it learns":—— pick the model, set hyperparameters, decide when to stop.</text>
<text x="40" y="224" fill="#D55E00">Test set: the final exam, sat exactly once.</text>
<text x="40" y="266" fill="#999999" font-size="12.1">Tune against the validation set too often and it is "leaked"; the test set is one-shot ———sit it twice and the score stops being honest.</text>
<text x="40" y="300">This three-way split is the backbone of the whole " how do you know it has learned" question.</text>
</g>
</svg>