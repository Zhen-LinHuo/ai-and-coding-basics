<svg xmlns="http://www.w3.org/2000/svg" width="720" height="410" viewBox="0 0 720 410">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/></marker>
</defs><text x="20" y="30" font-size="16" font-weight="bold" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">Generations: two upgrade outcomes, both with an exit</text>
<g font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#000000">
<rect x="70" y="120" width="180" height="70" rx="8" fill="#56B4E9" fill-opacity="0.45" stroke="#000000" stroke-width="1.4"/>
<text x="160" y="150" text-anchor="middle">Generation  41  generation</text>
<text x="160" y="172" text-anchor="middle" font-size="12" fill="#999999">Current system, all fine</text>
<rect x="470" y="70" width="180" height="70" rx="8" fill="#009E73" fill-opacity="0.35" stroke="#000000" stroke-width="1.4"/>
<text x="560" y="100" text-anchor="middle">Generation  42  generation</text>
<text x="560" y="122" text-anchor="middle" font-size="12" fill="#999999">Option 1: upgrade succeeds — switch to it</text>
<rect x="470" y="210" width="180" height="70" rx="8" fill="#ffffff" stroke="#D55E00" stroke-width="1.5" stroke-dasharray="7 4"/>
<text x="560" y="240" text-anchor="middle" fill="#D55E00">Option 2: 42  has problems</text>
<text x="560" y="262" text-anchor="middle" font-size="11.6" fill="#999999">Generation  41  generation still sits there untouched</text>
</g>
<path d="M 252 140 L 468 116" stroke="#009E73" stroke-width="2.2" marker-end="url(#arr)"/>
<text x="356" y="112" font-size="13" fill="#009E73" font-family="Noto Sans CJK SC, sans-serif">① Upgrade</text>
<path d="M 468 260 C 380 300 220 280 178 194" stroke="#D55E00" stroke-width="2.2" stroke-dasharray="8 5" fill="none" marker-end="url(#arr)"/>
<text x="300" y="308" font-size="13" fill="#D55E00" font-family="Noto Sans CJK SC, sans-serif">② Rollback: point back at generation  41 , atomic</text>
<g font-size="14" font-family="Noto Sans CJK SC, sans-serif" fill="#000000">
<text x="60" y="352" font-size="10.6">Both options share one premise: generation  41  was never modified——Upgrade and rollback are both just "pointer" moves.</text>
<text x="60" y="380" fill="#009E73">The confidence to upgrade boldly comes from ""failure costs nothing"".</text>
</g>
</svg>