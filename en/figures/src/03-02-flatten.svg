<text x="350" y="152" font-size="8.6" text-anchor="middle" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">straighten row by row</text>
<g font-family="Noto Sans CJK SC, sans-serif" font-size="13" fill="#000000">
<text x="415" y="110">0, 0, 0, 0, 1, 1, 0, 0, ……</text>
<text x="415" y="136">0, 0, 0, 1, 0, 0, 1, 0, ……</text>
<text x="415" y="162">……( 784 numbers)</text>
</g>
<g font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#000000">
<text x="415" y="230">Straightening loses nothing: each cell</text>
<text x="415" y="254">maps to one position in the list.</text>
<text x="415" y="296" fill="#999999">But "which pixels are adjacent" this geometry</text>
<text x="415" y="320" fill="#999999">lives only in the indices; the net must learn it.</text>
<text x="415" y="362">784 is this world's "dimensionality".</text>
<text x="415" y="386">Another 4000×3000 photo is 30M.</text>
</g>
