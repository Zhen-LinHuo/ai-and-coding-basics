<svg xmlns="http://www.w3.org/2000/svg" width="620" height="310" viewBox="0 0 620 310">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/></marker>
</defs>
<text x="20" y="30" font-size="16" font-weight="bold" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">What happens in the stack when a function is called</text>
<g font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#000000">
<rect x="60" y="200" width="160" height="40" fill="#56B4E9" stroke="#000000" stroke-width="1.2"/><text x="140" y="226" text-anchor="middle">main() 's frame</text>
<rect x="60" y="160" width="160" height="40" fill="#E69F00" fill-opacity="0.5" stroke="#000000" stroke-width="1.2"/><text x="140" y="186" text-anchor="middle">read_file() 's frame</text>
<rect x="60" y="120" width="160" height="40" fill="#009E73" fill-opacity="0.5" stroke="#000000" stroke-width="1.2"/><text x="140" y="146" text-anchor="middle">parse() 's frame</text>
<text x="250" y="146" fill="#000000">↑ Top: the function currently running</text>
<text x="250" y="186" fill="#000000">Middle: callers waiting for results</text>
<text x="250" y="226" fill="#000000">Bottom: program entry point</text>
<text x="60" y="290" fill="#999999" font-size="10.0">Function returns = its frame is removed."Stack overflow"= nesting too deep — frames piled past the ceiling.</text>
</g>
</svg>