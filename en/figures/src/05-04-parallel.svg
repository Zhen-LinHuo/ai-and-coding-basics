<text x="60" y="412" font-size="12" fill="#999999" font-family="Noto Sans CJK SC, sans-serif">step 1 1: the whole sentence is placeholders→step 2 2: a rough fill together→step 3 step 3: refined together</text>
<g font-size="14" font-family="Noto Sans CJK SC, sans-serif" fill="#000000">
<text x="60" y="452">autoregressive:n words need at least n steps, one after another, no early finish.</text>
<text x="60" y="480" fill="#009E73" font-size="11.6">diffusion: a whole passage settled in a few dozen steps—parallelism is</text><text x="60" y="495.1" fill="#009E73" font-size="11.6">where" speed" comes from; but long-text coherence is harder to keep.</text>
</g>
