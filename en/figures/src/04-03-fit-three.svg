<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/></marker>
</defs>
<text x="20" y="22" font-size="15" font-weight="bold" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">One dataset, three ways of "learning" (black dots are the training data)</text>
<rect x="40" y="50" width="260" height="190" fill="#ffffff" stroke="#000000" stroke-width="1.3"/><circle cx="68" cy="83" r="4" fill="#000000"/><circle cx="84" cy="120" r="4" fill="#000000"/><circle cx="99" cy="98" r="4" fill="#000000"/><circle cx="115" cy="141" r="4" fill="#000000"/><circle cx="131" cy="127" r="4" fill="#000000"/><circle cx="146" cy="163" r="4" fill="#000000"/><circle cx="162" cy="156" r="4" fill="#000000"/><circle cx="178" cy="170" r="4" fill="#000000"/><circle cx="194" cy="185" r="4" fill="#000000"/><circle cx="209" cy="200" r="4" fill="#000000"/><circle cx="225" cy="203" r="4" fill="#000000"/><circle cx="241" cy="209" r="4" fill="#000000"/><circle cx="256" cy="212" r="4" fill="#000000"/><circle cx="272" cy="210" r="4" fill="#000000"/><line x1="60" y1="83" x2="280" y2="210" stroke="#999999" stroke-width="3"/><text x="170.0" y="40" font-size="14" text-anchor="middle" fill="#999999" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">Underfitting: too lazy</text>
<rect x="350" y="50" width="260" height="190" fill="#ffffff" stroke="#000000" stroke-width="1.3"/><circle cx="378" cy="83" r="4" fill="#000000"/><circle cx="394" cy="120" r="4" fill="#000000"/><circle cx="409" cy="98" r="4" fill="#000000"/><circle cx="425" cy="141" r="4" fill="#000000"/><circle cx="441" cy="127" r="4" fill="#000000"/><circle cx="456" cy="163" r="4" fill="#000000"/><circle cx="472" cy="156" r="4" fill="#000000"/><circle cx="488" cy="170" r="4" fill="#000000"/><circle cx="504" cy="185" r="4" fill="#000000"/><circle cx="519" cy="200" r="4" fill="#000000"/><circle cx="535" cy="203" r="4" fill="#000000"/><circle cx="551" cy="209" r="4" fill="#000000"/><circle cx="566" cy="212" r="4" fill="#000000"/><circle cx="582" cy="210" r="4" fill="#000000"/><polyline points="370,76 409,116 449,152 488,167 527,185 566,205 590,207" fill="none" stroke="#009E73" stroke-width="3"/><text x="480.0" y="40" font-size="14" text-anchor="middle" fill="#009E73" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">Just right: catches the trend</text>
<rect x="660" y="50" width="260" height="190" fill="#ffffff" stroke="#000000" stroke-width="1.3"/><circle cx="688" cy="83" r="4" fill="#000000"/><circle cx="704" cy="120" r="4" fill="#000000"/><circle cx="719" cy="98" r="4" fill="#000000"/><circle cx="735" cy="141" r="4" fill="#000000"/><circle cx="751" cy="127" r="4" fill="#000000"/><circle cx="766" cy="163" r="4" fill="#000000"/><circle cx="782" cy="156" r="4" fill="#000000"/><circle cx="798" cy="170" r="4" fill="#000000"/><circle cx="814" cy="185" r="4" fill="#000000"/><circle cx="829" cy="200" r="4" fill="#000000"/><circle cx="845" cy="203" r="4" fill="#000000"/><circle cx="861" cy="209" r="4" fill="#000000"/><circle cx="876" cy="212" r="4" fill="#000000"/><circle cx="892" cy="210" r="4" fill="#000000"/><polyline points="688,83 704,120 719,98 735,141 751,127 766,163 782,156 798,170 814,185 829,200 845,203 861,209 876,212 892,210" fill="none" stroke="#D55E00" stroke-width="2.5"/><text x="790.0" y="40" font-size="14" text-anchor="middle" fill="#D55E00" font-weight="bold" font-family="Noto Sans CJK SC, sans-serif">Overfitting: memorises every point</text>
<g font-size="14" font-family="Noto Sans CJK SC, sans-serif" fill="#000000">
<text x="40" y="268" font-size="11.5">A single straight line that misses</text>
<text x="40" y="284" font-size="11.5">even the trend.</text>
<text x="350" y="268" font-size="11.5">Runs smoothly through the middle of</text>
<text x="350" y="284" font-size="11.5">the cloud, tolerating stray points.</text>
<text x="660" y="268" font-size="11.5">Passes exactly through every point</text>
<text x="660" y="284" font-size="11.5">and invents sawteeth the data never had.</text>
<text x="40" y="312" fill="#999999">Training scores: poor, good, 100 points.</text>
<text x="40" y="338" fill="#D55E00">But on fresh data the middle one wins — "memorising" is not "solving".</text>
</g>
</svg>