<svg xmlns="http://www.w3.org/2000/svg" width="660" height="320" viewBox="0 0 660 320">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/></marker>
</defs>
<text x="20" y="30" font-size="16" font-weight="bold" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">Two shapes of merging</text>
<g font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#000000">
<text x="60" y="76" font-weight="bold" fill="#0072B2">Fast-forward: main line untouched — slide the pointer to the new tip</text>
<circle cx="100" cy="110" r="20" fill="#56B4E9" stroke="#000000" stroke-width="1.3"/><text x="100" y="115" text-anchor="middle" font-size="12">A</text>
<circle cx="220" cy="110" r="20" fill="#56B4E9" stroke="#000000" stroke-width="1.3"/><text x="220" y="115" text-anchor="middle" font-size="12">B</text>
<circle cx="340" cy="110" r="20" fill="#009E73" stroke="#000000" stroke-width="1.3"/><text x="340" y="115" text-anchor="middle" font-size="12">C</text>
<path d="M 122 110 L 198 110" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/>
<path d="M 242 110 L 318 110" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="60" y="150" fill="#999999" font-size="12">History has no "merge" step — there was no need.</text>
<text x="60" y="200" font-weight="bold" fill="#E69F00">Three-way merge: both sides moved — create a new commit with two parents</text>
<circle cx="100" cy="250" r="20" fill="#56B4E9" stroke="#000000" stroke-width="1.3"/><text x="100" y="255" text-anchor="middle" font-size="12">A</text>
<circle cx="220" cy="230" r="20" fill="#56B4E9" stroke="#000000" stroke-width="1.3"/><text x="220" y="235" text-anchor="middle" font-size="12">B</text>
<circle cx="220" cy="290" r="20" fill="#56B4E9" stroke="#000000" stroke-width="1.3"/><text x="220" y="295" text-anchor="middle" font-size="12">C</text>
<circle cx="340" cy="260" r="20" fill="#E69F00" stroke="#000000" stroke-width="1.3"/><text x="340" y="265" text-anchor="middle" font-size="12">M</text>
<path d="M 120 244 L 200 234" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/>
<path d="M 120 268 L 200 284" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/>
<path d="M 240 240 L 320 256" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/>
<path d="M 240 288 L 320 268" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="380" y="262" fill="#999999" font-size="12">M remembers both B and C; </text>
<text x="380" y="282" fill="#999999" font-size="9.0">if both sides changed the same line</text><text x="380" y="293.7" fill="#999999" font-size="9.0">→ conflict; a human decides.</text>
</g>
</svg>