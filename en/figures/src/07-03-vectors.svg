<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/></marker>
</defs>
<text x="20" y="30" font-size="16" font-weight="bold" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">In vector space, "similar meaning" means "close together"</text>
<circle cx="330" cy="190" r="150" fill="#56B4E9" fill-opacity="0.15" stroke="#999999" stroke-width="1"/>
<circle cx="250" cy="150" r="7" fill="#0072B2"/><text x="250" y="132" text-anchor="middle" font-size="13" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">Annual leave days</text>
<circle cx="290" cy="170" r="7" fill="#0072B2"/><text x="290" y="192" text-anchor="middle" font-size="13" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">How to request leave</text>
<circle cx="270" cy="120" r="7" fill="#0072B2"/><text x="270" y="104" text-anchor="middle" font-size="13" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">Leave and sick leave</text>
<circle cx="420" cy="240" r="7" fill="#D55E00"/><text x="448" y="264" text-anchor="middle" font-size="13" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">Expense process</text>
<circle cx="460" cy="260" r="7" fill="#D55E00"/><text x="460" y="284" text-anchor="middle" font-size="13" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">Travel expenses</text>
<text x="140" y="260" font-size="13" fill="#0072B2" font-family="Noto Sans CJK SC, sans-serif">Question: "how is leave counted?"</text>
<path d="M 262 246 L 268 182" stroke="#000000" stroke-width="1.5" marker-end="url(#arr)"/>
<g font-size="14" font-family="Noto Sans CJK SC, sans-serif" fill="#000000">
<text x="560" y="140" font-size="12.6">Embeddings turn each passage</text><text x="560" y="156.4" font-size="12.6">into a point in space.</text>
<text x="560" y="168" font-size="12.4">Training pulls "similar meaning" points together: </text>
<text x="560" y="196" fill="#0072B2">the three leave documents form one cluster; </text>
<text x="560" y="224" fill="#D55E00">the two expense documents form another.</text>
<text x="560" y="256" font-size="12.8">Retrieval  = plots a question</text><text x="560" y="272" font-size="12.8">point and takes its</text>
<text x="560" y="292">nearest  k neighbours.</text>
<text x="560" y="316" fill="#999999" font-size="12.6">"Semantic retrieval"'s whole</text><text x="560" fill="#999999" font-size="12.6" y="336">magic is this picture.</text>
</g>
</svg>