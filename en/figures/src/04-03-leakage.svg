<svg xmlns="http://www.w3.org/2000/svg" width="940" height="300" viewBox="0 0 940 300">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/></marker>
</defs>
<text x="20" y="30" font-size="16" font-weight="bold" fill="#000000" font-family="Noto Sans CJK SC, sans-serif">Three common kinds of data leakage: exam questions in the question bank</text>
<g font-family="Noto Sans CJK SC, sans-serif" font-size="14" fill="#000000">
<rect x="40" y="60" width="280" height="170" rx="8" fill="#ffffff" stroke="#D55E00" stroke-width="1.8"/>
<text x="56" y="88" font-weight="bold" fill="#D55E00">Time travel</text>
<text x="56" y="114">Predicting today from tomorrow's data</text>
<text x="56" y="138">(randomly splitting a time series)</text>
<text x="56" y="170" fill="#999999">The model "remembers" the future,</text>
<text x="56" y="192" fill="#999999">and collapses the moment it goes live</text>
<rect x="340" y="60" width="280" height="170" rx="8" fill="#ffffff" stroke="#D55E00" stroke-width="1.8"/>
<text x="356" y="88" font-weight="bold" fill="#D55E00">Same-source repeats</text>
<text x="356" y="114">Two scans of the same patient</text>
<text x="356" y="138">one in training, one in test</text>
<text x="356" y="170" fill="#999999">The model knows "the person",</text>
<text x="356" y="192" fill="#999999">not "the disease"</text>
<rect x="640" y="60" width="280" height="170" rx="8" fill="#ffffff" stroke="#D55E00" stroke-width="1.8"/>
<text x="656" y="88" font-weight="bold" fill="#D55E00">Feature leaks</text>
<text x="656" y="114">The answer hidden in the inputs</text>
<text x="656" y="138" font-size="11.1">("refund amount" turning up among the inputs for</text>
<text x="656" y="158">"will this be refunded")</text>
<text x="656" y="190" fill="#999999">Perfect offline, zero live</text>
</g>
<text x="40" y="276" font-size="13.0" font-family="Noto Sans CJK SC, sans-serif" fill="#000000">The shared symptom: offline scores that are suspiciously high. An "accuracy of 99.9%" should make you suspect leakage before genius.</text>
</svg>